<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parallax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
    color: #fff;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .reloj {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0.12em;
    font-family: 'Anton', Impact, 'Arial Narrow', sans-serif;
    font-size: clamp(56px, 17vw, 190px);
    line-height: 1;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #ffffff 0%, #8d8d93 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .reloj .sep { opacity: .35; }
  .unidad {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .unidad .num { display: inline-block; text-align: center; }
  .unidad .nombre {
    margin-top: 10px;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: clamp(12px, 2.6vw, 18px);
    letter-spacing: 0;
    color: #8d8d93;
    -webkit-text-fill-color: #8d8d93;
  }
  .leyenda {
    margin-top: 22px;
    font-size: 13px;
    color: #8d8d93;
    text-align: center;
  }

  /* ───── Final: explosión + BIENVENIDO + link ───── */
  .reloj, .leyenda { transition: opacity .6s ease; }
  body.terminado .reloj,
  body.terminado .leyenda { opacity: 0; pointer-events: none; }

  #explosion {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }
  #destello {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #fff 0%, rgba(255,255,255,.6) 25%, rgba(255,255,255,0) 65%);
    opacity: 0;
    pointer-events: none;
    z-index: 1;
  }
  body.terminado #destello { animation: destello 1.1s ease-out forwards; }
  @keyframes destello {
    0%   { opacity: 0; transform: scale(.2); }
    12%  { opacity: 1; }
    100% { opacity: 0; transform: scale(2.2); }
  }

  #final {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
    pointer-events: none;
    z-index: 3;
  }
  #bienvenido {
    margin: 0;
    font-family: 'Anton', Impact, 'Arial Narrow', sans-serif;
    font-weight: 400;
    font-size: clamp(44px, 14vw, 170px);
    line-height: 1;
    letter-spacing: 0.04em;
    text-align: center;
    opacity: 0;
    background: linear-gradient(180deg, #ffffff 0%, #8d8d93 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  body.terminado #bienvenido { animation: golpe 1s cubic-bezier(.2, 1.4, .4, 1) .15s forwards; }
  @keyframes golpe {
    0%   { opacity: 0; transform: scale(.3); }
    60%  { opacity: 1; transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
  }

  #enlace {
    display: inline-block;
    padding: 14px 32px;
    border-radius: 999px;
    background: #fff;
    color: #000;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 16px;
    text-decoration: none;
    opacity: 0;
    pointer-events: none;
  }
  #enlace:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  body.terminado #enlace {
    animation: aparecer 1.6s ease 2.3s forwards;
    pointer-events: auto;
  }
  @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    body.terminado #destello { animation: none; }
    body.terminado #bienvenido { animation: aparecer .6s ease forwards; }
    body.terminado #enlace { animation: aparecer .6s ease .8s forwards; }
  }
</style>
</head>
<body>

<div class="reloj" id="reloj" role="timer" aria-live="off">
  <div class="unidad"><span class="num" id="h">00</span><span class="nombre">horas</span></div>
  <span class="sep">:</span>
  <div class="unidad"><span class="num" id="m">00</span><span class="nombre">minutos</span></div>
  <span class="sep">:</span>
  <div class="unidad"><span class="num" id="s">00</span><span class="nombre">segundos</span></div>
</div>
<div class="leyenda" id="leyenda">para el lanzamiento de Parallax</div>

<div id="destello"></div>
<canvas id="explosion"></canvas>
<div id="final">
  <h1 id="bienvenido">BIENVENIDO</h1>
  <a id="enlace" href="https://parallaxstream.my.canva.site/parallax">Entrar a Parallax</a>
</div>

<script>
  // ───── CONFIGURACIÓN ─────
  // Duración de la cuenta regresiva desde que la persona entra por primera vez.
  var DIAS = 4;
  // Si prefieres una fecha fija para todos, pon aquí la fecha (ej: '2026-10-05T00:00:00')
  // y deja de usar DIAS. Con null, cada persona empieza su propia cuenta al entrar.
  var FECHA_FIJA = null;
  // ─────────────────────────

  var CLAVE = 'parallax_inicio_cuenta';
  var fin;

  if (FECHA_FIJA) {
    fin = new Date(FECHA_FIJA).getTime();
  } else {
    var inicio = null;
    try { inicio = parseInt(localStorage.getItem(CLAVE), 10); } catch (e) {}
    if (!inicio || isNaN(inicio)) {
      inicio = Date.now();
      try { localStorage.setItem(CLAVE, String(inicio)); } catch (e) {}
    }
    fin = inicio + DIAS * 24 * 60 * 60 * 1000;
  }

  var h = document.getElementById('h');
  var m = document.getElementById('m');
  var s = document.getElementById('s');
  var leyenda = document.getElementById('leyenda');

  function dos(n) { return n < 10 ? '0' + n : String(n); }

  function tick() {
    var resto = Math.max(0, fin - Date.now());
    var total = Math.floor(resto / 1000);
    h.textContent = dos(Math.floor(total / 3600));
    m.textContent = dos(Math.floor((total % 3600) / 60));
    s.textContent = dos(total % 60);
    if (resto === 0) {
      clearInterval(timer);
      finalizar();
    }
  }

  // ───── Final: explosión ─────
  var terminado = false;

  function finalizar() {
    if (terminado) return;
    terminado = true;
    document.body.classList.add('terminado');
    var reducido = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reducido) explotar();
  }

  function explotar() {
    var canvas = document.getElementById('explosion');
    var ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var W = window.innerWidth, H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);

    var cx = W / 2, cy = H / 2;
    var escala = Math.max(W, H) / 900;
    var particulas = [];
    var colores = [0, 30, 48, 200, 280];

    for (var i = 0; i < 260; i++) {
      var ang = Math.random() * Math.PI * 2;
      var vel = (Math.random() * 14 + 2) * (0.6 + escala);
      var plateada = Math.random() < 0.55;
      particulas.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * vel,
        vy: Math.sin(ang) * vel,
        r: Math.random() * 3 + 1,
        vida: 1,
        decae: Math.random() * 0.012 + 0.008,
        color: plateada
          ? 'hsl(0, 0%, ' + (70 + Math.random() * 30) + '%)'
          : 'hsl(' + colores[Math.floor(Math.random() * colores.length)] + ', 90%, 60%)'
      });
    }

    function cuadro() {
      ctx.clearRect(0, 0, W, H);
      var vivas = 0;
      for (var j = 0; j < particulas.length; j++) {
        var p = particulas[j];
        if (p.vida <= 0) continue;
        vivas++;
        p.vx *= 0.97;
        p.vy = p.vy * 0.97 + 0.12;
        p.x += p.vx;
        p.y += p.vy;
        p.vida -= p.decae;
        ctx.globalAlpha = Math.max(p.vida, 0);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (vivas > 0) requestAnimationFrame(cuadro);
      else ctx.clearRect(0, 0, W, H);
    }
    requestAnimationFrame(cuadro);
  }

  var timer = setInterval(tick, 250);
  tick();
</script>
</body>
</html>
