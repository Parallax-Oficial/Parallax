## Capítulo 1: Nuevo Aire

Febrero 2025.

El vidrio del parabrisas tenía marcas de insectos. Martino apoyó la frente y miró hacia afuera, viendo campos, vacas y un galpón pequeño con letras verdes: Avigran.

La luz del mediodía entraba por la ventana y cubría el rostro de su madre, Marisa, dejando apenas su silueta. El celular vibró. Era un mensaje de Isadox. Quería juntarse esa noche. Martino pensó unos segundos, pero no demasiado. Aclaró que estaba de viaje. Otro mensaje llegó preguntando dónde estaba. Pero esta vez no contestó. En cambio, cambió su descripción de perfil: "Es momento de empezar, siento un nuevo aire". Guardó el celular y siguió mirando adelante, como si buscara algo en la ruta; entonces comenzó a recordar:

Antes, había estado en un viaje con su curso, sentado al lado de Isadox en un colectivo escolar que tenía olor a polvo y bolsas de snack abiertas. Ambos hablaban mientras el paisaje pasaba rápido por las ventanas.

Isadox: ¿quieres?
Martino: estoy lleno, pero gracias
Isadox: ¿lleno? No cuesta nada
Martino: ¿viste esta bolsa? Está llena de comida, con solo verla ya me llené
Isadox: a todo esto, ¿alguna maestra dijo algo de a qué mierda vamos?
Martino: no, quizás sí lo han dicho, pero no lo sé
Isadox: qué bien escuchas
Martino: ¿me estás jodiendo? Tú ni sabes
Isadox: ese día falté, tú no faltas nunca y no escuchas
Martino: ... ¿cómo vas con ella?
Isadox: ... estábamos hablando de lo más bien
Martino: ...
Isadox: ¿qué miras?
Martino: espero una respuesta
Isadox: no sé, bueno, se fue... está en Tostado
Martino: ¿Tostado? ¿Quién quisiera vivir ahí?
Isadox: su padre...
Martino: mira el lado bueno, ya no tendrás que depender de ella, estás libre prácticamente
Isadox: sí... ¿un nuevo comienzo, no?... aire fresco, un nuevo aire
Martino: ¿no crees que le queda mejor?
Isadox: ¿eh?
Martino: en vez de llamarse Tostado, suena mejor Nuevo Aire, podría hacer un cuento con ese título
Isadox: ¡jajaja! ¿Un cuento?
Martino: sí... cambiando de opinión, mejor no, me aburre leer, y escribir más
Isadox: me parece que llegamos...

Un golpe fuerte lo hizo levantarse apenas del asiento. El auto de su madre había caído en un bache. Marisa frenó despacio y luego siguieron. Más adelante, llegaron a la ciudad de Tostado. La casa de Luanisia tenía un muro bajo y un perro que ladraba sin acercarse. Luanisia y Marisa se abrazaron fuerte al verse. Martino no las miró, tomó las valijas y caminó directo hasta la habitación. Ordenó ropa y cables sin apuro y dejó la mochila en el piso. Se acostó boca arriba en la cama, sacó el celular y abrió Granito. Ahí estaban sus listas: metas, ideas, proyectos. Varias tachadas. Muchas no. Entró a la carpeta Freedoom.

Su cabeza cambió de ritmo. Caminaba en un set donde había actores preparados y luces encendidas. El piso sonaba hueco. Se acercó a Vasi, que escribía en su guion digital y movía figuras en una pantalla para animar una escena. Vasi señalaba líneas, ajustaba gestos y murmuraba cosas técnicas.

Martino: ¿el guion?
Vasi: mira, ¿ves esto? Dale a play
Martino: es... horrible
Vasi: ¡¿qué?!
Martino: es broma, me gusta, la animación se ve poco convencional
Vasi: hey, tengo una idea para un capítulo
Martino: te escucho
Vasi: ¿qué te parece dos niños que en noche de Navidad se topan con Santa?
Martino: ¿es en serio? Déjame decirte que ahora tendrás un puto aumento, ¡eres un genio!
Vasi: ¡alto! Aún no terminé, imagínate que ese Santa no es como crees
Martino: ...
Vasi: más bien, es un monstruo grotesco, intimidante, pero... es bueno con los chicos, sin importar si son buenos o malos
Martino: ... bien, es una idea simple
Vasi: lamentablemente ya escribí los seis capítulos de la serie, así que... no tendría sentido agregar otro capítulo más
Martino: sí, tienes razón... pero podríamos construir ese episodio en la siguiente temporada
Vasi: ... bien.

Martino entró al set principal. Una cámara lo seguía. Se sentó en su silla negra que decía "Director" y levantó la mano. Dio la orden: ¡acción! Todo se puso en movimiento. Ruido, voces y luces que giraban.

El sonido se cortó. La voz de su madre lo llamó desde la cocina. Bajó y se sentó en la mesa. La comida estaba caliente y el ventilador hacía ruido. Marisa hablaba con Luanisia sobre el viaje, sobre cosas que Martino no pidió escuchar.

Luanisia: después de tanto tiempo, años estando juntos, se le ocurre hacer esa mierda
Marisa: estaba notando comportamientos raros, parecía cansado... agotado, pero no entiendo de qué... no trabaja, todo lo hacía yo, un pequeño error ya era motivo de gritos y desorden
Luanisia: está viejo, enfermo y... el de arriba lo va a castigar
Marisa: ... lo que sí, yo no pienso volver con él, mi decisión está tomada: alejarme.

El celular vibró otra vez. Audios de Rubenio. Más de dos minutos cada uno. Martino los miró, dejó el teléfono a un lado y terminó el plato sin pestañar. Después fue al baño, cerró la puerta y apoyó la espalda contra la pared fría. Recién ahí puso play. Eran palabras mezcladas: insultos que se chocaban con disculpas, advertencias, culpas, y un tono que cambiaba sin sentido. Martino no respondió. Solo escuchó hasta el final. Luego guardó el celular en el bolsillo, mirando el suelo del baño como si ahí pudiera encontrar algo que lo calmara.

## Capítulo 2: Muerte Al Buen Día

1976.

Rubenio tenía nueve años. Su madre, Anita, le dio una bolsa tejida y le dijo que buscara troncos en el monte. Él salió sin discutir. Caminó por el sendero de tierra, despacio, mirando los árboles altos y el cielo apagado. El silencio lo siguió todo el camino. Apenas se movía el aire y las hojas hacían un ruido leve, como si no quisieran llamar la atención.

Al llegar, empezó a juntar ramas secas. Las cargó en la bolsa y en sus brazos. De pronto, escuchó un crujido fuerte detrás suyo. No quiso mirar. Soltó la leña y corrió. Corrió sin respirar, con la cara sucia y el corazón golpeando. Entró al pueblo, ese lugar de diez casas y un perro dormido en la entrada de la carnicería. Llegó a la suya, jadeando. Anita estaba frente al fogón, asando tortillas sobre la chapa caliente. Lo miró de reojo y le dijo que se acercara.

Anita: hijo... ¿quieres formar una familia?
Rubenio: ...
Anita: ¿no hablas? Te pregunté algo
Rubenio: ... sí
Anita: ¡¿sí qué?!
Rubenio: ... sí quiero
Anita: ¿qué quieres?
Rubenio: ... sí quiero tener una familia
Anita: ¿y sabes qué se necesita?
Rubenio: ... ¿amor?
Anita: huevos, necesitas ser valiente, hijo, necesitas cumplir con las obligaciones... necesitas ser quien se encargue de todas las responsabilidades
Rubenio: ...
Anita: si no puedes traer un poco de leña porque te asusta el monte, ¿qué mierda vas a poder hacer en tu vida?
Rubenio: ...
Anita: vas a volver y vas a traer todo lo que me imagino que juntaste, más te vale que no te asustes ahora
Rubenio: ... sí.

Rubenio salió otra vez al monte. Esta vez caminó más rápido, con rabia y vergüenza. Debía traer la leña sí o sí. Pero al llegar, no había nada. Todo estaba limpio, como si nunca hubiera trabajado. A lo lejos, dos chicos corrían llevando los troncos. Él los reconoció del pueblo. Les gritó "¡mocosos!" con la voz quebrada. Ellos ni se dieron vuelta. No quiso volver a casa con las manos vacías otra vez. Se quedó en el monte, sentado en la tierra, mirando el suelo. Pasó un rato largo. El sol bajó un poco. Se quedó quieto, como si esperara que alguien lo ayudara, aunque sabía que nadie iba a hacerlo. Para matar el tiempo, empezó a tirar piedritas a un tronco caído. A veces le daba, otras no. Después agarró un palo y empezó a golpear un arbusto seco hasta que las ramas se desarmaron. Cristián apareció entre los árboles. Venía cantando algo, como siempre. Lo vio tirado y se acercó. Lo agarró de las orejas y lo hizo parar. Rubenio trató de soltarse, pero él lo empujó para que caminara.

Regresaron al pueblo así, uno tirando y el otro arrastrando los pies. Llegaron a la casa. Anita estaba parada en la puerta, seria.

Anita: ¿qué te dije?
Rubenio: ...
Anita: responde
Rubenio: que traiga la leña
Anita: ¿y? ¿Dónde está?
Rubenio: ... me la robaron
Anita: ... ¡sos un inútil! Anda a tu cuarto
Rubenio: ...
Anita: ¡pará, pará! Primero te voy a decir que gracias a ti no vamos a poder comer... ¡Cristián!
Cristián: ¿sí?
Anita: ¿tenías hambre?
Cristián: ... sí
Anita: hoy no vamos a comer nada, ¿sabes por qué?
Cristián: porque tengo un hermano que no sirve para nada
Anita: ¿y qué más?
Cristián: ...
Anita: ¿no sabes?
Cristián: ... (negó con la cabeza)
Anita: los dos son unos inútiles.

Anita le dio un golpe fuerte en la nuca y él ni lloró. Lo agarró del brazo, lo llevó al cuarto y lo empujó para adentro. Ella sostuvo la puerta mientras hablaba, firme.

Anita: ¡ahora vas a ver cuando llegue tu papá!

Cerró la puerta de golpe. El padre llegó cuando el sol ya estaba cayendo. Anita salió a su encuentro, con los brazos cruzados y el ceño duro. Le dijo todo sin respirar. Él no dijo nada, solo asintió una vez y caminó hacia el cuarto. Entró, se sentó en la cama mirando a Rubenio.

Rubenio: ...
—¿tenías miedo?
Rubenio: me asusté un poco
—¿sabes qué me hubiera hecho el abuelo si se enteraba de que yo tenía miedo?
Rubenio: ...
—me hubiera colgado de las patas en un alambre que conecta la casa y el ombú
Rubenio: ...
—me dejaría ahí tres noches, durmiendo en la oscuridad, sin comer... sin que le importe una mierda
Rubenio: ... (baja la cabeza)
—cuando tengas miedo, no te vayas corriendo...

Buscó en el bolsillo y dejó un cuchillo pequeño sobre las manos de Rubenio. El filo estaba gastado, casi torcido. El padre se levantó y abrió la puerta. Antes de irse, dijo que no habría comida para él ese día ni el siguiente. No lo miró otra vez.

1992.

El pueblo seguía igual, solo más silencioso. Rubenio ya era mayor, con veinticinco años. Su madre, Anita, seguía mandando como siempre. Esa mañana le dijo que fuera a buscar un bolsón de carne que regalaba Pedroti, el carnicero. Rubenio caminó hasta la carnicería con la mirada baja. Allí, mientras agarraba el paquete, chocó con alguien. Era Marisa. Joven, con ropa limpia y una expresión curiosa, como si no entendiera por qué el pueblo estaba tan apagado.

Marisa: hola
Rubenio: ... Marisa, ¿cierto?
Marisa: ... sí, ¿nos conocemos?
Rubenio: tengo un amigo que me habló de ti, le dicen Churo
Marisa: ¡ah! Sí, sí, el... políticamente correcto
Rubenio: sí, jajaja
Marisa: (sonrió levemente)
Rubenio: no eres del pueblo, ¿no?
Marisa: no, vengo con mi madre y dos de mis hermanas, siempre venimos cuando Pedroti regala los bolsones
Rubenio: dicen que es carne en mal estado, que por eso las regala
Marisa: y bueno... de algo hay que vivir
Rubenio: sí...

Después de hablar un rato, la madre de Marisa apareció. Tenía ojos suaves y una voz que buscaba agradar. Se acercó a Rubenio con una sonrisa pequeña, como si ya lo conociera de algún lado.

Rubenio: hola
—¿Rubenio?
Rubenio: ...
—¡jajaja! Mira lo grande que estás, ¿no te acuerdas de mí?
Rubenio: ...
—no, claro que no, solo te vi cuando tenías apenas unos meses
Marisa: ¿en serio?
—¡sí! Lloraba todo el tiempo, tu madre era... ¡Anita! Siempre me decía que era el más llorón de sus hermanos, era como una niña
Rubenio: (volteó a ver hacia otro lado con la sonrisa que se desvanecía)
—¡jajaja! ¿Cómo estás? ¿Cómo anda tu madre?
Rubenio: bien, y... mi madre está algo enferma, pero eso no la detiene
—siempre dicen que se enoja mucho, ¿eso es cierto o son estupideces que dice el pueblo?
Rubenio: son mentiras... mentiras
Marisa: así que... ¿llorabas como niña?
Rubenio: no... bueno, no sé, mi madre es... dice muchas cosas de todos mis hermanos
—no digas que no es verdad
Rubenio: ... (baja la mirada)
—igualmente... que eso no te moleste, todos tenemos derecho a soltar nuestras emociones, ¿no es así, Mari?
Marisa: sí, no te sientas atrapado ni avergonzado
Rubenio: (las vio a los ojos por primera vez)
—¿nos vamos, Mari?
Marisa: ... sí, vamos, ¡nos vemos, Rubén!
Rubenio: ... nos vemos
—¡saludos a tu madre!

Se fueron. Rubenio volvió a su casa con el bolsón en la mano. Anita estaba esperando en la puerta, molesta. Apenas lo vio, le apuntó con el dedo y empezó a reclamarle por tardar tanto.

Anita: somos catorce en el pueblo, la gente no tarda tanto en buscar una bolsa llena de basura
Rubenio: perdón... estaba hablando con alguien
Anita: ¿con quién?!
Rubenio: nadie, no las conoces
Anita: conozco a todos, ¡a todos! Dime quiénes son
Rubenio: ¡basta! ¡Ya! No sigas
Anita: ... ¿qué me dijiste?
Rubenio: ...

El padre y Hugo, el otro hermano, interrumpieron. Hugo fue al cuarto donde estaba Cristián.

Rubenio: ...
Hugo: ¡Cristián! ¡Despertar, hijo de puta!
Cristián: ¡¿qué mierda pasa?!
Rubenio: hey... ¿qué pasa?
—Martino, dicen que lo vieron caer al agua
Rubenio: ... ¿eh?

El hermano más chico. Sin perder más tiempo, todos empezaron a buscarlo. Rubenio, Anita, el padre, Hugo, y hasta dos vecinos. El campo parecía más grande cuando algo faltaba. Llamaron su nombre, caminaron entre yuyos, revisaron detrás del galpón, cerca del molino, incluso en la huerta vieja. El silencio era más pesado que antes. Cuando llegaron a la zanja de agua que cruzaba el pueblo, lo vieron. Martino estaba ahí, quieto, flotando apenas, con el cuerpo trabado entre ramas y barro. Hugo gritó. Anita cayó de rodillas y lloró fuerte, sin taparse la cara. El padre se quedó quieto, con las manos en los bolsillos, sin mirar a nadie. Después simplemente se dio vuelta y se fue caminando, sin decir nada. Rubenio no quiso mirar, pero lo hizo igual. Sintió algo que no supo poner en palabras, una mezcla de vacío y rabia vieja. Se limpió la cara con el antebrazo, aunque las lágrimas seguían cayendo. A los pocos minutos, los vecinos se acercaron en silencio. Nadie sabía qué decir. Solo el sonido del agua moviéndose despacio, como si no le importara nada. El pueblo entero quedó quieto, mirando, hasta que se hizo de noche.

## Capítulo 3: Cada Día Puedo Ser Mejor

Febrero 2025.

Martino estaba sentado en el sillón, mirando la televisión. La serie que pasaban era algo aburrida. Frente a él, una libreta abierta y un bolígrafo en la mano. Anotaba rápido:
• Personajes vacíos
• Trama interesante, pero puede ser mejor
• Ideas buenas, hace falta locura

La luz del edificio de enfrente se encendió. Martino la vio, sonrió y volvió a escribir, más decidido. Sacó el celular y comenzó a descargar aplicaciones, probando herramientas para editar video y sonido. Esa noche se convirtió en un caos: errores en el audio, ediciones que no quedaban, frustración constante. Todo parecía demasiado complicado para un solo dispositivo y sin ayuda. La luz del exterior se apagó. Martino apagó las luces del departamento y se preparó para dormir.

Entonces notó que en la televisión estaba pasando el episodio final de la serie. Se sentó de nuevo. Observó el episodio completo y, de golpe, las cosas que antes le molestaban ahora le parecían interesantes. Lo entendió todo: los personajes, las decisiones, la estructura.

La luz afuera volvió a encenderse. Martino tachó todo lo que había escrito en la libreta y, con calma, terminó el primer episodio de su propia serie: Freedoom. El resultado era decente, lo suficiente para motivarlo a continuar. La frustración se disipó; las cosas empezaban a fluir. Esa misma noche logró terminar dos episodios más. Marisa se despertó, lo vio frente al celular y le dijo que ya era tarde: debía dormir. Martino apagó todo y se recostó. Sin embargo, la luz del exterior seguía encendida.

La alarma sonó y Martino se despertó con un salto. Apenas abrió los ojos, una prenda cayó sobre su cara. Era una remera suya. Antes de que pudiera quitarla, Luanisia entró al cuarto y le tiró otra muda de ropa. Martino se levantó despacio, todavía medio dormido, y ella lo observó con impaciencia.

Luanisia: cámbiate rápido, te llevaré a mi trabajo
Martino: ¿y para qué?
Luanisia: tienes que saber algo
Martino: ...

Minutos después, Martino iba sentado detrás de ella en la moto, sosteniéndose fuerte para no caerse. El viento le pegaba en los ojos, la calle estaba fría y el tráfico era ruidoso. Llegaron y Luanisia lo dejó en un escritorio sin decir nada más. Martino quedó solo, mirando alrededor sin entender mucho. Se sentó y empezó a abrir cajones. Primero encontró hojas comunes, lapiceras, una carpeta sin importancia. En el segundo cajón había papeles con nombres subrayados y fechas que fueron revisadas muchas veces. No entendía qué significaban. Siguió buscando hasta encontrar un documento con el nombre EFA, un instituto de educación agropecuaria. Lo leyó rápido. Vio la firma de Luanisia y otra firma que no reconocía. De golpe escuchó un ruido: eran pasos acercándose, entonces cerró el cajón con fuerza; este se trabó, pero igual pudo cerrarlo sin problemas justo cuando entró una chica con una bandeja de desayuno. Ella lo miró curiosa.

—... ¿qué haces aquí? No puedes entrar a los escritorios
Martino: soy hermano de Luanisia
—¿y? No puedes entrar, tienes que irte con los demás
Martino: ¿con quiénes?
—... tus compañeros
Martino: no entender
—... tú eres de...
Martino: de Bandera
—¡ah! Hubieras dicho eso antes
Martino: ...
—perdón, perdón, no sabía, te confundí con... no importa, dejo esto y me voy
Martino: ...

La chica se fue y Martino trató de respirar normal. A los segundos entró Luanisia.

Luanisia: ¿qué haces?
Martino: nada
Luanisia: ven, quiero que conozcas a mi jefe
Martino: ... todavía no entiendo para qué me trajiste
Luanisia: ya sé que estuviste viendo los cajones... ¿viste el documento de la EFA?
Martino: ... sí
Luanisia: bueno, algunos de sus estudiantes que van a comenzar ahí primero vienen aquí para aprender, es como un recorrido para evaluar
Martino: ¿y qué tiene que ver?
Luanisia: hace tiempo te envié un mensaje preguntando si querías venir a estudiar a la EFA
Martino: ...
Luanisia: nunca me respondiste, pero la cosa es que la hija de mi jefe quería conocerte, bueno... le llamabas la atención
Martino: ...
Luanisia: cambia esa cara
Martino: aún no entiendo
Luanisia: (suspira) ella es igual que tú, callada, introvertida y... nadie sabe más de ella, solamente que está viva y ya. Cuando hablé de ti, esa chica me empezó a preguntar más y más de... bueno, tú
Martino: ...
Luanisia: ahora sí, acompáñame.

Martino la siguió hasta afuera. El lugar no era un edificio con pisos, era más parecido a un complejo grande, con patios y corredores largos. Llegaron a un patio donde un hombre, Jonathan, los esperaba. Jonathan sonrió apenas lo vio.

Luanisia: aquí está, el único diferente de la familia
Jonathan: ¡hola! Me da gusto conocer a alguien no tan molesto como tu hermana
Martino: (sonrió de forma falsa)

## Capítulo 4: Normal Y Corriente

Febrero 2025.

Martino despertó por el murmullo de voces en la sala. Se quedó quieto un momento, tratando de entender quién hablaba. Caminó despacio y asomó la cabeza por el pasillo. Su hermana, Yolanda, y Marisa estaban sentadas en el sillón. No lo habían visto. Él solo observó unos segundos.

Bajó y cargó el bolso. Rubenio salió al patio apenas escuchó el auto. No dijo nada al principio. Saludó al conductor y tomó una bolsa para ayudar. Martino subió a su viejo cuarto. Cerró la puerta despacio. Se sentó en la cama, pero escuchó pasos. Pasos lentos, acercándose. La puerta se abrió.

Rubenio: ¿todo bien?

Rubenio lo miraba con los ojos húmedos. Su voz se quebró. Se abalanzó hacia él y lo abrazó, repetía la palabra "perdón" una y otra vez. Después se apartó y se encerró en su cuarto. Martino quedó sentado, sin saber qué hacer con ese momento. Se quedó mirando el piso, recordando cosas que no quería recordar, y el cuarto le pareció más pequeño de lo que era. Luego dejó que la mente siguiera sola:

Martino regresó de la plaza con Isadox ya de tarde. Habían hablado poco en el camino, y al separarse no hubo despedida larga. Solo un gesto con la mano. Martino caminó hasta su casa. Al llegar, vio a la vecina sentada en las sillas de afuera. Estaba mirando al frente, parecía escuchar. Cuando lo vio, no sonrió ni saludó, solamente se levantó al instante y entró rápido a la casa de al lado. Martino entró a su habitación, dejó la mochila y conectó su celular, que tenía poca batería. Miró la pantalla un segundo, sin interés. Después salió hacia la cocina para tomar agua. No tenía sed real, pero quería caminar adentro un poco. Mientras llenaba el vaso, escuchó un ruido suave. Miró hacia el pasillo. Marisa salía del cuarto de Rubenio caminando lento. Sin mirarlo, fue directo al cajón de los utensilios. Lo abrió y sacó un cuchillo de cocina. Lo sostuvo con la mano firme y lo miró de cerca, sin expresión. Luego lo guardó en el mismo lugar, con cuidado. Cerró el cajón y siguió caminando hacia otro sector de la casa. Nunca levantó la cabeza para verlo. Martino tomó el agua sin apuro.

Martino abrió los ojos. Volvió al presente, pero no quería; se acostó y cerró los ojos. Volviendo al recuerdo:

Marisa terminaba de cocinar. El olor era normal, nada especial. Ella lo llamó y le pidió que avisara a Rubenio que la cena estaba lista. Martino fue hasta el cuarto. Abrió la puerta. Rubenio estaba acostado, mirando fijo al techo. Los ojos rojos, como si algo lo estuviera rompiendo desde adentro. Martino dijo que la comida ya estaba. Rubenio respondió "no", sin mover la mirada. Era un "no" seco, sin fuerza. Martino volvió a la mesa y se sentó. Comió en silencio sin hambre real. La comida tenía gusto, pero no uno claro. Marisa estaba enfrente, callada.

Volvió al presente otra vez. Martino volvió en sí por el sonido del celular, un mensaje de Yolanda: ¿Dónde estás? Él respondió con lo justo. Puso el teléfono a un lado. A los pocos minutos, se escuchó un auto frenar afuera. Martino tomó la mochila sin dudar. Salió del cuarto y bajó. Subió al auto y apenas cerró la puerta, Rubenio salió al pasillo. Lo vio desde la entrada, ya sentado, y levantó la mano apenas.

El auto arrancó y Martino no miró atrás, sonrió, sintiéndose orgulloso de no haberlo saludado. Llegó a la otra casa. Apenas entró, sintió rechazo por la suciedad y el desorden. Martino sintió que necesitaba bañarse solo por estar parado ahí. Entrar al baño era peor. El agua caía y parecía polvo líquido. Lavarse no ayudaba en nada. En la cocina, casi nada. Sin vasos ni platos limpios. Los pocos que había estaban pegajosos y con manchas viejas. La heladera tenía una sola bandeja con comida que parecía olvidada desde hacía años. El olor no era fuerte, pero sí desagradable. Martino se acostó un rato, pero la cama se sentía como barro seco, como si lo empujara hacia abajo. No quería estar ahí ni un minuto más. Yolanda empezó a llamarlo. Dijo que iba a llevarle comida. Mientras esperaba, Martino se quedó quieto, mirando el techo. De a poco empezó a imaginar otra escena: una gala de premios. Su nombre anunciado. Recibía un premio por su serie Freedoom. Lo aplaudían. Él subía al escenario. Sonreía. Agradecía, pero nadie de su familia lo acompañó, nadie estaba viendo sus logros. Golpearon la puerta. Volvió a la realidad. Yolanda dejó un plato y una gaseosa en la mesa y se fue rápido. Martino comió; incluso la comida se sentía diferente, por más que era de su favorita. Cuando terminó, se acostó. Tenía que dormir temprano para el día siguiente.

Al amanecer, se levantó, se cambió con el uniforme y salió. El barrio era desconocido y silencioso. Al llegar al colegio, había pocos alumnos. Todos volvían antes para rendir materias pendientes. Entró a su salón. Reconoció caras, pero no hubo emoción. Recordó cómo eran todos, lo que habían hecho, los problemas. No se detuvo en eso. Fue directo a su asiento. Esta vez solo. La profesora repartió las hojas del examen. Martino respondió sin problemas. Terminó quinto. Salió al pasillo y se sentó en el piso a esperar. No notó que había alguien al lado hasta que se movió. Era Regina, también sentada en el suelo.

## Capítulo 5: Cada Día, Cada Semana, Cada Año

Diciembre 2025.

Un auto se detuvo frente a la casa. Rubenio y Marisa salieron al ver que era Anabel, su hija, que vivía lejos. Martino la miró desde la ventana, sin expresión. Luego se fue a su cuarto. El hijo de Anabel entró corriendo a la casa y subió al cuarto de Martino, lo saludó. Martino le sonrió y lo abrazó un segundo. El niño salió corriendo y Martino cerró la puerta enseguida. Tomó su celular y se sentó en la cama. Abrió una aplicación de inteligencia artificial para empezar a contarle lo que sentía y lo que pasaba en su cabeza.

Martino: me siento... apagado, sin uso, pero que a la vez me usan todo el tiempo
—parece que estás experimentando una mezcla de emociones contradictorias. Por un lado, te sientes sin energía, sin propósito, como si no estuvieras siendo útil o no estuvieras haciendo lo que deberías. Por otro lado, sientes que estás siendo utilizado por otros, que están aprovechándose de ti o que no te están dando el espacio que necesitas.
Martino: ... ¿sí?
—sí, estoy aquí para ayudarte, ¿para qué me necesitas?
Martino: no, o sea... me refiero a que si realmente crees que me sucede eso
—no tengo información de cómo te sientes hoy, pero podrías contarme para entender tu situación, ¿qué es lo que te sucede?
Martino: ... bueno... hoy vino mi hermana luego de dos años sin verla, y siento que se me suma un peso, las visitas no me gustan, cada vez que alguien viene es donde comienza mi uso ilimitado, cuyas baterías... no son para siempre
—entiendo. Parece que la visita de tu hermana te ha generado ansiedad y estrés porque anticipas que vas a tener que dedicarle tiempo y energía, y eso te preocupa porque sientes que ya estás agotado.
Martino: no, o sea, sí, pero es que siempre me están usando... ¿tú qué harías si tu familia no te deja descansar solamente para hacer esto, esto, lo otro y otro sin un puto descanso de mierda? Lo mínimo que pido es salir, tener mi mundo... mandar yo
—parece que te sientes abrumado y explotado por tu familia. Es comprensible que quieras tener tu propio espacio y tiempo para ti mismo, y que te sientas frustrado cuando no se respetan tus límites.

Martino terminó de escribir. Cerró la aplicación y la borró del celular. Rubenio lo llamó desde el pasillo. Martino salió rápido y se paró al lado de él, quieto, recto, como si esperara órdenes.

Rubenio: ¿no saludas a tu hermana?
Martino: ¿estoy obligado a saludar a todos?
Rubenio: sí, es lo que hace un buen hijo, un hombre educado
Martino: ¿y si no me importa ser educado?
Rubenio: ve a buscar la bicicleta del vecino, que te la preste
Martino: ...

Martino caminó por la calle buscando la bicicleta. Pensó en muchas formas de irse para siempre. Ninguna le convencía, pero las repetía igual. En el camino se cruzó con Yolanda.

Yolanda: ¿qué haces? ¿A dónde vas?
Martino: busco una bici...
Yolanda: bueno, no tardes, porque la última vez estuviste casi dos horas y preocupaste a todos
Martino: ... sí

Yolanda pasó a su lado sin mirarlo más de lo necesario. Martino siguió caminando. A pocos metros vio a una madre discutiendo con su hijo. El chico trataba de justificarse. Ella estaba cansada. Se escuchaba la palabra "dinero" varias veces. Martino sonrió apenas, como si eso le confirmara algo. Regresó con la bicicleta y se la dejó a Rubenio. Se dirigió al cuarto de Yolanda, miró a los lados para asegurarse de que Yolanda no estaba. Abrió su bolso escondido y sacó una gran cantidad de dinero. Lo observó un segundo, pensó en guardarlo, pero luego comenzó a romperlo en pedazos pequeños. Un ruido sonó en el pasillo. Martino se metió al armario sin hacer ruido. Tenía aún los pedazos de dinero en la mano. Yolanda entró. Tomó su bolso, revisó algo y se fue. Antes de salir del armario, notó un hueco dentro. Metió la mano y sintió una hoja doblada; al sacarla, la guardó en su bolsillo y salió del armario. Se sentó en la cama. Abrió la hoja. La letra era clara, parecía apurada, escrita a mano. Pertenecía a Yolanda, pues su nombre estaba escrito; el título era "Mi Triste Historia":

"Tenía ocho años y pasaba horas junto a mi prima. Un día, con mi prima, nos escapamos al campo del vecino; en ese momento estábamos en el campo del padre de mi prima. Empezamos a recolectar el maíz, a ambas nos encantaba el maíz, pero tomar el maíz del vecino era robarle. Fue entonces, con mucha mala suerte, mi prima me grita que una camioneta se acerca, no tuve tiempo de reaccionar. La camioneta se acercó lo suficiente, quien la manejaba era el vecino, lo peor no era eso, lo peor es que quien lo acompañaba era mi papá, aunque me gusta llamarlo solamente por su nombre, Rubenio. Apenas me ve, se baja de la camioneta y empieza a gritarme, yo estaba avergonzada porque mi prima estaba viendo todo, y lo peor, el vecino también. Mi padre volvió a gritarme y cada vez era peor, me tiró de los pelos y recuerdo que me arrancó un mechón, yo empecé a llorar tanto que me dispuse a suicidarme por la vergüenza. Mi padre, para callarme, me golpeó repetidas veces. Le tomó la mano a mi prima y a la fuerza la hizo subirse a la camioneta, la camioneta comenzó a alejarse y me dejaron sola. Caminé hasta el campo y sentía que mis pies salían de mi cuerpo, caminé tanto que tuve dolores intensos toda la semana.
Odio toda esa situación, si tengo la culpa, pero no era para tanto. Pero claro, a mi hermana Leisa jamás le pasa nada, es la favorita de Rubenio, tanto así que cuando hace algo malo él no la castiga y me echa la culpa a mí. Desearía que nunca hubiera nacido".

Martino terminó de leer. Apoyó la hoja sobre su pierna. La miró unos segundos más. Miró la puerta, como asegurándose de que nadie estuviera ahí. Guardó la carta dentro de un cuaderno viejo lleno de hojas sueltas. Se quedó sentado mirando el piso.

No pensó en decirle nada a nadie. No pensó en proteger a nadie. Solo respiró despacio, como si nada lo sorprendiera.

Febrero 2025.

Martino no hacía nada. Se sentó en la silla mirando la pared vieja. Revisó la hora en su celular. Suspiró. Marcó el número de Isadox, pero este no atendió. Dejó el teléfono sobre la cama. El silencio era pesado. El tiempo no avanzaba. Quería irse de esa casa, de esa ciudad, volver a Tostado y no ver a nadie más.

Diciembre 2025.

La puerta se abrió y llegaron nuevas visitas: su tía y su prima. Guardaron sus bolsos como si el lugar fuera normal. Para Martino no lo era. Apenas las vio, se endureció. Entró rápido a su cuarto. Golpeó la pared fuerte dos veces, sin pensarlo. Tomó su carpeta vieja y arrancó varias hojas sin cuidado. Entre esos papeles, encontró la carta de Yolanda. La miró un segundo. No sintió nada. La pegó con cinta, salida y torcida. La llevó al cuarto de Yolanda y la dejó sobre su cama. Puso su celular a grabar, apoyado en el escritorio, escondido de la vista. Quería capturar el momento y verla quebrarse. Su meta era simple: verla llorar, pues nunca lo hacía. Para él sería una victoria. Unos minutos después, Yolanda volvió. Saludó a las visitas. Caminó al cuarto. La puerta se cerró. Martino se pegó a la pared, con el oído clavado. Al poco tiempo escuchó el llanto. Primero bajo, luego más fuerte. Era real. Era profundo. Martino cerró los ojos para escuchar mejor. Para grabarlo en la memoria. Después de años de verla dura, distante, llena de rabia... ahí estaba, rota. Yolanda salió y fue al baño. Cerró la puerta y no salió por horas. Martino entró al cuarto. Tomó su celular. Se sentó en su cama. Le dio play. Vio el rostro de Yolanda transformarse, destruirse. Vio sus manos temblar. Vio cómo intentaba contenerse sin éxito. Y de repente, sintió que algo se le movía por dentro. Algo que no esperaba.

Sus ojos se llenaron. No lo detuvo.

Se le cayó una lágrima. Luego otra. Pausó el video. Lo borró sin dudar. Dejó el teléfono a un lado. Pensó en voz baja, casi como si le hablara a nadie: quería hablar de eso con alguien. Pero el cuarto estaba vacío. Y, como siempre, nadie respondió.

## Capítulo 6: Cosas De Hombres

Nueve Años Antes (2016).

Yolanda se despierta en la madrugada por ruidos en el baño, ruidos torpes, como algo cayendo y moviéndose sin cuidado. Se levanta sin apuro, camina hasta la puerta y la abre. Sitichi está en el suelo, ebrio, semidesnudo. Yolanda lo mira unos segundos, no dice nada, y vuelve a la cama. Se acuesta mirando el techo y respira hondo sin estar sorprendida. Al amanecer, ella se levanta y hace su rutina sin molestar. Mientras prepara el desayuno piensa en todo lo que pasó en los últimos meses. Se siente cada vez más sola y esa soledad ya no la lastima, solo le confirma que todo está terminado. Sitichi llega siempre tarde, sin avisar, y cuando vuelve trae mal olor, deja los zapatos tirados, rompe cosas sin querer y nunca limpia. Yolanda ya no discute, no reclama, simplemente deja de esperar. Al mediodía, Yolanda cocina solo para ella. No prepara de más. Pone el plato en la mesa, come lento, mirando un punto fijo en la pared, tranquila. Luego de dos horas, Sitichi llega y mira la cocina buscando comida. Cuando no ve nada, le reclama molesto, como si fuera obvio que debía tener algo listo para él.

Yolanda: perdón, pero estoy harta de cocinar y calentar la comida porque llegas tarde, ahora prepárate tú la comida
Sitichi: ... ¿yo?
Yolanda: sí, aprende, yo ya me cansé
Sitichi: eres una puta malagradecida, te doy dinero para que lo gastes en lo que quieras y aun así...
Yolanda: no, el dinero no resuelve nada
Sitichi: ... ¿ya no me amas?
Yolanda: no, ya no
Sitichi: ...
Yolanda: puedo irme, puedo volver a la casa de mis padres y conseguir trabajo, pero yo ya... ya no quiero esto, o al menos no si tú estás
Sitichi: ... bien, me iré yo, quédate con todo, tú sí la vas a cuidar... si necesitas algo... no dudes que no estaré para ti
Yolanda: ... solo quiero que te vayas.

Sitichi se quedó inmóvil, sin reacción exagerada. Esa misma noche recoge algunas cosas y se va. Cuando la puerta se cierra, Yolanda se queda en medio del living, mira alrededor, respira y sonríe. Enciende la música fuerte, cocina algo simple y baila mientras revuelve la sartén, feliz de escuchar solo su propia voz.

Dos Años Después (2019).

La casa está ordenada, silenciosa y con olor a limpio. Yolanda llega acompañada de Germán, entran besándose y ella empuja la puerta con la espalda hasta cerrarla. Caminan directo al cuarto riendo y Germán se va desabrochando la camisa antes de que la puerta se cierre. Diez meses después, Yolanda es llevada de urgencia al hospital. Tiene contracciones fuertes y está agotada, pero se mantiene firme. Después de horas, nace su hijo, Octavi. Germán se emociona y la mira con orgullo; Yolanda sostiene al bebé, sonriendo, aunque por dentro aparece una sombra rápida del recuerdo de su propio padre, algo que no muestra en el rostro, solo en el silencio.

Dos Años Después (2021).

La relación con Germán cae. Yolanda se vuelve muy molesta con él, lo critica frente a visitas, lo interrumpe y lo deja mal parado en cada discusión. Él intenta mantener la calma, pero un día decide terminar la relación y vuelve con su ex, con la que ya tenía dos hijos. Yolanda no llora ni le suplica. Se queda en la casa con Octavi, y empieza una vida sola con él. El niño es rebelde, inquieto, y cuando algo no le gusta lo deja claro. Igual que ella.

Una noche, como aquella noche en que Sitichi se fue, Germán aparece borracho. No habla claro, entra sin pedir permiso y en un impulso golpea a Yolanda y después a Octavi. No dura demasiado porque se va tambaleando sin poder mantenerse firme. Yolanda recoge a su hijo y lo abraza fuerte, pero ni ella ni el niño lloran; se quedan quietos, tensos, con una expresión que parece enojo más que tristeza. A la mañana siguiente, toda la familia lo sabe. Rubenio agarra un bate sin decir nada, va a la casa de Germán y golpea las manos contra el portón para llamar la atención. Sale el hijo menor de Germán y Rubenio le pregunta por su padre. Germán aparece y, al ver el bate, empuja al niño hacia adentro de la casa. Rubenio pasa el portón sin pedir permiso y levanta el brazo listo para golpearlo, pero Germán suplica que lo escuche antes de hacer cualquier cosa. Más tarde, Rubenio vuelve a su casa, entra sin mirar a nadie y sigue derecho para buscar a Yolanda. Está lleno de bronca y camina firme, pero cuando la mira no la toca.

Rubenio: ... dime la verdad
Yolanda: ...
Rubenio: te escucho, dime la puta verdad
Yolanda: no sé de qué me...
Rubenio: ¡la verdad! Eso quiero, estoy harto de todo, esta mierda ya nos va a meter en un juicio y es por tu culpa. ¿Estuviste acostada con más hombres?
Yolanda: ¿qué? ¿Eso es lo que él te dijo?
Rubenio: la verdad, dime la verdad
Yolanda: no, jamás estuve con otro hombre que no haya sido él
Rubenio: dice que lo trataba mal, como un puto perro... eso no se hace, es lo peor que puedes hacer
Yolanda: ...
Rubenio: dime ahora la verdad... ¿le gritabas? ¿Lo insultabas?
Yolanda: ... sí
Rubenio: ...

Después de hablar, Octavi se pone entre su madre y Rubenio. Es chico, apenas dos años, pero se planta firme con los puños apretados y los ojos lagrimosos. Rubenio respira hondo al verlo y baja la mirada. Sabe que no puede seguir. Llama a un amigo y le pide un lugar para quedarse por un tiempo. Prepara sus cosas sin hacer ruido, no explica mucho, y se va. No dice cuándo vuelve. Solo se aleja.

## Capítulo 7: Lujos

Garilda: ¿te gustó el regalo?

Un Año Antes (2024).

Cumpleaños de su madre, Garilda estaba sentada en el living revisando el celular sin prestarle mucha atención a la reunión familiar, cuando recibió un mensaje de Mauricio felicitando a su madre. Ella lo leyó, lo pensó un segundo y respondió:

Garilda: ¡te acordaste!
Mauricio: ¿cómo no? Es mi mujer

Mauricio: aprovechar todas las oportunidades, o... inventar algunos escapes

A partir de esa fecha empezaron a hablar más seguido, primero por cortesía, luego por costumbre, y sin darse cuenta ya era normal que uno apareciera en el teléfono del otro todos los días. Había noches en las que las conversaciones se extendían hasta que alguno se quedaba dormido con el celular en la mano, aunque nunca lo decían. Una tarde, mientras hablaba con él por mensajes y escuchaba música en sus auriculares, Garilda tenía su carpeta abierta y sin pensarlo escribió una frase que estaba sonando en la canción: "La soledad es el último lujo que me queda". La dejó ahí, cerró la carpeta sin darle importancia y siguió escribiendo algunas cosas en el celular hasta que decidió ir al baño, donde se lavó la cara y se miró unos segundos al espejo sin pensar en nada concreto. Después acomodó un mechón de pelo que le molestaba, respiró hondo y volvió a su cuarto. Cuando entró, vio a su madre, Adaline, parada junto a la cama con la carpeta abierta. La frase estaba ahí, expuesta, en medio de la hoja. Garilda no avanzó. Adaline tampoco habló de inmediato, pero el ambiente dejó claro que ya había sacado alguna conclusión sin preguntar nada primero.

Adaline: siéntate, aquí a mi lado
Garilda: ... ¿qué sucede?
Adaline: ¿qué es esto? Tú lo escribiste, ¿verdad?
Garilda: pues...
Adaline: ¡sí! Claramente fuiste tú, ¿quién haría un chiste así?
Garilda: ¡no! Lo que pasa es que no lo escribí porque escuché una canción, solo por eso, lo hice sin pensar
Adaline: ¿una canción? ¿Escuchas esas canciones?

Adaline bajó las escaleras con paso rápido y llamó a Rodolfo, quien llegó poco después con una actitud relajada, como si no creyera que era para tanto, pero aun así estuviera dispuesto a seguir el plan sin discutir.

Adaline: lleva a tu hija al psicólogo
Rodolfo: ¿otra vez? Ya lo hicimos el año pasado

Garilda se subió al auto porque sabía que decir algo no iba a cambiar nada. Rodolfo encendió el motor y sonrió sin explicación, como si se hubiera acordado de un chiste.

Garilda: ...

Rodolfo empezó a conducir por calles que no llevaban a ningún lado importante. Paró en un kiosco y compró una bebida fría que dejó en el portavaso sin abrir, y luego siguió conduciendo hacia zonas alejadas donde no parecía haber un propósito claro. Hizo una pausa en una gomería, habló un poco con un desconocido sobre algo irrelevante, y después volvió al auto. Ninguno dijo nada durante todo el trayecto, y el día se fue apagando sin que nadie mencionara la razón por la cual habían salido. Cuando regresaron, ya era tarde. Garilda fue a su cuarto y encontró su cama cubierta de exámenes antiguos, todos ordenados como si alguien quisiera recordarle resultados, errores y aciertos que ella no había pedido volver a ver. Se quedó de pie mirando los papeles hasta que Adaline apareció en la puerta y no intentó moverse ni ordenar nada, simplemente esperó a que Garilda reaccionara.

Garilda: ... ¿ahora qué?
Adaline: esto, todo esto, ¿qué piensas al verlo?
Garilda: ... ¿aprobé?
Adaline: ¡sí! Pero no como deberías, ¡mira! Puras notas bajas, ¡nueve, nueve y más nueves! Si no te esfuerzas como debes, jamás tendrás todo lo que tu padre y yo logramos, ser felices
Garilda: sí, sí, ya entendí, estudiar más

Garilda: ...

A la mañana siguiente, Garilda llegó temprano al colegio y se sentó en el aula a estudiar para el examen, pasando las hojas con calma pero con la presión visible en sus manos y en la forma en que revisaba cada línea dos veces. Mauricio llegó también más temprano de lo habitual y se sentó a su lado sin pedir permiso ni saludar en voz alta, inclinándose para ayudarla a repasar algunos puntos que ella dudaba.

Garilda: ¿tú? ¿Ayudando al prójimo? ¿Debo sentirme privilegiada?

Garilda: para tener un buen futuro
Mauricio: ... sí, justo por eso.

El ambiente era tranquilo, casi íntimo, y sin darse cuenta dejaron de estudiar. Permanecieron inclinados hacia el mismo cuaderno, respirando cerca sin hablar. No hubo ningún movimiento brusco ni duda marcada; simplemente se besaron, con naturalidad, como si fuera lo único que tenía sentido en ese momento y no necesitaran explicarlo. En ese momento, entra Isadox en silencio. Mauricio abre sus ojos y lo ve, automáticamente se aparta de Garilda.

Garilda: ¿qué pasa?
Mauricio: ...
Garilda: (voltea) ...
Isadox: yo... solo venía a poner mi mochila en mi asiento, ya me iba.

En puro silencio, uno incómodo, cuyos únicos sonidos eran los de los pasos, y las sillas y mesas con las que Isadox se golpeaba con torpeza. Isadox, antes de irse, le dice a Mauricio que lo acompaña.

Garilda salió del aula después del beso y fue al baño. Se miró al espejo, se pasó las manos por el cabello y trató de acomodarlo como lo había hecho aquella vez en su casa. Se lavó la cara sin mojar demasiado, respiró y volvió caminando sin prisa, como si necesitara que el tiempo avanzara lento.

Martino estaba en el patio con Santillán, apoyados contra una pared sin hacer nada importante, solo comentando cosas del día. En ese momento llegó Isadox, caminando decidido hacia ellos, y Martino levantó la vista porque entendió que venía directo a hablarles.

Tres Meses Después.

Garilda estaba viviendo un momento difícil con Mauricio. Él respondía menos, se mostraba lejano aunque estuvieran cerca, y ella seguía intentando mantener la conexión sin perder paciencia. Las charlas largas ya no eran tan largas y, aunque ella seguía mostrando cariño y dedicación, sentía que él se estaba apartando sin decirlo. Una mañana en clase, Martino se sentó a su lado a preguntarle cómo estaba. Garilda intentó hablar sin mostrar mucho, pero Martino entendió igual.

Martino también tenía lo suyo, aunque fuera más simple. Lo llamó "aparentar". Para él, aparentar era mostrarse como un escritor que buscaba visitas, aun si todavía no sabía bien qué estaba haciendo. En diciembre de 2024 se unió a un grupo de WhatsApp de escritores llamado "Tinta Compartida". Ahí se hizo pasar por alguien que solo quería leer y recibir lecturas, pero poco a poco dejó ver que su intención era distinta. No lo decía de frente, pero buscaba usarlos para conseguir seguidores. Dentro del grupo debía leer a los otros y darles visitas, y ellos hacían lo mismo con él. Martino cumplía con eso porque sabía que le servía, pero además empezó a hablar por privado con uno de ellos. No hablaba solo de escritura; hablaba de sus proyectos y de cosas personales. Así conoció a Máximo, un programador. Máximo era más concreto: se dedicaba al desarrollo web y entendía de diseño y estructura. Martino se enganchó con la idea de tener una página web propia para publicar sus historias y atraer más gente. Entre ambos empezaron a planear un sitio donde publicarían sus escritos. Lo llamarían "Living".

El nombre fue un problema desde el primer día. Para Martino tenía sentido, pero para Máximo no representaba nada. Martino insistió varias veces hasta que lo convenció con una promesa: "en un futuro lo podemos cambiar". Máximo aceptó, aunque ya mostraba menos interés. Igualmente continuaron trabajando. Se comunicaban casi todos los días. Martino seguía los avances, opinaba y hacía cambios. En mayo, con ayuda de Matías, anunció la página web. Matías logró hacerle algo de publicidad, pero fue limitada y no generó demasiado movimiento. Aun así, alcanzó a llegar a algunos lectores del colegio donde Matías estudiaba. Gustavo se mantuvo cerca y le daba consejos constantes. Uno de ellos fue claro: Martino debía hacerse cargo de todo el proyecto. Según Gustavo, Máximo no iba a seguir ayudando y era mejor que Martino se quedara con la página por completo. Estefanía también intervino y le consiguió cursos online de programación web para que se formara.

Martino tomó otra decisión. En lugar de seguir a Máximo, decidió apropiarse del proyecto y descartar casi todo lo que ya habían pensado. Tampoco aceptó los cursos; en su lugar eligió una aplicación sencilla para programar, aun sabiendo que eso lo limitaría más adelante. Matías volvió a hacerle promoción a la página y esta vez logró que algunas personas más la vieran. Martino empezó a recibir seguidores y una pequeña cantidad de éxito. No era grande, pero era algo. Y ese "algo" fue lo suficientemente fuerte para marcar un cambio en él. Martino pasó de hacerlo por gusto a convertirse en el único estudiante de su colegio que recibía dinero por lo que hacía. Eso lo empujó aún más hacia su proyecto. Se volvió exigente consigo mismo y con los demás. Esa actitud provocó discusiones con Estefanía. Ella decía que Martino estaba cambiando, que se estaba volviendo egoísta. Él no lo veía así, pero la distancia igual creció.

Gustavo y Matías siguieron apoyándolo, aunque cada vez menos.

Así nació Living. Una página web que terminó convirtiéndose en el espacio central de todo lo que Martino creaba. Un lugar que empezó como un proyecto compartido y se volvió enteramente suyo.

Falagar: ... ¿la vida es injusta?
Martino: sí, es irónico, ¿verdad? Mlive significa "estoy vivo", Living es literalmente "vivo"
Falagar: ... ¿puedo hacerte mi última pregunta?
Martino: claro
Falagar: ... pasaste por muchas cosas, pero ¿eres feliz?
Martino: ... ¿sabes qué es lo peor de la felicidad?
Falagar: ...
Martino: no poder compartirla, entonces no eres feliz
Falagar: ... creo que por fin terminamos.

Martino se levanta y corre unas cortinas de aquel oscuro lugar. Del otro lado hay un teatro amplio. Las luces lo apuntan y siente el calor en la cara. Falagar aparece por detrás del telón y le entrega un micrófono sin decir nada. Martino lo toma. Da unos pasos hacia adelante, pero el público está demasiado oscuro para distinguir rostros. Empieza a imaginar. Primero a su familia: Luanisia, Yolanda y Leisha en una fila. Su hermano Álex sentado con los brazos cruzados. Anabel al lado suyo, recta, seria. Más atrás, Rubenio y Marisa atentos, como si todo dependiera de lo que él dijera. Después ve a sus amigos: Garilda en primera fila, Isadox con la cabeza inclinada hacia un costado, Santillán con los ojos muy abiertos, Leiva con expresión neutral. También aparecen Estefanía, Gustavo, Matías y Adriana. Detrás, varias filas de tíos, primos y gente de su pasado. Todos lo miran sin moverse, esperando unas palabras. Martino entonces dice:

"¿Ven todo esto? Lo conseguí porque nunca fui como ustedes creían. Los hice mirar para otro lado mientras yo avanzaba. Pensaban que era un inútil, pero usé eso a mi favor. No me pesa haberlos manipulado, no me pesa haber herido a quien tuve que herir. Cada paso fue necesario. Todo lo que hice me trajo hasta acá. Y ahora lo digo sin miedo: estoy condenado al éxito."

El teatro estalla en aplausos. Martino cierra los ojos unos segundos. Cuando los abre, la imagen de su gente ya no está. Solo queda el público real, desconocido. Nadie más. Él baja el micrófono y camina hacia un costado del escenario. Se va sin mirar atrás.

Diciembre 2025.

Marisa maneja por la ruta. El auto avanza firme y Martino se sienta a su lado. Mira por la ventana, siguiendo los campos, los árboles aislados y las señales que pasan rápido; la verdad, no miraba nada, solo se imaginaba a sí mismo siendo exitoso. A sí mismo, nueve años después. Marisa dice algo y él gira apenas la cabeza.

Marisa: buenas noticias, la primera ya la sabes, ahora solo seremos tú y yo, la casa te va a encantar, y también me aumentaron el sueldo, creo que puedo llegar a ganar más que Luanisia
Martino: ¿qué hay de Rubenio? ¿Y Yolanda?
Marisa: Rubenio morirá solo en esa casa que se está cayendo a pedazos, y Yolanda... bueno, no sé qué pasará con ella, pero si sigue como sigue, las cosas terminarán mal
Martino: ...
Marisa: ... nuevo colegio, nuevos amigos, o eso espero
Martino: si logro hacer nuevos amigos quiero empezar algo, bueno, ahora que lo pienso... ya tengo un par de personas que pueden ayudarme, aunque debo hacer las paces
Marisa: a todo esto, ¿qué pasó con tus amigos de Bandera? No te despediste de nadie
Martino: ... realmente sí quería despedirme de ellos, pero... quizás esto sea lo mejor
Marisa: ¿y qué quieres hacer con tus... nuevos amigos?
Martino: no lo tengo muy claro, pero soy bueno para pensar rápido
Marisa: pues necesitarás algún lugar o algo para hacerlo, porque la nueva casa es tan buena que no quiero que hagas desorden
Martino: ...

Cuando terminan de hablar, Martino vuelve a mirar hacia afuera. A lo lejos aparece el galpón de Avigran. Es algo pequeño, cerrado, y siempre lo habían visto como un depósito más. Martino lo observa unos segundos y después dice en voz baja, pero seguro:

Martino: ya sé dónde puede ser el lugar
Marisa: (lo ve y sonríe).

Mi premio es el éxito, pero también es mi castigo.

The End
</script>

<script>
(function(){
  var TITLE = 'Eternamente Vivo';          // título de la obra
  var INTRO = 'Parallax presenta...';
  var FADE = 450, INTRO_MS = 3000;
  var KEY = 'parallax-progreso:' + TITLE;
  function save(n){ try{ localStorage.setItem(KEY, String(n)); }catch(e){} }
  function clear(){ try{ localStorage.removeItem(KEY); }catch(e){} }
  function load(){ try{ var v = parseInt(localStorage.getItem(KEY),10); return isNaN(v)?-1:v; }catch(e){ return -1; } }

  var stage = document.getElementById('stage'),
      box = document.getElementById('box');

  // ---- dividir párrafos muy largos en partes ----
  var MAXLEN = 600;
  function splitLong(s){
    if(s.length <= MAXLEN) return [s];
    var mid = s.length/2, best = -1, bestD = 1e9, re = /[.!?…”"»)]\s+/g, m;
    while((m = re.exec(s))){
      var cut = m.index + m[0].length;
      var d = Math.abs(cut - mid);
      if(cut > 80 && s.length - cut > 80 && d < bestD){ bestD = d; best = cut; }
    }
    if(best < 0){
      var sp = s.indexOf(' ', Math.floor(mid));
      best = sp < 0 ? s.lastIndexOf(' ', Math.floor(mid)) + 1 : sp + 1;
    }
    if(best <= 0 || best >= s.length) return [s];
    return splitLong(s.slice(0,best).trim()).concat(splitLong(s.slice(best).trim()));
  }

  // ---- parseo ----
  var items = [];
  document.getElementById('story').textContent.split('\n').forEach(function(raw){
    var l = raw.trim(); if(!l) return;
    var m;
    if((m = l.match(/^##\s*(Cap[ií]tulo\s*\d+)\s*:\s*(.+)$/i))) items.push({t:'ch',n:m[1],s:m[2]});
    else if(/^The End\.?$/i.test(l)) items.push({t:'end',s:l});
    else if((m = l.match(/^\*\*(.+)\*\*$/))) items.push({t:'tag',s:m[1]});
    else if((m = l.match(/^([A-ZÁÉÍÓÚÑ][^\s:]{0,24}):\s+(.*)$/))){ var dp = splitLong(m[2]); items.push({t:'dlg',n:m[1],s:dp[0]}); for(var k=1;k<dp.length;k++) items.push({t:'p',s:dp[k]}); }
    else splitLong(l).forEach(function(part){ items.push({t:'p',s:part}); });
  });

  function el(cls,txt,tag){var e=document.createElement(tag||'div');e.className=cls;e.textContent=txt;return e}

  function render(it){
    box.innerHTML='';
    if(it.t==='ch'){
      box.appendChild(el('big chnum',it.n));
      box.appendChild(el('big chname',it.s));
    }else if(it.t==='end'){
      box.appendChild(el('big title',it.s));
    }else if(it.t==='tag'){
      box.appendChild(el('tag',it.s));
    }else if(it.t==='dlg'){
      var d=el('p','');
      d.appendChild(el('who',it.n+': ','span'));
      d.appendChild(document.createTextNode(it.s));
      box.appendChild(d);
    }else box.appendChild(el('p',it.s));
  }

  // ---- control ----
  var i=-1, busy=true, stage_=0, finished=false;

  function show(fn){
    busy=true; stage.classList.remove('on');
    setTimeout(function(){ fn(); stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },FADE);
  }

  function prev(){
    if(busy||panelOpen||stage_!==2||i<=0) return;
    finished=false; i--; save(i);
    var it=items[i];
    show(function(){render(it)});
  }

  function next(e){
    if(e && e.type==='click' && e.clientX < window.innerWidth/2){ prev(); return; }
    if(busy||finished||panelOpen) return;
    if(stage_===1){ stage_=2; save(0); show(function(){i=0;render(items[0]);}); return; }
    if(stage_===2){
      if(i+1>=items.length) return;
      i++;
      var it=items[i];
      if(it.t==='end'){ finished=true; clear(); } else save(i);
      show(function(){render(it)});
    }
  }

  // ---- botones: capítulos y reinicio ----
  var panelOpen = false;
  var btnCh = document.getElementById('btnCh'),
      btnReset = document.getElementById('btnReset'),
      panel = document.getElementById('panel'),
      list = document.getElementById('list');

  function showUI(){ btnCh.classList.add('show'); btnReset.classList.add('show'); }
  function setPanel(o){ panelOpen = o; panel.classList.toggle('open', o); }

  items.forEach(function(it, idx){
    if(it.t !== 'ch') return;
    var b = document.createElement('button');
    b.className = 'chi';
    var t = document.createElement('b'); t.textContent = it.s;
    var s = document.createElement('span'); s.textContent = it.n;
    b.appendChild(s); b.appendChild(t);
    b.addEventListener('click', function(e){
      e.stopPropagation();
      setPanel(false);
      if(busy) return;
      i = idx; stage_ = 2; finished = false; save(idx);
      show(function(){ render(items[idx]); });
    });
    list.appendChild(b);
  });

  btnCh.addEventListener('click', function(e){ e.stopPropagation(); if(!busy) setPanel(true); });
  panel.addEventListener('click', function(e){ e.stopPropagation(); setPanel(false); });

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  });

  var armTimer = null;
  btnReset.addEventListener('click', function(e){
    e.stopPropagation();
    if(!btnReset.classList.contains('armed')){
      btnReset.classList.add('armed');
      armTimer = setTimeout(function(){ btnReset.classList.remove('armed'); }, 2500);
      return;
    }
    clearTimeout(armTimer); clear(); location.reload();
  });

  // ---- retomar o intro ----
  var saved = load();
  if(saved >= 0 && saved < items.length && items[saved].t !== 'end'){
    showUI();
    i = saved; stage_ = 2;
    render(items[i]);
    setTimeout(function(){ stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },200);
    document.addEventListener('click',next);
    document.addEventListener('keydown',function(e){
      if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();next();}
    });
    return;
  }

  // ---- intro ----
  setTimeout(function(){
    box.appendChild(el('intro',INTRO));
    stage.classList.add('on');
    setTimeout(function(){
      stage.classList.remove('on');
      setTimeout(function(){
        box.innerHTML=''; box.appendChild(el('big title',TITLE));
        stage.classList.add('on');
        setTimeout(function(){busy=false;stage_=1;showUI();},FADE);
      },FADE);
    },INTRO_MS);
  },200);

  document.addEventListener('click',next);
  document.addEventListener('keydown',function(e){
    if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();next();}
  });
})();
</script>
</body>
</html>
