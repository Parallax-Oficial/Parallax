<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muevete Al Minuto — Parallax</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--fade:450ms}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none}
body{font-family:'Inter',system-ui,sans-serif;cursor:pointer}
#stage{position:fixed;inset:0;display:flex;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  padding:calc(env(safe-area-inset-top,0px) + 32px) 28px calc(env(safe-area-inset-bottom,0px) + 32px);
  text-align:center;opacity:0;transition:opacity var(--fade) ease}
#stage.on{opacity:1}
#box{max-width:34rem;width:100%;margin:auto}
#stage::-webkit-scrollbar{display:none}
.intro{font-size:1.1rem;letter-spacing:.08em;font-weight:400}
.big{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:1.05;letter-spacing:.02em}
.title{font-size:clamp(3rem,16vw,6rem)}
.p{font-size:1.15rem;line-height:1.7;text-align:left;font-weight:400}
.tag{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:1.5rem;text-align:center;line-height:1.3;margin:1.4rem 0 .6rem}
.who{font-weight:600}
.ui{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:10px;z-index:5;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;background:none;border:0;color:#fff;
  opacity:0;pointer-events:none;transition:opacity var(--fade) ease}
.ui.show{opacity:.35;pointer-events:auto}
.ui.show:active,.ui.armed{opacity:1}
</style>
</head>
<body>
<div id="stage"><div id="box"></div></div>
<button class="ui" id="btnReset" aria-label="Reiniciar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
<!-- ============ HISTORIA ============ -->
<script type="text/plain" id="story">
Faltan veinte minutos para la apertura y la cocina ya respira como si hubiera corrido una maratón. No es el calor del horno, es la tensión que se pega a la piel.

Sheilen sostiene un periódico y lee en voz alta la crítica que salió esa mañana. La lee con una mezcla de orgullo y nerviosismo, como si cada palabra fuera un trofeo frágil.

**Sheilen**
"Una promesa cumplida. Un exquisito risotto, preciso, intenso y honesto".

Ese plato lo había estado probando Valerie durante semanas, ajustando el punto del arroz, cambiando el caldo, dudando hasta el último segundo.

Pero el día que se lo mostró a Carmy, él rechazó el plato. Para no tirarlo, lo dejó salir. No sabía que terminaría frente a alguien que escribía para miles.

Carmy entra mientras Sheilen sigue leyendo. Se queda escuchando apenas unos segundos, suficientes para entender el tono de celebración. Le pide que deje eso y que se concentre. No hay tiempo para aplausos. Hay reservas completas y una cocina que todavía no está alineada.

**Carmy**
Deja eso, por favor.

**Sheilen**
Deberías ponerte feliz y, claro, agradecerle a Valerie.

**Carmy**
...¿De qué hablas?

**Sheilen**
Muy pronto va a venir una puta multitud. ¡Gracias, Valerie!

**Carmy**
...Ella... ¿qué mierda ha hecho?

**Sheilen**
Le dio de comer gratis a un crítico, ¡pero! El plato también estaba riquísimo.

**Carmy**
Puta madre...

Miriam cruza la puerta tarde, despeinada por la prisa y con su hijo Louie pegado al brazo.

**Carmy**
¿Quién es él?

**Miriam**
Mi hijo. Saluda, Louie.

**Louie**
Hola, mucho gusto, chef.

**Carmy**
(Suspira). ¿Qué hace aquí?

**Miriam**
Lo suspendieron del colegio, no tenía con quién dejarlo. Puede y quiere ayudar, ¿le enseñas?

**Carmy**
(Mira el reloj). ... (Suspira). Louie, no sé, limpia y ordena las mesas.

**Miriam**
¿Solo eso?

**Carmy**
¡Sí!

Llama a Valerie y le encarga que lo tenga cerca, que le muestre lo básico, que no lo deje tocar nada peligroso.

Valerie asiente, aunque su cabeza está en otra parte: "el risotto". El plato (mejor dicho, su plato) que ahora todos elogian. Se acerca a Farid mientras revisan la lista del menú impresa en la pared y vuelve a insistir con incluirlo de forma fija.

Farid revisa costos, tiempos, volumen de trabajo.

**Farid**
Ahora no, Valerie.

**Valerie**
¡Debes hacerlo! Es un buen plato, ¿hace falta que te entregue el periódico con la reseña?

**Farid**
Un buen plato no siempre es viable.

**Valerie**
¿Y tú qué sabes?

**Farid**
¿Ves este traje? Yo sé lo que funciona, y tú sabes hervir papas fritas.

**Valerie**
...Jódete.

Ella no quiere escuchar razones técnicas, quiere aprovechar el momento.

Mientras discuten, alguien del equipo revisa el sistema de pedidos y se queda en silencio unos segundos de más. Luego llama a Sheilen.

La opción de pedidos anticipados para comida para llevar sigue activada. No la desactivaron después de las pruebas. En la pantalla aparecen órdenes confirmadas que estarán listas en menos de diez minutos. No son cinco ni diez. Son cientos de órdenes.

El silencio dura apenas un instante antes de que todos empiecen a hablar al mismo tiempo.

Carmy se acerca, mira la pantalla y entiende el tamaño del problema sin necesidad de explicaciones largas. Pide que nadie pierda tiempo buscando culpables y que todos se pongan a cocinar lo que puedan. Divide tareas, cambia prioridades, elimina cualquier cosa que no sea esencial. El tono ya no es firme, es urgente. La crítica favorable dejó de importar.

**Carmy**
¡YA, YA! ¿Vamos? ¡Muevan sus traseros!

La cocina se convierte en una carrera contra un reloj que nadie puede frenar. Valerie y Farid siguen chocando, ahora no solo por el risotto sino por cómo organizar la línea.

Carmy les da indicaciones que cambian cada minuto, porque la situación cambia cada minuto. Les pide velocidad, luego precisión, luego otra cosa distinta. Las órdenes se superponen y la discusión sube de volumen. Nadie quiere ceder cuando siente que el barco se hunde.

Marcos, en su estación de pastelería, vive en un mundo paralelo. Desde hace semanas trabaja en perfeccionar una dona. Cambia la textura, ajusta el glaseado, mide el tiempo de fritura con obsesión. Mientras a su alrededor se acumulan bandejas y gritos, él saca otro intento y lo mira con atención casi científica. Cree que esta vez lo logró.

Con la dona en la mano, cruza la cocina buscando a Carmy, esquivando cuerpos y ollas.

**Marcos**
¡Carmy! Lo logré, está perfecto, la máquina funciona, ¿entiendes? Un amigo de mi padre me ayudó, ¿qué dices?

**Carmy**
...¿Te estás burlando de mí?

**Marcos**
...¿Eh?

**Carmy**
¡Ponte a trabajar y deja tus guantes de repostería!

Carmy la aparta de un golpe y la tira al suelo, como si fuera un estorbo más en medio del caos. No mide el gesto, solo reacciona.

Marcos se queda quieto un segundo, mira su trabajo en el piso y entiende que ahí no hay espacio para su proyecto. Se quita el delantal y se va sin hacer ruido.

En medio del apuro, Valerie intenta acelerar su estación. Cambia cuchillos de lugar, mueve tablas, corta más rápido de lo habitual. Farid se acerca para corregirle algo.

**Farid**
Sabes que lo haces mal, ¿no?

**Valerie**
Vete, no pienso hablar contigo hasta que acabe mi turno.

**Farid**
Quieras o no escucharme, lo estás haciendo mal. ¡Mira! Esa no es la forma de cortar. Deja la cebolla a un lado y muévete a otra cosa.

**Valerie**
Vete, por favor, ¡vete!

**Farid**
¿Quieres la verdad? Te diré la verdad. Le diste ese plato sabiendo que era crítico, se lo diste para tener aprobación, como ha sido siempre desde que llegaste, siempre con tus platos "novedosos".

**Valerie**
(Suspira y sigue cortando con más velocidad).

**Farid**
Carmy te los rechazaba porque, no importa qué tan buenos sean, ¡este restaurante aún no está listo para cosas que llamen la atención!

En un cruce torpe de movimientos, el filo entra donde no debía, justo en su ligamento. No es un ataque, es un error absurdo en un segundo mal calculado. Farid retrocede, sorprendido más que furioso, y la sangre aparece como una consecuencia inevitable de tanta tensión acumulada.

**Farid**
Mierda... ¡Me atacaron, me atacaron! ¡Esta idiota me atacó!

**Thot**
Seguro hiciste algo malo.

**Farid**
(Suspira). Sí... quizás sí. Ayúdame, puta madre, trae el puto botiquín.

Afuera, Mía está con el teléfono pegado a la oreja, hablando en voz baja. Intenta resolver un problema personal mientras mira la puerta del restaurante como si fuera una frontera. Carmy sale y la ve. No le gusta la imagen de alguien desconectado cuando todo se cae adentro. Se acerca con pasos rápidos y le exige que vuelva.

**Carmy**
¿Qué haces?

**Mía**
Shh... ¡Sí, lo sé, amiga! O sea, cuando él me lo dijo...

**Carmy**
(Suspira). Corta la llamada.

**Mía**
Espera, amiga... (Baja el teléfono). ¡¿Qué?!

**Carmy**
Dejas el teléfono o te lo arrojo al suelo.

**Mía**
...

Mía vuelve al restaurante. Carmy respira profundo y regresa.

Queda un minuto para la apertura. Farid ya está siendo atendido con un vendaje improvisado. Los pedidos siguen entrando como si nada hubiera pasado. Valerie se limpia las manos, respira hondo y busca a Carmy.

**Valerie**
Carmy...

**Carmy**
...¿Ahora qué?

**Valerie**
Me voy, renuncio...

**Carmy**
...

**Valerie**
Tienes talento, y un poco de liderazgo a veces, pero también eres un gran hijo de puta. (Le deja su delantal).

Carmy se queda solo unos segundos en medio de la cocina. Camina sin rumbo fijo, como si buscara algo que perdió hace rato. Sus ojos se detienen en el suelo, donde sigue la dona de Marcos. La recoge sin ceremonia, la prueba a pesar de la harina y el caos alrededor. Mastica despacio. Hay algo ahí, algo que funciona. No sonríe, pero se nota que lo entiende.

La máquina de tickets (la máquina de órdenes. Mejor aclaramos, ¿no?) sigue escupiendo órdenes como si celebrara el desastre. Carmy la mira y, en un impulso que mezcla rabia y cansancio, la golpea hasta que deja de sonar.

El ruido se corta de golpe y el silencio pesa más que los gritos anteriores. Sin decir nada, se quita la chaqueta y sale de la cocina, dejando atrás un equipo que todavía tiene que abrir las puertas en menos de un minuto.

El reloj marca la hora exacta. Afuera, los clientes esperan sin saber que adentro todo se rompió un poco antes de empezar.

The End
</script>
<script>
(function(){
  var TITLE = 'Muevete Al Minuto';
  var INTRO = 'Parallax presenta...';
  var FADE = 450, INTRO_MS = 3000;
  var KEY = 'parallax-progreso:' + TITLE;
  function save(n){ try{ localStorage.setItem(KEY, String(n)); }catch(e){} }
  function clear(){ try{ localStorage.removeItem(KEY); }catch(e){} }
  function load(){ try{ var v = parseInt(localStorage.getItem(KEY),10); return isNaN(v)?-1:v; }catch(e){ return -1; } }
  var stage = document.getElementById('stage'), box = document.getElementById('box');
  
  var MAXLEN = 600;
  function splitLong(s){
    if(s.length <= MAXLEN) return [s];
    var mid = s.length/2, best = -1, bestD = 1e9, re = /[.!?”"»)]\s+/g, m;
    while((m = re.exec(s))){
      var cut = m.index + m[0].length;
      var d = Math.abs(cut - mid);
      if(cut > 80 && s.length - cut > 80 && d < bestD){ bestD = d; best = cut; }
    }
    if(best < 0){
      var sp = s.indexOf(' ', Math.floor(mid));
      best = sp < 0 ? s.lastIndexOf(' ', Math.floor(mid)) + 1 : sp + 1;
    }
    if(best <= 0 || best >= s.length) return [s];
    return splitLong(s.slice(0,best).trim()).concat(splitLong(s.slice(best).trim()));
  }
  
  var items = [];
  document.getElementById('story').textContent.split('\n').forEach(function(raw){
    var l = raw.trim(); if(!l) return;
    var m;
    if(/^The End\.?$/i.test(l)) items.push({t:'end',s:l});
    else if((m = l.match(/^\*\*(.+)\*\*$/))) items.push({t:'tag',s:m[1]});
    else if((m = l.match(/^([A-ZÁÉÍÓÚÑ][^\s:]{0,24}):\s+(.*)$/))){ 
      var dp = splitLong(m[2]); 
      items.push({t:'dlg',n:m[1],s:dp[0]}); 
      for(var k=1;k<dp.length;k++) items.push({t:'p',s:dp[k]}); 
    }
    else splitLong(l).forEach(function(part){ items.push({t:'p',s:part}); });
  });
  
  function el(cls,txt,tag){var e=document.createElement(tag||'div');e.className=cls;e.textContent=txt;return e}
  function render(it){
    box.innerHTML='';
    if(it.t==='end') box.appendChild(el('big title',it.s));
    else if(it.t==='tag') box.appendChild(el('tag',it.s));
    else if(it.t==='dlg'){
      var d=el('p','');
      d.appendChild(el('who',it.n+': ','span'));
      d.appendChild(document.createTextNode(it.s));
      box.appendChild(d);
    }
    else box.appendChild(el('p',it.s));
  }
  
  var i=-1, busy=true, stage_=0, finished=false;
  function show(fn){
    busy=true; stage.classList.remove('on');
    setTimeout(function(){ fn(); stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },FADE);
  }
  function prev(){
    if(busy||stage_!==2||i<=0) return;
    finished=false; i--; save(i);
    show(function(){render(items[i])});
  }
  function next(e){
    if(e && e.type==='click' && e.clientX < window.innerWidth/2){ prev(); return; }
    if(busy||finished) return;
    if(stage_===1){ stage_=2; save(0); show(function(){i=0;render(items[0]);}); return; }
    if(stage_===2){
      if(i+1>=items.length) return;
      i++;
      var it=items[i];
      if(it.t==='end'){ finished=true; clear(); } else save(i);
      show(function(){render(it)});
    }
  }
  
  var btnReset = document.getElementById('btnReset');
  function showUI(){ btnReset.classList.add('show'); }
  var armTimer = null;
  btnReset.addEventListener('click', function(e){
    e.stopPropagation();
    if(!btnReset.classList.contains('armed')){
      btnReset.classList.add('armed');
      armTimer = setTimeout(function(){ btnReset.classList.remove('armed'); }, 2500);
      return;
    }
    clearTimeout(armTimer); clear(); location.reload();
  });
  
  var saved = load();
  if(saved >= 0 && saved < items.length && items[saved].t !== 'end'){
    showUI();
    i = saved; stage_ = 2;
    render(items[i]);
    setTimeout(function(){ stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },200);
    document.addEventListener('click',next);
    document.addEventListener('keydown',function(e){
      if(e.key==='ArrowLeft')prev();
      if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight') next();
    });
    return;
  }
  
  setTimeout(function(){
    box.appendChild(el('intro',INTRO));
    stage.classList.add('on');
    setTimeout(function(){
      stage.classList.remove('on');
      setTimeout(function(){
        box.innerHTML=''; box.appendChild(el('big title',TITLE));
        stage.classList.add('on');
        setTimeout(function(){busy=false;stage_=1;showUI();},FADE);
      },FADE);
    },INTRO_MS);
  },200);
  document.addEventListener('click',next);
  document.addEventListener('keydown',function(e){
    if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight') next();
  });
})();
</script>
</body>
</html>
