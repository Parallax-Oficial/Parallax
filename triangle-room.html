## Capítulo 1: Un Nuevo Respiro

Dann se despertó con esa sensación rara de no haber descansado nada, como si hubiese dormido ocho horas pero en modo ahorro de energía. Se quedó mirando el techo unos segundos, pensando en absolutamente nada, hasta que se acordó de que tenía cosas que hacer y una vida que sostener, aunque sea a medias. Se levantó, agarró un par de ropa casi sin mirar qué era y se fue directo al baño. Caminaba medio dormido, arrastrando un poco los pies, todavía procesando que ya era de día otra vez. Cerró la puerta, apoyó las manos en el lavamanos y levantó la cabeza para mirarse al espejo.

Se observó en silencio unos segundos, con cara de recién levantado (literalmente), los ojos cansados, el pelo desordenado, la remera arrugada. Murmuró: “Cada día peor”.

Sin pensarlo demasiado, se sacó toda la ropa y entró a la ducha. Abrió el agua y dejó que le cayera encima, primero fría, después tibia, después caliente, hasta encontrar ese punto exacto que no quema pero tampoco molesta. Cerró los ojos y se quedó ahí, quieto, como si el agua le estuviera borrando la cabeza por unos minutos.

De repente (de una forma que hizo que el tiempo se parara por completo), la puerta del baño se abrió de golpe. Marie entró sin pedir permiso (no se percató ni de la sombra de Dann), estaba hablando por celular, con cara de furia (parecía pelada incluso) y caminando de un lado al otro como si el baño fuera suyo. Tenía el ceño fruncido (jajaja, un puto clásico ¿no?).
Dann abrió los ojos, sorprendido, sin entender nada. Se dedicó a escuchar solamente.

Marie: ¡no! ¡no! Ya te dije que no! No lo vas a invitar! Y si lo haces a mis espaldas o te mato o se cancela la puta fiesta
-bien! No lo voy a invitar, solo te hice una pregunta sin ser ofensivo, puta madre!
Marie: sí! Lo sé! Pero... (suspira) ese tipo me desespera, es como si... no sé, me ve con esa cara de... que quisiera violarme, ¿sabes?
-es gay, Marie

-...

-¿entonces?
Marie: bueno, invítalo, pero... no cobra nada ¿verdad?
-pues... el precio es escucharlo
Marie: soy buena en eso, bien, invítalo, da igual.

Después de unos minutos, Marie cortó la llamada, guardó el celular en el bolsillo y salió del baño. Dann se quedó quieto, con el agua cayéndole en la cara, tratando de procesar lo que acababa de pasar.

• Parpadeó un par de veces
• No dijo nada
• Siguió bañándose

Cuando terminó, cerró la ducha, agarró la toalla y se secó rápido, todavía con esa sensación de confusión dando vueltas. Se puso la ropa ahí mismo, frente al espejo, acomodándose la remera y pasando la mano por el pelo como si eso fuera a arreglar algo.

Spoiler: sí lo arregló (no algo que digan así que bruto, que buen cabello).

Nuevamente, volvió a mirarse. Esta vez, sonrió apenas diciéndose: “Cada día mejor” (sí, parece un personaje arrogante, ¡les juro que no!). Salió del baño, caminó por el pasillo y subió las escaleras rumbo a su escritorio.

• Un escritorio sagrado
• Nadie lo usaba
• Nadie lo tocaba
• Nadie dejaba cosas ahí

Así lo había dictado Miro, y Dann lo respetaba como si fuera una ley universal. Se sentó, acomodó la silla, prendió la computadora y abrió directamente su página web de cripto. Tenía varias pestañas abiertas, gráficos, estadísticas, notas, ideas sueltas. Empezó a trabajar sin distraerse, con una concentración bastante decente para alguien que había sido interrumpido en la ducha. Al rato, tocaron la puerta.

Dann: ¡Pase!

La puerta se abrió y apareció Alice con una taza de café en la mano. Sonreía, caminando con cuidado para no derramar nada.

Dann: Alice! Ven, quiero que veas
Alice: siempre necesitas la autorización de un adulto?
Dann: no digas eso... mucho menos tú, eres una enana

Dann: mira de una vez
Alice: ... (observó la pantalla) está bien, quizás... necesita un cambio
Dann: ¿cuál?
Alice: un cambio de... creador, no eres bueno para esto
Dann: jódete, mejor no te muestro nada

De repente, sin ningún tipo de lógica, Alice inclinó la taza y el café cayó directamente sobre la computadora. No fue un simple accidente. El líquido pareció moverse lento, casi flotando en el aire antes de estrellarse contra el teclado, como si el tiempo se hubiera puesto raro solo para arruinarle el día a Dann.

El cuarto cambió. Se transformó en una selva (sí, una selva, ¡fíjate, fíjate, fíjate!). Monos gritaban, y una tribu cantaba su mejor canción, moviendo sus bocas para generar sonidos extraños, igual de raros que los de los monos. Mientras el líquido del café caía en cámara lenta, la canción de la tribu sonaba más y más, ¡MUCHO MÁS! intensa.

La pantalla parpadeó, hizo un sonido extraño y quedó negra.

Dann: ¡¿QUÉ MIERDA HICISTE?!

Alice salió corriendo del cuarto riéndose, bajando las escaleras a toda velocidad, como si acabara de cometer el crimen perfecto. Dann se quedó sentado, mirando su computadora muerta, sin entender si lo que había pasado era real o si seguía medio dormido.

Después reaccionó levantándose de golpe, intentó prenderla, apretó el botón varias veces, hasta que sintió una pequeña descarga en los dedos: “¡Mierda!”. Sin pensarlo más, salió corriendo detrás de Alice. Bajó las escaleras casi saltando escalones, con bronca, con nervios, con ganas de entender qué demonios (rayos y centellas) acababa de pasar. Al llegar abajo, la vio parada en la puerta, como si nada, mirándolo con cara inocente.

Alice: qué sucedió? Una chica linda te jodió la vida? Jajaja!
Dann: ...

De repente, los dos empezaron a correr. Pero no era una carrera normal. Alice parecía moverse como si conociera el camino de memoria, girando sin dudar, doblando esquinas que Dann juraba no haber visto nunca.

(¿Has dicho una carrera? Ah! Lo dije yo... bueno, lo escribí) Los edificios desaparecieron, convirtiéndose en cenizas. Ahora sí estamos en una carrera profesional. Son las ligas mayores. El público gritaba de entusiasmo. Dann tomaba la delantera, mientras que Alice, manteniendo una sonrisa como si fuese una Barbie estática (ya de por sí son estáticas), volvía a tomar el puesto uno. Entonces... entonces... ¡sonaron los tambores! Alice llegó a la meta, había ganado.

Dann la seguía, gritando su nombre, pero su voz sonaba lejana, como si estuviera hablando dentro de un túnel. Corrían y corrían, sin cansarse, sin frenar, hasta que, de golpe, todo se acomodó. Estaban frente a una tienda de tecnología. Alice entró mientras que Dann, agitado, se detuvo unos segundos afuera, respirando fuerte, con las manos en las rodillas, antes de seguirla. Adentro, el aire estaba frío, lleno de luces blancas y estanterías con cajas apiladas.

Dann: ... (respiraba sin parar)
Alice: qué pasa? Te superó una niña?
Dann: mira... nunca en mi vida corrí tanto como hoy, ¡y todo por tu puta culpa!
Detrás del mostrador estaba Torio, el tío de Alice. Estaba revisando unas facturas, tranquilo, como si no acabara de presenciar una persecución digna de una película rara. Dann lo saludó sin ganas. Torio levantó la vista, sonrió apenas, caminó hasta una estantería, tomó una caja de computadora nueva y se la dio a Alice. Alice la sostuvo y, sin decir mucho, se la entregó a Dann.
Dann: ... qué haces?
Alice: tú sabes que no te haría correr a propósito, esto es para ti
Dann: ... (la tomó e inspeccionó) no tiene una bomba ¿verdad?
Alice: ... (sonrió) perdón por lo de tu computadora, aunque bueno, la culpa fue mía
Dann: da igual, tengo algo mejor, pero... ¿por qué?
Alice: un regalo de bienvenida
Dann: ¿en serio?
Alice: no, pero... es como si fuese uno
Dann: gracias... gracias
Alice: por primera vez escucho dos gracias de otra persona! Pero... de nada... de nada.

Los dos volvieron caminando a la casa, esta vez sin correr, en silencio, como si todo el caos anterior hubiera sido parte de otro día. Subieron las escaleras, entraron al cuarto y Alice lo ayudó a conectar todo, enchufar cables, configurar lo básico, instalar programas, explicarle cosas que Dann fingía entender. Cuando terminaron, se quedaron sentados unos segundos mirando la pantalla. Alice se despidió rápido y salió del cuarto. Dann quedó solo.

La computadora por fin encendió y, por un momento, la pantalla pareció expandirse, como si fuera una ventana a otro lugar. Dann apoyó las piernas sobre el escritorio y empezó a configurar su cuenta. Escribió su usuario, su contraseña, revisó sus archivos. Entonces notó algo raro: había otra cuenta registrada: torioejample@gmail.com (no intentes buscar este Gmail, por favor). Cerró esa ventana y volvió a concentrarse en su proyecto. Minutos después apareció una notificación. Era un email nuevo, cuyo remitente se llamaba Ronald. Dann lo miró fijo. El único Ronald que conocía era el que iba a tercer año de secundaria, pero nunca hablaron, y ahora recién se daba cuenta de que no lo volvió a ver otra vez. Dann pasó a cuarto año y no supo más nada de la existencia de aquel Ronald. Igualmente, no sospechaba de él. No parecía un chico nerd (tampoco Dann, ni siquiera el puto escritor de esta historia, ¡ya! ¡Dejen de decirlo!).

Dann se quedó mirando la pantalla, leyendo el mensaje una y otra vez, como si en algún momento fuera a cambiar: “¿En serio le va a regalar una computadora? ¿Quién se cree?”. Parpadeaba repetidas veces y volvía a leerlo sin sentido. Incluso lo llegó a leer tanto que confundía las palabras. Se apoyó contra el respaldo de la silla y soltó una pequeña risa sin humor. No porque le pareciera gracioso, sino porque era tan directo que resultaba incómodo. No era un spam, no era publicidad, mucho menos un error. Dann no se contuvo, dejó su cabeza firme contra la pantalla, como si estuviese por entrar al mundo digital. Aun así, se resignó. No iba a decirle nada, al menos no de lo que tenía guardado adentro.

## Capítulo 2: Un Regalo Se Consigue Caro

Marie entró al cuarto del escritorio sin hacer ruido. Dann estaba sentado frente a la computadora, revisando unas cosas sin mucho interés. Ella se acercó al escritorio y dejó un papel doblado sobre una de las esquinas, sin decir nada.

Dann levantó la vista, miró el papel y lo tomó con cuidado. Lo abrió lentamente. Era una lista de compras, escrita con letra clara y ordenada.

Dann: ¿y esto?

Dann: ¿compras? ¿Yo ir a comprar?

Dann: mira... estoy ocupado, Marie

Dann se tambaleaba, manoteando el aire, tratando de sacárselo. Cuando por fin lo logró, lo miró un segundo, hizo una mueca y lo tiró sin pensar. El preservativo cayó directo en el pelo de Alice.

Ella dejó de reírse. Se quedó completamente quieta.

Dann: ¿y? ¿Ahora ya no ríes?
Alice: ¡ya! ¡Sácalo! ¡Se acabó el juego, sácalo, puta madre!

Dann se acercó despacio, lo tomó con dos dedos, como si fuera algo tóxico, lo levantó, abrió la ventana de su cuarto y lo lanzó afuera.

En la vereda, dos chicos caminaban hablando. Algo cayó frente a ellos. Se acercaron, lo miraron, levantaron la vista hacia la casa, sacaron una foto, rieron y salieron corriendo.

Dann y Alice estaban en la cama, cada uno en un extremo, con los pies casi tocándose. No había incomodidad, tampoco cercanía buscada. Era una quietud compartida, de esas que no se explican.

Dann: hey, Alice… nunca te lo pregunté, ¿de qué quieres trabajar? ¿Cuál es tu sueño?
Alice: (sonríe microscópicamente) pensé en ir a vivir a Estados Unidos y allí comenzar mi profesión como diseñadora de vestuarios. Sabes… me imagino estando en una producción y que me encarguen hacerles las vestimentas a cada actor… bueno, soñar es gratis, ¿no?
Dann: …
Alice: ¿y tú? ¿Te enfocarás de lleno en las cripto?
Dann: … no, no es mi mundo.
Alice: ¿y?
Dann: y… no lo tengo claro.
Alice: podríamos descubrirlo.

Alice: … ¿y qué tan bien suena eso?
Dann: (suspira) sabes, no me pongo a pensar en eso. Quizás… no soy bueno pensando.
Alice: …

El golpe seco en la puerta cortó el momento. Dann se incorporó, apoyó los pies en el piso y caminó hacia la salida con calma medida, como si no quisiera pensar demasiado en lo que iba a encontrar del otro lado. Antes de llegar, todo cambió.

La casa desapareció. La luz se fue de golpe y quedó un suelo iluminado, liso, extendiéndose en un pasillo que no parecía terminar nunca. A ambos lados había puertas. Se abrían solas, una tras otra, y de cada una salían corazones rojos, simples, flotando sin orden, como si no pesaran nada. Dann siguió caminando, sin mirar demasiado, con la vista fija al frente.

¡Y entonces apareció!

Un corazón enorme bajó desde arriba, ocupando casi todo el pasillo. Tenía una boca abierta de más, dientes desparejos y largos, saliva cayendo sin pausa. Avanzaba rápido, demasiado. Abría y cerraba la boca como si ya lo estuviera probando. Dann dio media vuelta y corrió, pero el sonido detrás de él no se alejaba. Al contrario. El corazón era más veloz, más insistente.

Tropezó. Cayó de rodillas. Sintió el tirón en la pierna, el aire cuando lo levantaron del suelo, y luego nada ordenado. El corazón lo atrapó, lo cerró dentro, y no hubo tiempo para entender. Todo se rompió ahí.

Dann parpadeó.

(Porque hago esto ¿no?, osea, escribir algo tan minúsculo separado de los bloques grandes... hay preguntas, pero no respuestas).

Estaba otra vez frente a la puerta. Su mano quedó suspendida en el aire, a centímetros del picaporte. Pensó en abrir. Pensó en quedarse. No hizo ninguna de las dos cosas. Se dio vuelta y salió corriendo hacia su cuarto. Subió las escaleras apurado, abrió la puerta casi sin frenar y se encontró con Alice parada justo del otro lado. Se quedaron mirándose un segundo. Después se acercaron al mismo tiempo.

Le tomó la cara con ambas manos, como si hubiera decidido algo tarde pero sin vuelta atrás. Alice no dijo nada. Cerraron los ojos casi al mismo tiempo y el beso llegó firme, sostenido. Dann apretó un poco de más, Alice tuvo que acomodar la cabeza, y aun así no se separaron.

La puerta del cuarto de Alice se abrió. De ahí salieron tres hombres en fila, vestidos con uniformes de gala militar, impecables, brillantes, fuera de lugar. El primero cargaba un bombo enorme que golpeaba con ritmo seco, el segundo avanzaba marcando notas largas con un trombón de varas, y el tercero acompañaba con un clarinete agudo, preciso. No miraron a Dann ni a Alice. No reaccionaron a nada. Cruzaron el pasillo tocando una marcha solemne, exagerada, como si desfilaran frente a un público invisible.

Dann y Alice siguieron besándose. Dann respiró hondo sin separarse. Alice ajustó la mano en su muñeca. El sonido metálico y grave pasó a su alrededor, llenó el aire, y siguió de largo, sin interrumpirlos, sin pedir permiso.

Se separaron sin decir nada. Algo vibraba.

Alice: perdón, debo contestar.

La llamada se corta abruptamente. Alice volvió a su cuarto, tomó algunas cosas sin demasiado orden, revisó el celular otra vez y tomó el bolso. No explicó más de lo necesario. Salió de la casa y fue directo a lo de su familia, sin mirar atrás.

Siguió caminando sin apurarse, con el bolso colgado y el teléfono guardado, con el trayecto que ya conocía de memoria.

Al llegar a la casa de sus padres tocó el timbre una sola vez. La puerta se abrió casi de inmediato. Miró apareció del otro lado, la miró apenas, le hizo un gesto corto con la cabeza y se hizo a un lado para que pasara. Alice entró. Miró no dijo nada más. Caminó hacia el fondo de la casa y desapareció de la escena.

Sheila ya estaba ahí. De pie, con los brazos cruzados: "Siéntate". Alice obedeció. Se sentó frente a su madre, recta, sin cruzar las piernas, con los codos apoyadas sobre la mesa. Sheila no se sentó. Sacó el celular con calma, desbloqueó la pantalla y lo apoyó sobre la mesa, girándolo para que Alice pudiera ver.

Era una foto de un condón. (Si se preguntan si el escritor tiene algún fetiche con los condones desde ya les aseguro que no lo sé... espera, yo soy el escritor. Recién me doy cuenta... continuemos por favor)

Alice: … ¿qué es esto? ¿Qué mierda?

Deslizó el dedo hacia un costado, sin apuro, y apareció otra imagen. Era la casa donde vivían Marie, Dann y Alice. La fachada completa, tomada desde la vereda, clara, reconocible.

Alice: … no entiendo.

Alice se levantó bruscamente, volteó y se fue cerrando la puerta con fuerza. Mientras veía el suelo, escucho pequeñas risas, al ver en frente: dos chicos viéndola desde lejos, ambos, al notar su mirada floja, se fueron corriendo. Y Alice, también corrió de aquel lugar.

Dann caminó hasta la plaza del centro sin rumbo claro. Cuando llegó eligió una banca apartada, se sentó y apoyó los codos en las piernas. Miró a su alrededor sin fijarse en nadie en particular. La gente cruzaba la plaza como cualquier otro día, conversaciones sueltas, pasos constantes, nada que lo incluyera.

Una madre y su hijo se sentaron en la misma banca, dejando un espacio prudente entre ellos y Dann. El niño sostenía una botella de vidrio con un sorbete largo y transparente. Bebía sin pausa, haciendo pequeños ruidos al final de cada sorbo. Dann los observó de reojo, sin intención clara, solo para ocupar la vista.

En un momento el niño giró la cabeza rápido, todavía con el sorbete en la boca, y lo miró directo. Sostuvo la mirada más de lo normal para alguien de su edad. Luego volvió hacia su madre y tiró de su ropa.

—Mamá, ¿ese no es el que ustedes decían?

—El…
—…

El niño no obedeció del todo. Volvió a mirar a Dann, esta vez sin disimulo.
Desde el otro extremo de la plaza llegó una chica joven. Se acercó a la banca y saludó con naturalidad.

Se inclinaron y se dieron un beso breve. Cuando la chica se enderezó, sus ojos se cruzaron con los del niño. Él levantó el dedo y señaló a Dann. La chica siguió la dirección del gesto y lo miró también. Después se inclinó hacia el oído de su madre y le susurró algo que Dann no alcanzó a escuchar. No necesitó hacerlo. Las miradas eran suficientes.

Dann se movió incómodo, cambió la postura, pero la sensación no desapareció. Se puso de pie de golpe y, en el movimiento, chocó con un chico que pasaba justo allí.

—¡Mierda! ¡Ten cuidado!
Dann: lo siento.
—… ¿Dann?
Dann: sí.
—(sonríe) eres el de… (ríe) ¿cómo están las chicas, eh?

Sin esperar respuesta completa, Dann siguió caminando rápido, cruzó la plaza y se perdió entre la gente sin mirar atrás.

## Capítulo 7: Mientras Las Gotas Caen

Alice entró a la casa y cerró la puerta con más fuerza de la necesaria. El ruido quedó flotando unos segundos en el pasillo. Sin saludar, dejó el bolso caer contra el suelo y avanzó hasta el sofá. Se dejó caer también, como si el cuerpo le pesara más de lo normal, y comenzó a golpear el asiento con el puño cerrado, una y otra vez, siempre en el mismo lugar, sin mirar nada en particular.

Marie apareció desde la cocina, se detuvo al verla y se acercó despacio.

Marie: ¿Sucede algo?
Alice: … Nada.
Marie: No te creo, ¿qué pasa?
Alice: … Mi mamá piensa que soy… (suspira)
Marie: ¿Por qué?
Alice: Estupideces, chismes, rumores que no son ciertos.
Marie: Espera, ya vuelvo.

Marie regresó con una taza de té caliente y la sostuvo frente a ella hasta que Alice la tomó. Luego se sentó a su lado y la rodeó con un brazo, atrayéndola hacia su hombro. Alice no se resistió, pero tampoco respondió al gesto.

Marie: Parecemos madre e hija así, ¿no?

Marie se levantó sin hacer ruido, fue hasta el perchero, se puso el abrigo y buscó las llaves. Abrió la puerta y, justo antes de cruzarla, escuchó la voz de Alice detrás: "Perdón".

Marie no respondió. Salió y cerró con cuidado. Caminó sin un rumbo claro, con las manos en los bolsillos y la cabeza baja. El viento le golpeaba el rostro y le desordenaba el pelo. Varias personas apuraban el paso cuando empezaron a caer gotas finas. Vio a una mujer correr con un paraguas abierto, inclinándolo contra el viento para que no se diera vuelta. Las gotas se volvieron más constantes y el asfalto empezó a oscurecerse.

Llegó hasta el lago cuando la lluvia ya era firme. Las gotas golpeaban la superficie y formaban círculos que se superponían. Se apoyó en la baranda fría y miró el agua sin parpadear. Entonces le vinieron recuerdos que no había pedido. Uno de ellos inclinándose hacia ella, acercando la mano a su boca, deslizando un dedo con cuidado, como si estuviera probando algo frágil.

Cerró los ojos y apretó la baranda con más fuerza. Otro recuerdo la atravesó, una habitación en penumbra, una cama desordenada y una voz que le decía que la amaría siempre, como si esa frase pudiera sostenerse por sí sola.

Abrió los ojos cuando el agua ya le corría por la frente. Se dejó caer en una de las bancas y quedó mirando el lago, sin cubrirse, mientras la lluvia le pegaba en la ropa y en la cara.

Char se acercó y se detuvo a unos pasos, dudando antes de hablar.

Char: ¿Marie?

Mientras tanto, Dann estaba en una tienda de barrio, apoyado contra una heladera vertical, con una lata abierta en la mano. Bebía despacio y miraba la lluvia a través de la puerta de vidrio. Las gotas resbalaban y deformaban las luces de la calle.

Durante varios minutos avanzaron en silencio, pasando por barrios más abiertos, con menos edificios y más espacios oscuros entre una casa y otra. La ciudad quedaba atrás sin desaparecer del todo.

Mientras tanto, en la casa, alguien tocó la puerta. El golpe fue firme, dos veces seguidas. Alice estaba en la cocina, esperando que el café terminara de subir. Dudó un segundo y dejó la hornalla encendida. Se secó las manos en el pantalón y fue hasta la entrada. Abrió.

Un hombre encapuchado estaba frente a ella. La lluvia le caía por los hombros y el agua bajaba por la tela oscura.

Alice: ¿si?

Alice: … Okey, ¡puta madre! No me hagas asustar así.

Alice: (bajó la mirada) Voy a buscar el café, ¿sí?
Ronald: …

Desde la cocina, Alice gritó: "¡¿también quieres un café?!". Ronald, con una pequeña sonrisa le dijo: "¡si!". Y en voz baja habló para si mismo: "te extrañaba amiga, eres igual como antes".

## Capítulo 8: Me Borraste

Alice y Ronald reían sin control, como si todo lo anterior hubiera quedado lejos por un momento.

Ronald: ¿Te acuerdas de esa vez en la que tu amiga te puso el pie?!
Alice: ¡¿Sí?! Casi se me sale un diente con el putazo que me di contra el suelo.

Volvían a reír, inclinándose uno hacia el otro.

Alice: Igual, no te rías porque tú le dijiste mamá a la profe.
Ronald: No pude dormir por la vergüenza. ¡Jajaja!

La risa bajaba de intensidad y regresaba otra vez, casi infantil.

Ronald: (respira agitado, sintiendo dolor en el estómago) Nunca me reí tanto como hoy.
Alice: (sonríe) Sí, la última vez que reí tanto fue cuando... bueno, no importa.

Ronald: Porque entendí que... las personas no olvidan, y tú no olvidaste nada.

Ambos se abrazan. Luego, Ronald se levanta, todavía con una sonrisa tranquila, y salió de la casa mientras Alice lo miraba desde la puerta. Afuera la lluvia seguía, pero ya no golpeaba con fuerza, solo caía constante sobre la vereda húmeda.

En el camino, Ronald notó a otro encapuchado que avanzaba en sentido contrario. Caminaron por la misma vereda, reduciendo apenas el paso cuando quedaron frente a frente. Se sostuvieron la mirada durante unos segundos que parecieron más largos de lo normal. Ninguno dijo nada. Ronald siguió su rumbo sin mirar atrás.

El otro encapuchado se detuvo frente a la casa de Alice, observó el frente con calma y luego pateó una maceta que estaba junto a la puerta. La tierra se desparramó y, entre las raíces expuestas, apareció una llave. La tomó sin dudar.

Dentro, Alice lavaba las tazas con movimientos automáticos, intentando mantener la mente ocupada. El sonido del agua chocando contra la cerámica llenaba la cocina hasta que escuchó la puerta abrirse. Se dio vuelta y vio a Char parado frente a ella, quieto, como si hubiera estado allí desde siempre.

Alice: (pega un salto del susto) ¡¿Quién mierda eres?!
Char: Ahora sí puedo verte.
Alice: ... ¡¿Qué?! Vete o llamo a la policía.
Char: ¿No vas a hacerme un café?
Alice: ... Tú... eres el mismo del baño, tú querías entrar cuando yo estaba en el... Vete, vete o tomo un cuchillo y te juro que te mato.
Char: ...
Alice: ... Vete, por favor, vete.
Char: Tranquila, solo haz lo tuyo. (saca una lima)

Char cerró la puerta con llave sin apartar la vista. Alice volvió a girarse hacia la mesada y comenzó a preparar café, midiendo cada paso con cuidado. En ese momento, Char se acercó por detrás hasta que su cuerpo chocó por completo contra el de ella. Tomó sus manos y las apretó con fuerza, inmovilizándola.

Alice dejó caer una lágrima, la mirada perdida, como si algo dentro de ella se hubiera terminado.

La lluvia cesa. En la calle queda un bache lleno de agua que refleja el cielo gris. Los autos pasan sin frenar, primero uno, luego un camión que salpica más de lo necesario, después una bicicleta que esquiva tarde y moja sus ruedas. El tránsito continúa rápido hasta que, de pronto, la calle queda vacía. En la casa vecina, una tubería suelta comienza a expulsar agua con fuerza, como si estuviera liberando presión acumulada. El chorro se vuelve irregular, cada vez más débil, hasta transformarse en pequeños hilos que apenas caen. Finalmente, no sale nada.

Marie llega y nota la maceta tirada frente a la puerta. Se acerca, intenta abrir, pero la cerradura no cede. Empuja con más fuerza y entiende que está completamente trabada. Saca el celular y llama a Alice. No obtiene respuesta. El celular de Alice estaba en el suelo, vibrando por la llamada entrante. Marie corta e intenta comunicarse con Char. El celular de Char vibra sobre una mesada de luz en el cuarto de Alice, iluminando apenas el espacio con cada notificación.

Marie guarda su teléfono, confundida. Se sienta en la vereda mientras el cielo comienza a aclararse y los primeros rayos de sol le dan algo de calor después de la noche húmeda.

Decide llamar a Dann. Él contesta enseguida.

Dann: ¿Sí?
Marie: Hey, Dann, ¿tú no estás en la casa, verdad?
Dann: No, ¿pasó algo?
Marie: Está cerrada con llave, invité a un chico para pasar la noche, pero...
Dann: ¡¿Qué chico?!
Marie: Pues... se llama Char, le dije que la llave estaba en la maceta y... la maceta está tirada.
Dann: ¡¿Eres estúpida?! Intenta entrar de cualquier forma.
Marie: Pero...
Dann: ¡Ya!

La llamada se corta de forma abrupta. Marie se levanta y rodea la casa buscando otra entrada. Encuentra una ventana lateral, prueba con fuerza hasta que logra abrirla lo suficiente para pasar.

Mientras tanto, Char abre la puerta principal y sale caminando con las manos en los bolsillos de su campera, la capucha puesta, viendo al frente.

Marie ya está dentro. Sube las escaleras y en el pasillo encuentra el celular de Alice tirado en el suelo. Lo recoge, avanza despacio y entra al cuarto. Está vacío.
Escucha la ducha. El sonido del agua cayendo es constante. Se acerca al baño, apoya el oído en la puerta y pregunta si está bien. No recibe respuesta. Solo percibe pequeños llantos, intermitentes.

Alice está sentada en el suelo de la ducha mientras el agua cae sobre su espalda. Llora sin detenerse, rasguñando su propia piel como si intentara borrar algo que no puede nombrar.

## Capítulo 9: Necesitamos Un Respiro

Alice estaba sentada en la cama, con la espalda recta y las manos apoyadas sobre sus piernas. Miraba el suelo sin parpadear casi, como si allí hubiera algo que los demás no podían ver. No lloraba. No se movía. El cuarto estaba en silencio, pero ella no parecía estar escuchando nada. En eso, tocaron la puerta.

Dann: Alice... ¿puedo pasar?

Alice no respondió. Ni un gesto. Ni un sonido. Desde el pasillo se escucharon pasos rápidos subiendo las escaleras. Dann giró la cabeza y vio a Marie acercarse.

Marie: ... hola
Dann: ¿Hola? ¿Solamente vas a decir eso?
Marie: ... (bajó la mirada)
Dann: Tú lo llamaste, le dijiste todo. Ese tal Char, fue el mismo que casi entra al baño con ¡ALICE ADENTRO!
Marie: ... por favor, basta, no sigas jodiéndome
Dann: ¿Y me lo dices a mí? Tú has sido una puta molestia, tú nos has jodido a los dos. Ella era tu amiga... la única que estuvo siempre para ti. ¡Estuvo siempre! Y, ¿cómo le agradeces? Dime... ¡¿cómo le agradeciste?!
Marie: ...
Dann: Todo esto, lo has hecho porque eres una puta, una perra, te hiciste coger con todos... ¡todos! No sirves, Marie. ¿Lo entiendes? Por eso te odias a ti misma, porque al final, no importa cuántos hombres estuvieron contigo, no tienes nada para dar.
Marie: ...

Marie bajo las escaleras y se fue se la casa. Dann regresó frente al cuarto de Alice, sin atreverse a entrar. Se dejó caer despacio hasta quedar sentado en el suelo, apoyando la espalda contra la puerta cerrada. Del otro lado no se oía nada. Él respiraba pesado, como si cada intento por mantener la calma le costara más de lo normal.

Dann: ... perdóname... yo... (suspira) Te quiero, sabes que...
Alice: ... no hiciste nada... solo te fuiste (decía mientras seguía con la mirada fija en el suelo)
Dann: ...

Permaneció allí unos segundos más, mirando el techo del pasillo, hasta que se puso de pie y caminó hacia su habitación. Entró y cerró la puerta con fuerza, el golpe seco retumbó en la casa que parecía sostenerse apenas.

Se sentó frente al escritorio. La computadora estaba abierta. En la pantalla seguía activa su plataforma de criptomonedas, terminada después de meses de trabajo. El diseño estaba completo, los gráficos funcionando, cada detalle en su lugar. Todo lo que había planeado estaba allí.

Dann apoyó las manos sobre el teclado y comenzó a golpearlo con el puño cerrado, primero una vez, luego otra, hasta que las teclas empezaron a saltar. Tomó la taza de café que estaba a un lado y la volcó sobre la laptop, viendo cómo el líquido se filtraba entre las ranuras. Sin pensarlo más, levantó el aparato y lo lanzó contra el suelo. El impacto quebró la pantalla y dejó un sonido hueco que quedó flotando en el cuarto.

El lugar que había cuidado como si fuera intocable empezó a perder forma. Empujó la silla hasta que cayó de lado, tiró el escritorio con un movimiento brusco que desparramó cables y papeles, sacó libros de la estantería y arrancó páginas sin leerlas, dejando restos en el piso. El orden que siempre había defendido desaparecía por su propia mano.

Cuando ya no tuvo nada más que romper, se dejó caer en el suelo. Se sentó entre los objetos tirados y se cubrió el rostro con ambas manos, apoyando los codos en las rodillas. No gritó. No dijo nada. Solo respiraba, con el pecho subiendo y bajando de forma irregular.

Mientras tanto, Marie estaba en casa de su madre. Subió a su antiguo cuarto sin saludar a nadie. Abrió un cajón que conocía bien y encontró tres frascos de barbitúricos alineados al fondo. Los miró un momento, tomó uno y lo guardó en el bolsillo de su abrigo.

Al regresar a la casa, se encerró en su habitación. Se sentó en el suelo, con la espalda contra la cama, y abrió el frasco. Volcó varias pastillas en su mano y las llevó a la boca sin buscar agua. Tragó con dificultad, sintiendo cómo se quedaban a medio camino antes de bajar.

Intentó dejar el frasco sobre la mesada, pero los dedos le temblaban y se le cayó. El envase rodó hasta chocar contra la pared. Las lágrimas comenzaron a salir sin ruido. Cerró los ojos, apoyando la cabeza hacia atrás, mientras la habitación quedaba en silencio.

Dann salió de su casa sin mirar atrás. Caminó varias cuadras hasta llegar a la de Norman. Tocó el timbre una sola vez y esperó con las manos en los bolsillos, evitando pensar en lo que había dejado atrás.

Norman abrió la puerta con una sonrisa automática, de esas que se usan cuando uno espera una visita común. Se acercó para saludarlo como siempre, pero notó al instante que Dann apenas respondió al gesto. No había energía en él, solo una tensión contenida que se le marcaba en los hombros.

Dann entró y se sentó en el sofá sin decir nada. Norman cerró la puerta despacio y se quedó de pie unos segundos, observándolo.

Dann: Norman... voy a dejar el proyecto
Norman: ¿Qué? Jajaja! Decías eso, ¿viste?
Dann: ...
Norman: ¿Hablas en serio?
Dann: ... (asiente con la cabeza)
Norman: ... ¿Eres estúpido o qué? Ayer estabas estresado por no terminar y ahora... (suspira) Sabía que eras medio idiota, pero no pensé que lo eras de lleno.
Dann: ...
Norman: Dann, llevamos dos años, ¡dos putos años!
Dann: ... perdóname
Norman: (suspira)

Norman extendió el brazo en un gesto firme, buscando sacarlo de ese estado. Dann lo miró, dudó apenas, y tomó su mano para ponerse de pie. Se acercaron y se abrazaron con fuerza, dándose palmadas en la espalda como si ese contacto pudiera ordenar algo que estaba fuera de control.

Norman: ¿Se puede saber el porqué cambiaste de opinión?
Dann: ... pasó algo malo, muy malo
Norman: ...

La tarde fue perdiendo luz sin que ninguno lo notara. Afuera, el cielo cambió de color y la noche terminó de instalarse en las calles.

Char caminaba solo, con la capucha puesta y las manos en los bolsillos. No apuraba el paso. Avanzaba incluso por las zonas donde los faros estaban dañados y la oscuridad cubría casi toda la vereda. Sus pasos resonaban más de lo normal en el silencio.

De pronto se detuvo. Frente a él, a pocos metros, había un chico parado en medio del camino. Char bajó la mirada un segundo y habló con voz baja: "No quiero problemas, amigo".

Giró el cuerpo para regresar por donde había venido, pero apenas dio un paso se encontró con otro chico bloqueándole el paso. Miró a un lado y luego al otro. No estaba solo. Había más sombras moviéndose alrededor.

Char: ¡No me jodan! ¡Váyanse! ¡¿Qué?! ¿Van a golpearme?
-¡Algo así!

Al darse vuelta por completo, vio a Ronald frente a él. La luz intermitente de un poste cercano alcanzaba apenas para reconocer su rostro.

Ronald: Y... quiero saber si tú sabes por qué te vamos a golpear.
Char: ... ¿De qué mierda hablas?
Ronald: Vamos, dinos, ¿qué piensas? ¿No sabes por qué?
Shei: ¡Yo creo que sí sabe!
Ronald: Claro que sabe, admítelo. Siente un poco de culpa, ¡hijo de puta!
Char: ... Yo no hice nada, ¡nada!

Los cuatro comenzaron a avanzar al mismo tiempo. Char intentó retroceder, pero no había espacio. El primer golpe lo tomó por sorpresa, directo al estómago, dejándolo sin aire. Luego vinieron más, puños que impactaban en su cara y costillas, patadas que lo hicieron perder el equilibrio hasta caer al suelo. Trató de cubrirse la cabeza mientras los golpes seguían cayendo sin pausa: "¡Basta! ¡Me arrepiento! ¡Basta, por favor!", gritaba entre jadeos, intentando apartarse.

Pero nadie respondió. Solo se escuchaban los impactos y su voz quebrada repitiendo lo mismo, cada vez más débil, mientras la noche seguía igual de oscura alrededor.

A la mañana siguiente, Dann estaba en la cocina preparando el desayuno sin mirar el reloj. Movía las cosas con cuidado, midiendo el café, cortando el pan en partes iguales, como si ese orden mínimo pudiera sostener algo más grande. No probó nada. Solo acomodó todo en una bandeja.

Subió las escaleras despacio, sosteniéndola con ambas manos. Frente a la puerta del cuarto de Alice se detuvo un momento, escuchando el silencio del otro lado. Bajó la bandeja y la dejó en el suelo, justo frente a la puerta cerrada. Luego golpeó con los nudillos, suave pero firme: "Debes comer algo, si tienes hambre, solo abre la puerta". Esperó en silencio. Dann ya estaba listo para no recibir respuesta cuando, desde adentro, se escuchó la voz de Alice, baja y quebrada: "Por favor, vete".

Dann cerró los ojos un segundo y respiró profundo. No discutió. No insistió. Antes de girarse para irse, apoyó la mano en la madera y habló sin levantar la voz: "Murió. Él murió… lo asesinaron a golpes".

Se alejó caminando despacio hacia las escaleras, con la mirada fija en los escalones. Cada paso parecía más pesado que el anterior. Cuando ya estaba a mitad de camino, escuchó un sonido leve detrás de él. Se detuvo.

A lo lejos, la puerta del cuarto se abrió apenas. Dos manos salieron con cuidado, temblando todavía, y tomaron la bandeja del desayuno para meterla dentro.
Dann observó la escena sin moverse. Una leve sonrisa apareció en su rostro antes de bajar el resto de las escaleras.

Alice volvió a sentarse en la cama con la bandeja apoyada sobre las piernas. No tocó la comida. Entre el vaso y el plato había una nota pequeña, doblada con cuidado. La abrió sin apuro: "No importa cuánto tiempo pase, tu valor no se quedó en ese momento. Sigue aquí, aunque a veces te cueste verlo”.

Sus ojos regresaron al mismo punto del suelo donde se habían quedado desde la noche anterior. Pero esta vez algo se movía detrás de esa mirada fija. Empezaron a aparecer recuerdos sin orden. La tarde en que volcó café sobre la computadora de Dann y ambos salieron corriendo como si el mundo fuera a terminar por una pantalla rota.
La vez que no podía dejar de reír cuando Dann, torpe, terminó con el preservativo pegado en la cara y fingía dignidad. El beso que compartieron sin planearlo, en silencio, sin público.

Alice dobló el papel y se lo llevó al pecho, presionándolo contra su cuerpo como si esa hoja pudiera devolverle algo que sentía lejos. Se levantó despacio y encendió las luces del cuarto. La claridad no cambió todo, pero ya no estaba en oscuridad. Tomó el celular.

En la sala de estar, Dann estaba sentado en el sofá, mirando el vacío sin prestar atención a la televisión apagada frente a él. El teléfono vibró en su mano. Miró la pantalla y respondió de inmediato.

Dann: ¿Sí?
Alice: ¿Puedes venir?
Dann: ... Alice...
Alice: Ven, por favor.

Subió las escaleras sin correr. Tocó la puerta. Esta vez, Alice la abrió. Se miraron unos segundos antes de sentarse en la cama, dejando un espacio pequeño entre ellos.

Alice: ... ya no sé ni qué decirte
Dann: A veces, estar en silencio es mejor
Alice: ... sí
Dann: Aunque... quiero preguntarte, ¿cómo has dormido?
Alice: ... bueno, he tenido pesadillas de eso. Escucho la misma respiración agitada, sus palabras de... esas cosas horribles que decía y...
Dann: Basta, no hace falta que me digas nada de eso
Alice: ... ¿Cuándo empezaste a sentir cosas por mí?
Dann: ... desde el día que me arruinaste la laptop
Alice: ¿En serio?
Dann: Sí, me enojé, y mucho, pero... debo decir: que fue una forma tan valiente de pedirme casamiento
Alice: (ríe mínimamente)

En ese momento, la puerta se abrió de golpe, como empujada por una fuerza que no pertenecía a nadie visible. Tres hombres entraron en fila, vestidos con uniformes de gala militar impecables. El primero llevaba un bombo enorme colgado al pecho, el segundo sostenía un trombón de varas y el tercero un clarinete. Sin anunciarse, comenzaron a tocar con energía exagerada, llenando el cuarto de un ruido festivo que no encajaba con nada.
Dann y Alice se llevaron las manos a los oídos al mismo tiempo. No sonreían. No entendían. El sonido no traía alivio. Solo más presión. Los tres hombres dejaron de tocar. Se miraron entre ellos, incómodos, como si hubieran entrado en la habitación equivocada. Sin decir palabra, dieron media vuelta y salieron.

(... no se que decir, tenía pensado una broma pero... ¿ellos se taparon los oídos?, ¿no me necesitan?)

La puerta volvió a cerrarse. Alice y Dann se miraron. Había muchas cosas por decir, pero ninguna salió. No porque no existieran, sino porque no era el momento. Permanecieron sentados, compartiendo el silencio sin huir de él.

Al día siguiente, Alice intentó llamar varias veces a Marie. El teléfono sonaba y nadie respondía. Volvía a marcar, esperando un cambio que no llegaba. Dann, en su cuarto, recogía los restos del desastre que había provocado. Levantaba libros del suelo, juntaba hojas rotas, apartaba la laptop destruida sin mirarla demasiado. El orden regresaba poco a poco, aunque no era el mismo de antes.

Ambos salieron de sus habitaciones casi al mismo tiempo. Bajaron las escaleras y se detuvieron frente a la puerta principal.

Dann: ¿No sabes nada de Marie?
Alice: No... intenté abrir la puerta de su cuarto, pero está cerrada
Dann: ... debe estar por ahí, no sé
Alice: Probablemente
Dann: ¿Con que así termina todo...
Alice: No... ¿Quién dice que debe terminar así?
Dann: (sonríe)

Al salir, Dann tomó una dirección sin mirar atrás. Alice eligió la opuesta. Caminaban por la misma calle, pero en sentidos distintos.

Alice llegó a casa de sus padres. La puerta estaba abierta. Entró y los encontró sentados en la sala, esperándola. Se sentó frente a ellos.

Alice: Debo decirles algo
Sheila: ...
Miró: ... algo no me sienta bien
Alice: ... (baja la mirada)
Sheila: ¿Qué es, hija?
Alice: Yo... yo...
Miró: ¡¿Qué?! ¡Habla!
Alice: ... (respira profundo) Voy a dejar de vivir en la casa
Sheila: ...
Miró: ¿Eh?
Alice: ¿Puedo volver a vivir aquí? Con ustedes?
Sheila: Alice... somos tus padres, ¿tú crees que te íbamos a decir no?
Miró: ... Alice, gasté mucho en esa casa, mucho, y nunca en mi vida me arrepentí tanto de haber gastado todo en esa casa y no haberlas llevado de viaje
Sheila: ¿Eso qué significa?
Miró: Bueno... los tres tenemos nuevos boletos

Las sonrisas aparecieron con esfuerzo, pero estaban ahí.

Miró: ¡Basta! ¡Ya! ¡Muy lindo todo! Pero me hiciste pagar tanto dinero para que al final ¡quieras volver a vivir aquí? ¡Y yo pensando que iba a ganar más!
Alice: Bueno... mamá tendrá que conseguir nuevo trabajo entonces
Sheila: ¿Y tú qué? ¿Vas a vivir plácidamente?
Alice: ¡Obviamente!
Miró: No. Ahora vamos a implementar nuevas reglas en la casa
Sheila: Esperé días y noches a que digas algo así, ¡te juro!
Miró: Siempre hay una primera vez para escucharlo.

Mientras tanto, Dann llegó a casa de sus padres. Apenas cruzó la puerta, ambos lo rodearon con un abrazo que no pidió, pero tampoco rechazó. Pasó luego al cuarto de sus dos hermanas pequeñas. Estaban sentadas en el suelo haciendo la tarea, concentradas. Su madre se acercó por detrás: "¿Quieres un café?"

Dann tomó la taza cuando ella se la ofreció. Miró a sus hermanas un segundo y, sin advertencia, arrojó el café sobre los papeles y cuadernos. Las hojas se mancharon de inmediato.

Las dos niñas se quedaron quietas un instante, sorprendidas. Luego gritaron su nombre y salieron corriendo tras él. Dann escapó hacia el patio, riendo por primera vez en días. Escaló el árbol sin cuidado, apoyando los pies donde encontraba espacio, mientras ellas intentaban alcanzarlo desde abajo. Padre y madre observaban la escena desde la puerta, sosteniendo cada uno una taza de café.

-Siempre has querido vivir esto de nuevo, ¿no?
-Desde que se encerró en su cuarto
-¿Te acuerdas cuando Heidi y Riana se peleaban?
-¿Cómo no? Se tiraban de los pelos
-Bueno, adivina quién le enseñó a Dann a separarlas
-... no hace falta que me lo digas
-¡Yo! Su papá!
-¿Me traes otra taza?
-Sí
-¡Pero con café! No hagas como la última vez!

(El amor es tan lindo. Pero sigo sin entenderlo. Creo que es la primera vez en toda esta historia que... digo algo que no sea estupido. ¿Qué cosas, no?).

The End.

  function show(fn){
    busy=true; stage.classList.remove('on');
    setTimeout(function(){ fn(); stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },FADE);
  }

  function prev(){
    if(busy||panelOpen||stage_!==2||i<=0) return;
    finished=false; i--; save(i);
    var it=items[i];
    show(function(){render(it)});
  }

  function next(e){
    if(e && e.type==='click' && e.clientX < window.innerWidth/2){ prev(); return; }
    if(busy||finished||panelOpen) return;
    if(stage_===1){ stage_=2; save(0); show(function(){i=0;render(items[0]);}); return; }
    if(stage_===2){
      if(i+1>=items.length) return;
      i++;
      var it=items[i];
      if(it.t==='end'){ finished=true; clear(); } else save(i);
      show(function(){render(it)});
    }
  }

  // ---- botones: capítulos y reinicio ----
  var panelOpen = false;
  var btnCh = document.getElementById('btnCh'),
      btnReset = document.getElementById('btnReset'),
      panel = document.getElementById('panel'),
      list = document.getElementById('list');

  function showUI(){ btnCh.classList.add('show'); btnReset.classList.add('show'); }
  function setPanel(o){ panelOpen = o; panel.classList.toggle('open', o); }

  items.forEach(function(it, idx){
    if(it.t !== 'ch') return;
    var b = document.createElement('button');
    b.className = 'chi';
    var t = document.createElement('b'); t.textContent = it.s;
    var s = document.createElement('span'); s.textContent = it.n;
    b.appendChild(s); b.appendChild(t);
    b.addEventListener('click', function(e){
      e.stopPropagation();
      setPanel(false);
      if(busy) return;
      i = idx; stage_ = 2; finished = false; save(idx);
      show(function(){ render(items[idx]); });
    });
    list.appendChild(b);
  });

  btnCh.addEventListener('click', function(e){ e.stopPropagation(); if(!busy) setPanel(true); });
  panel.addEventListener('click', function(e){ e.stopPropagation(); setPanel(false); });

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  });

  var armTimer = null;
  btnReset.addEventListener('click', function(e){
    e.stopPropagation();
    if(!btnReset.classList.contains('armed')){
      btnReset.classList.add('armed');
      armTimer = setTimeout(function(){ btnReset.classList.remove('armed'); }, 2500);
      return;
    }
    clearTimeout(armTimer); clear(); location.reload();
  });

  // ---- retomar o intro ----
  var saved = load();
  if(saved >= 0 && saved < items.length && items[saved].t !== 'end'){
    showUI();
    i = saved; stage_ = 2;
    render(items[i]);
    setTimeout(function(){ stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },200);
    document.addEventListener('click',next);
    document.addEventListener('keydown',function(e){
      if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();next();}
    });
    return;
  }

  // ---- intro ----
  setTimeout(function(){
    box.appendChild(el('intro',INTRO));
    stage.classList.add('on');
    setTimeout(function(){
      stage.classList.remove('on');
      setTimeout(function(){
        box.innerHTML=''; box.appendChild(el('big title',TITLE));
        stage.classList.add('on');
        setTimeout(function(){busy=false;stage_=1;showUI();},FADE);
      },FADE);
    },INTRO_MS);
  },200);

  document.addEventListener('click',next);
  document.addEventListener('keydown',function(e){
    if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();next();}
  });
})();
</script>
</body>
</html>
