## Capítulo 1: Todo Es Cierto

El edificio Excálibur estaba frente a Martino, era grande y majestuoso. Desde la vereda tuvo que inclinar la cabeza para ver el final de la estructura. Era un edificio enorme, lleno de ventanas oscuras y líneas rectas que parecían repetirse hasta perderse. (Poético 😢).

**Diciembre, 2036.**

Martino cruzó la entrada principal con una sensación rara en el pecho. El interior era amplio y silencioso, con un mostrador al fondo donde estaba la administradora del edificio, Eby. Caminó hasta ella tratando de mantener cierta calma.

Martino: hola
Eby: ¡hola! (Una sonrisa de oreja a oreja) ¿sí? (Ese "sí" sonó igual de dulce que una mandarina en invierno)
Martino: ¿cómo estás? (No pudo evitar preguntar algo que nada tenía que ver)
Eby: ... pues... bien, ¿en qué puedo ayudarte?
Martino: ... bueno... claro, sí. Vengo a ver... (bajó la cabeza para leer en una pequeña hoja cortada con tijera de forma desprolija). Vengo a ver al señor Amadeus Shell.
Eby: ... ¿eres Martino?
Martino: sí.
Eby: ¡un placer! Es decir, todo el mundo habla de que ibas a aparecer aquí y... perdón, no quiero quitarte más tu tiempo, pero... es un placer tenerlo por aquí. No vienen muchas... ya sabes, celebridades.
Martino: claro.
Eby: aquí tienes (una tarjeta).

Cuando terminaron de hablar, Eby le entregó una tarjeta. En ella estaba escrito Ex-34. No era exactamente una sala, sino la tarjeta que permitía abrir la puerta de esa sala.

Martino guardó la tarjeta y comenzó a subir por las escaleras. Al principio lo hizo con decisión, pero el edificio parecía no terminar nunca.

Cada que se sentaba en uno de los escalones, veía pasillos más largos con distintas puertas. Algunas estaban cerradas y en otras se veía un pequeño cartel LED con una palabra simple: "ocupado".

Después de varios pisos, empezó a notar el cansancio. Miró hacia arriba y entendió que todavía faltaba mucho, así que decidió cambiar de idea. Bajó nuevamente hasta encontrar el ascensor. El viaje fue corto y silencioso. (Si te estás aburriendo en este punto... pues... tranquilo, lo que sigue es más interesante).

Cuando las puertas se abrieron, Martino salió a un pasillo limpio y casi vacío. Caminó unos metros hasta encontrar la puerta con la numeración correcta. Durante un segundo dudó. Luego golpeó la puerta (No suelo insultar a mis personajes. Pero, ¡ES UN PUTO ESTÚPIDO!, ¡TIENES UNA TARJETA PARA ABRIR LA PUERTA!).

Se dio cuenta enseguida, sacó la tarjeta (algo molesto consigo mismo) y la deslizó por la cerradura electrónica. El lector (No tú, criatura que encuentra significados en las palabras, sino lo que "lee la tarjeta") emitió un sonido breve y la puerta se abrió. Desde el interior se escuchó una voz.

Una voz con un tono extraño, algo irónico, exagerado, como la de un villano de Disney caricaturesco (para no decir que era la voz de un maricón).

—Pasa, siéntate y preséntate, solo si quieres.

La puerta comenzó a cerrarse sola mientras Martino entraba. El movimiento era lento, casi cuidadoso, hasta que quedó completamente sellada.

La sala era simple. Cuatro paredes muy blancas, un techo del mismo color y un suelo gris. No había muebles, excepto un pequeño banquito en el centro. Martino caminó hasta allí y se sentó. Durante unos segundos no pasó nada.

Luego se escuchó un sonido mecánico suave. Martino levantó la cabeza y vio que una pequeña abertura del techo se había abierto sin explicación (en realidad, si hay una explicación 🤓☝️). No alcanzó a entender qué era. Cuando volvió a mirar hacia el frente, alguien estaba parado frente a él.

Martino dio un pequeño salto en el banquito. El hombre tenía una apariencia imposible de ignorar. Cabello blanco exagerado, sonrisa abierta y una expresión que parecía mezclar diversión con algo difícil de explicar.

Era Amadeus (busca la misma palabra en Google).

Amadeus: da mucho gusto tener a alguien de su escala en este lugar.
Martino: no creo ser el único.
Amadeus: para nada, otros famosos han venido seguido, pero nadie aquí, conmigo.
Martino: okey.
Amadeus: en fin, vayamos al grano, ¿qué te trae por aquí?
Martino: pues... hace dos años visité a mi padre en un lugar de cuidado. Sí, él sigue vivo y mi madre... bueno, no sé dónde está.
Amadeus: bien, continúa.
Martino: cuando lo visité no hablamos nada. Él ya no puede hablar, está muy viejo y... aunque no me dijo ni una sola palabra, me sentí... extraño, decaído (suspira). No puedo ni describirlo.
Amadeus: no hace falta, entiendo con claridad.
Martino: bueno... desde entonces he tenido varias pesadillas, patrones, veo patrones en todas partes. Aquel día que me llamó fracasado, o que... iba a lastimar a mi madre otra vez... o cuando... bueno, da igual. Yo solo quiero "curarme" de alguna forma.
Amadeus: ¿qué buscas aquí?
Martino: ... enfrentar mi trauma, un trauma que no entiendo, pero que me atormenta desde mi puta adolescencia.
Amadeus: (suspira y sonríe levemente) a mí no me gusta escuchar la parte buena de la persona, siento que es justo eso el problema central.
Martino: ¿qué quieres decir?
Amadeus: (se inclina hacia él) quiero escucharte hablar de esas cosas malas que hiciste, como hijo, como persona, como... no sé, como un mal ciudadano, supongo.
Martino: ¿por qué?
Amadeus: ... porque yo voy a ayudarte, voy a ayudarte.

Amadeus comenzó a reír. La risa era fuerte, desordenada y completamente fuera de lugar, igual de alocada que su propia apariencia.

## Capítulo 2: Mentir No Es Pecado

Amadeus: bien, creo que es momento de comenzar.
Martino: ¿qué debo hacer?
Amadeus: nada del otro mundo, solamente... cierra los ojos.

Martino cerró los ojos por un momento, tratando de concentrarse en lo que acababa de escuchar. Frente a él, Amadeus sonreía con una calma incómoda. Luego se levantó del banquito con total tranquilidad y chasqueó los dedos. El cambio fue inmediato.

Desde distintos puntos de la sala comenzaron a aparecer pequeñas partículas tecnológicas, diminutas y luminosas. Se agrupaban, se separaban y volvían a unirse formando estructuras cada vez más complejas. En cuestión de segundos, aquellas partículas empezaron a construir algo mucho más grande.

Un escenario. Las paredes blancas desaparecieron, y aparecieron edificios, calles y luces que tomaban forma con una precisión sorprendente (🤯). El suelo gris se transformó en una vereda realista, con texturas y pequeños detalles que respondían incluso al movimiento.

Amadeus: quizás sientas náuseas, o nada, pero te aseguro que vas a sentir, incluso si es nada.
Martino: ...
Amadeus: mantén tus ojos cerrados... estos... estos... nano... ¡nanobichos!, harán el trabajo.

Las nanoestructuras ("nanobichos" para los amigos) terminaron su trabajo. Martino abrió los ojos lentamente. Al levantar la cabeza vio dos edificios enormes frente a él, idénticos en tamaño y forma. Durante un momento no entendió lo que estaba viendo. Retrocedió un paso, intentando procesar la escena. Al girar el cuerpo observó algo aún más desconcertante.

Cientos de personas caminaban por la calle como si nada fuera extraño. Conversaban, cruzaban la avenida, miraban sus teléfonos o simplemente seguían su camino. Nadie parecía notar la presencia de Martino. Se acercó a uno de ellos.

Martino: ¿dónde estoy?
—What? I don’t understand.

El hombre siguió caminando sin detenerse. Martino volvió a mirar los edificios. Esta vez los observó con más atención y entonces lo entendió. Un pequeño zumbido comenzó a sentirse dentro de su oído. La voz de Amadeus apareció directamente en su cabeza.

Amadeus: no te preocupes, te voy a guiar.
Martino: ¿dónde estoy?
Amadeus: lo sabrás pronto, dirígete al piso 3, allí te encontrarás con un amigo.

Martino decidió moverse. Caminó hacia uno de los edificios y atravesó la entrada principal. El interior era amplio y elegante. Frente a él estaban los ascensores, con una fila ordenada de números iluminados. Presionó el botón del piso 3.

El ascensor subió con suavidad y se abrió en un pasillo silencioso. Al avanzar unos metros, llegó a una sala grande llena de muebles caros, alfombras gruesas y una iluminación cálida.

Mayordomos caminaban con bandejas mientras distintas personas conversaban entre sí. Eran hombres y mujeres (dos mujeres) con apariencia segura, vestidos con ropa costosa. Todo indicaba que se trataba de gente influyente.

En ese momento Martino bajó la mirada. Recién entonces notó que llevaba puesto un traje elegante color carmesí. Un hombre se acercó a él con paso tranquilo.

Doug: ¿eres Martino Lipschitz?
Martino: sí.
Doug: un gusto, acompáñame.

Ambos terminaron sentándose en unos sofás.

Martino: ¿qué es todo esto?
Doug: nada del otro mundo (sonríe), solamente juntadas, y ya.
Martino: ¿siempre hacen juntadas?
Doug: (suspira) hablemos de ti, Martino.
Martino: ... ¿de qué?
Doug: pues, cuéntame algo malo.
Martino: ¿cómo que hago malo?
Doug: lo más incorrecto que hayas hecho, ¿sabes? Cuéntame de aquella vez que robaste.
Martino: ¿cómo sabes eso?
Doug: ¡Mar! ¡Solo cuenta!

**Octubre, 2022.**

Martino tenía doce años y estaba solo dentro del aula. La clase todavía no había terminado, pero el ambiente era extraño. El silencio ocupaba todo el lugar. Solo se escuchaba el sonido del lápiz moviéndose sobre el cuaderno. Mientras escribía, levantó la mirada.

Sobre cada banco había una tablet del colegio. Hacía semanas que los profesores pedían usar esos dispositivos para las actividades diarias. Todas estaban puestas sobre las mesas, quietas, como si esperaran a ser usadas otra vez. Martino dejó de escribir.

Observó la puerta del aula, luego miró hacia las ventanas y finalmente volvió a ver las tablets. Durante unos segundos no se movió. Después extendió la mano con cuidado y tomó una. El movimiento fue lento. La deslizó hacia su mochila y la escondió entre los cuadernos. Cerró la mochila sin hacer ruido y volvió a sentarse como si nada hubiera pasado (JAJAJA, gran ladrón)

Siguió escribiendo. El tiempo parecía avanzar muy despacio. De pronto el timbre del recreo sonó en todo el colegio. Las voces comenzaron a escucharse en los pasillos y los alumnos regresaron al aula poco después. Martino también volvió, entrando junto con el resto del grupo.

La maestra pidió que todas las tablets fueran devueltas y apiladas en el escritorio del frente. Los estudiantes comenzaron a levantarse y caminar hacia allí, chocándose un poco entre ellos mientras dejaban los dispositivos. Martino se levantó también. Se acercó junto al resto, esperando el momento correcto.

Mientras todos estaban ocupados dejando sus tablets sobre la pila, él hizo un movimiento rápido y dejó caer algo dentro del cesto de basura que estaba cerca del escritorio. Regresó a su banco. La clase continuó con normalidad. Nadie dijo nada. Nadie pareció notar nada. La escena volvió a cambiar.

**Diciembre, 2036.**

Doug: ¡jajaja! ¿Y te descubrieron?
Martino: no, nadie lo sabe, bueno, al parecer tú sí.
Doug: solo quería escuchar tu versión, hay muchos que dicen... ya sabes, exageran.
Martino: ¿quién lo dice?
Doug: no importa eso. Bueno, voy a ir a lo que realmente importa.

El hombre sentado frente a Martino levantó la mano y chasqueó los dedos. Un mayordomo apareció casi de inmediato, caminando con una postura perfecta. En sus manos llevaba un sobre cerrado. El mayordomo se lo entregó al hombre, quien lo sostuvo durante un segundo antes de extenderlo hacia Martino.

Dentro había fotografías. Las imágenes estaban ordenadas de una forma peculiar, como si alguien hubiera armado una secuencia con cuidado. Martino comenzó a revisarlas una por una, observándolas con atención mientras la confusión crecía lentamente en su rostro.

Martino siguió revisando las fotografías con cuidado. Eran imágenes de distintas personas, distintos lugares, distintos momentos. Algunas parecían antiguas, otras más recientes. No había un orden claro al principio, aunque después empezó a notar que todas parecían conectadas de alguna manera.

El hombre lo observaba con tranquilidad. Cuando Martino levantó la vista, el hombre comenzó a hablar con una calma extraña, como si estuviera explicando algo completamente cotidiano.

Tu bisabuelo, en los años cincuenta, era un tipo común. Trabajaba, hablaba demasiado en los bares, conocía gente porque el mundo antes funcionaba así. Salías de tu casa y terminabas conversando con desconocidos. Una noche coincidió con un viajero europeo que estaba recorriendo Sudamérica después de la guerra. Charlaron un rato. Nada trascendental. Dos hombres tomando algo, hablando de trabajo y de lo caro que estaba todo.

Ese viajero europeo había trabajado antes en un puerto del Mediterráneo. Allí conoció a un ingeniero egipcio que viajaba constantemente por negocios. Se vieron varias veces porque el ingeniero siempre terminaba en el mismo café del puerto esperando barcos retrasados. Conversaban sobre política internacional, sobre el petróleo que empezaba a reorganizar la economía del mundo. Ninguno recordaría la charla años después.

El ingeniero egipcio, a su vez, tenía un primo que estudiaba en Arabia Saudita durante los años setenta. Ese primo participaba en círculos religiosos universitarios donde se discutía la influencia occidental en Medio Oriente. En una de esas reuniones conoció a un joven saudí que comenzaba a ganar fama entre estudiantes por su discurso religioso y político. Hablaron varias veces. Debates, discusiones, café. Nada que pareciera histórico en ese momento.

Ese joven saudí era Osama bin Laden. Décadas después, ese mismo hombre organizaría el atentado.

Martino: ¿atentado? ¿Qué atentado?
Doug: levántate a verlo.

Martino se quedó quieto durante unos segundos, todavía sosteniendo las fotografías. Luego se levantó lentamente del sofá, caminando hacia el gran ventanal del salón. Afuera, la ciudad seguía moviéndose como si nada fuera extraño.

Se acercó al vidrio. Desde esa altura podía ver perfectamente los edificios cercanos. En ese momento notó algo que le llamó la atención. A lo lejos, un avión avanzaba a gran velocidad en dirección directa hacia uno de los edificios.

La distancia se reducía rápidamente. Algunas personas dentro del salón comenzaron a notar lo mismo. Primero fue un murmullo bajo, después voces cada vez más nerviosas. Varias personas se levantaron, otras comenzaron a gritar cuando entendieron lo que estaba pasando.

El avión seguía acercándose. Los gritos aumentaron alrededor de Martino. Algunos corrían, otros intentaban mirar por las ventanas desde distintos ángulos. Martino no se movió.

Simplemente se quedó mirando a su propia muerte. (¿Entiendes? Porque el avión lo va a matar.... 😐).

## Capítulo 3: Donovan

**2031 (por favor presta atención a los años)**

Amadeus y Donovan estaban sentados frente a frente en unos sofás amplios dentro de un salón elegante. Varias personas los rodeaban, algunos con copas en la mano, otros inclinados hacia adelante escuchando la conversación. El ambiente parecía relajado, casi festivo.

Donovan: ¿tienes eso que queremos? ¿O debemos seguir buscando?
Amadeus: lo tengo, siempre lo voy a tener.
Donovan: ¿hace cuántos años vienes de esto?
Amadeus: desde que nací. Además, estudié en Barcelona, en el instituto...
Donovan: ¿instituto? ¿Es en serio? ¡Jajaja!

Las personas alrededor comenzaron a reír. Primero algunos, luego casi todos. La risa se expandió por el salón mientras Amadeus permanecía completamente en silencio, observando a Donovan sin moverse.

Donovan: hablando en serio, ¿hace cuántos años vienes de esto?
Amadeus: pues... de pequeño, bueno, ya sabes, tomaba un palo de algún árbol y simulaba como si estuviese en el teatro, el palo era el micrófono.
Donovan: ahora sí nos entendemos.

La escena se oscurece.

Amadeus ahora estaba frente a una orquesta completa. Decenas de músicos lo observaban con atención mientras él levantaba las manos con seguridad. Con un movimiento claro marcó el inicio, guiando a los instrumentos con gestos firmes.

Los violines comenzaron primero, luego se sumaron los metales y la percusión. Cada cambio de ritmo respondía a sus manos. Amadeus parecía controlar cada parte de la música con una precisión absoluta.

La escena se oscurece.

Volvemos al mismo salón de antes. Donovan y Amadeus estaban nuevamente frente a frente.

Donovan: tenemos una mala noticia, creo que hay un reemplazo.
Amadeus: ¿reemplazo? ¿De qué hablas?
Donovan: alguien mejor que tú, con un legado más prometedor.
Amadeus: pero... yo... estuve desde el inicio, no pueden solo dejarme tirado así porque así, o sea, no vieron todo mi potencial.
Donovan: exactamente, nunca vimos tu potencial, por eso debes irte.
Amadeus: ...

Sin aviso, Amadeus se levantó con rapidez y lanzó un golpe directo al rostro de Donovan.

La escena se oscurece.

La noche era oscura y la lluvia caía con fuerza. Dos hombres sujetaban a Amadeus con firmeza mientras lo empujaban hacia afuera del lugar. Él intentaba mantenerse en pie mientras el agua caía sobre su rostro.

—Eres un maldito fracasado, Amadeus. El apellido Shell no te hace honor.
Amadeus: ... ¡jódete!

La escena se oscurece.

Un trueno fuerte iluminó el cielo. Amadeus estaba frente al edificio Excálibur. Permanecía quieto bajo la lluvia, levantando la cabeza para mirar toda la estructura mientras el agua corría por su rostro.

La escena se oscurece.

**Diciembre, 2036**

Martino estaba inclinado sobre un pequeño tacho, vomitando mientras su cuerpo todavía reaccionaba a lo que acababa de ver. Amadeus estaba cerca, pasando su mano por el pecho de Martino con calma, como si intentara estabilizarlo.

Martino: tantas náuseas... (vuelve a vomitar), ¿tanto?
Amadeus: al parecer eres débil a las simulaciones.
Martino: son muy reales, y los movimientos de esos... "nanobichos" son hipnóticos.

Martino respiró hondo varias veces hasta poder enderezarse. Su cuerpo todavía temblaba un poco.

Martino: ¿sabes qué? Terminamos, no me siento ayudado.

Caminó hacia la puerta de la sala e intentó abrirla usando la tarjeta, pero el lector no respondió. Probó otra vez, deslizando la tarjeta con más fuerza, aunque el sistema seguía completamente bloqueado. Se dio vuelta para mirar a Amadeus.

Martino: ... ¿por qué la puerta no abre?
Amadeus: la mejor opción es no irse.

Los nanobichos comenzaron a moverse otra vez. Miles de partículas se agruparon rápidamente hasta formar una mano enorme que envolvió el cuerpo de Martino. Lo levantó del suelo durante un segundo y luego lo soltó, dejándolo caer con fuerza.

Antes de que pudiera levantarse, las partículas cambiaron de forma nuevamente. Esta vez imitaron brazos que lo tomaron y lo sentaron en el banquito, obligándolo a quedarse quieto.

La puerta de la sala se abrió. Dubois entró caminando con calma. Se sentó junto a Martino.

Dubois: toda tuya. (le entregó la tablet)
Martino: ... ¿y esto qué es?

Los nanobichos comenzaron a activarse. Pequeñas partículas tecnológicas se elevaron y empezaron a reconstruir un nuevo escenario: el colegio Monseñor Gottau.

Dubois: ¿lo reconoces?
Martino: ...
Dubois: (reía jadeando, con una risa asmática que sonaba a cinismo y poder, pero también a falta de aire).

Dubois se levantó y se fue. En la tableta aparecieron cuatro nombres conocidos: Isadox, Santillán, Garilda y Moreno, acompañados de imágenes de sus rostros. Nuevamente, la voz de Amadeus se escuchó.

Amadeus: ¿a quién escoges?
Martino: ... ¿a qué te refieres?
Amadeus: solo puedes salvar a uno.
Martino: ... (levanta la mirada)
Amadeus: tic, tac.

Un minuto para elegir. Los nanobichos comenzaron a recrear momentos con cada uno de esos rostros. (No iba a ser nada fácil escoger, ¿verdad?). Imágenes y espacios tomaron forma poco a poco, recreando momentos específicos de la vida de Martino con sus amigos.

**2025**

    var b = document.createElement('button');
    b.className = 'chi';
    var t = document.createElement('b'); t.textContent = it.s;
    var s = document.createElement('span'); s.textContent = it.n;
    b.appendChild(s); b.appendChild(t);
    b.addEventListener('click', function(e){
      e.stopPropagation();
      setPanel(false);
      if(busy) return;
      i = idx; stage_ = 2; finished = false; save(idx);
      show(function(){ render(items[idx]); });
    });
    list.appendChild(b);
  });

  btnCh.addEventListener('click', function(e){ e.stopPropagation(); if(!busy) setPanel(true); });
  panel.addEventListener('click', function(e){ e.stopPropagation(); setPanel(false); });

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  });

  var armTimer = null;
  btnReset.addEventListener('click', function(e){
    e.stopPropagation();
    if(!btnReset.classList.contains('armed')){
      btnReset.classList.add('armed');
      armTimer = setTimeout(function(){ btnReset.classList.remove('armed'); }, 2500);
      return;
    }
    clearTimeout(armTimer); clear(); location.reload();
  });

  // ---- retomar o intro ----
  var saved = load();
  if(saved >= 0 && saved < items.length && items[saved].t !== 'end'){
    showUI();
    i = saved; stage_ = 2;
    render(items[i]);
    setTimeout(function(){ stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },200);
    document.addEventListener('click',next);
    document.addEventListener('keydown',function(e){
      if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();next();}
    });
    return;
  }

  // ---- intro ----
  setTimeout(function(){
    box.appendChild(el('intro',INTRO));
    stage.classList.add('on');
    setTimeout(function(){
      stage.classList.remove('on');
      setTimeout(function(){
        box.innerHTML=''; box.appendChild(el('big title',TITLE_SHOW));
        stage.classList.add('on');
        setTimeout(function(){busy=false;stage_=1;showUI();},FADE);
      },FADE);
    },INTRO_MS);
  },200);

  document.addEventListener('click',next);
  document.addEventListener('keydown',function(e){
    if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();next();}
  });
})();
</script>
</body>
</html>
