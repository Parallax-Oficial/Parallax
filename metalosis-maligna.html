<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metalosis Maligna — Parallax</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--fade:450ms}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none}
body{font-family:'Inter',system-ui,sans-serif;cursor:pointer}
#stage{position:fixed;inset:0;display:flex;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  padding:calc(env(safe-area-inset-top,0px) + 32px) 28px calc(env(safe-area-inset-bottom,0px) + 32px);
  text-align:center;opacity:0;transition:opacity var(--fade) ease}
#stage.on{opacity:1}
#box{max-width:34rem;width:100%;margin:auto}
#stage::-webkit-scrollbar{display:none}
.intro{font-size:1.1rem;letter-spacing:.08em;font-weight:400}
.big{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:1.05;letter-spacing:.02em}
.title{font-size:clamp(3rem,16vw,6rem)}
.p{font-size:1.15rem;line-height:1.7;text-align:left;font-weight:400;margin:.4rem 0}
.tag{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:1.5rem;text-align:center;line-height:1.3;margin:1.4rem 0 .6rem}
.who{font-weight:600}
.ui{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:10px;z-index:5;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;background:none;border:0;color:#fff;
  opacity:0;pointer-events:none;transition:opacity var(--fade) ease}
.ui.show{opacity:.35;pointer-events:auto}
.ui.show:active,.ui.armed{opacity:1}
</style>
</head>
<body>
<div id="stage"><div id="box"></div></div>
<button class="ui" id="btnReset" aria-label="Reiniciar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
<!-- ============ HISTORIA ============ -->
<script type="text/plain" id="story">
**2011**

—Carlos ha experimentado un nuevo dolor. Ya no es incómodo, ahora es una sensación mucho más delicada. Siente cómo su piel y carne se estiran de formas que no deberían, todo por esas partes metálicas que están a punto de descender.

—¿Hay alguna forma de evitar eso?

—Sí, podríamos hacerle una cirugía para cortar esas partes que pueden atravesar la piel, pero será inútil, ya que esas células se multiplican y desarrollan más y más tejidos metálicos, y cada vez de forma más acelerada. No podríamos hacerle muchas cirugías a Carlos, y más teniendo en cuenta que día tras día estas se crean rápidamente.

En ese momento, Carlos entró al escritorio.

—¡Carlos! ¿Qué haces aquí? Debes descansar, esas partes pueden dañarte si te mueves mucho.

—(Golpea un mueble).

—Vuelve a tu habitación.

—(Golpea el mueble).

—¡Vuelve!

Carlos lo observó fijamente y se fue, también observando cómo su piel estaba a punto de desprenderse.

—¿Viste su piel?

—Sí, la metalosis está a punto de nacer.

—Y pensar que solo puede sacar su frustración con golpes.

—Sí... y no.

—¿A qué te refieres?

—Es su forma de comunicarse, con golpes, reparaciones o señas. La metalosis le impide hablar.

—¿Y eso por qué?

—Su forma del habla está estropeada por pequeños metales que afectaron su garganta.

**∶Cámara Encendida∶**

—¿Y díganos, doctor, cómo se siente al estar enfrentando todo esto?

—Bastante mal. No puedo hacer nada y lo poco que puedo hacer... no cambia las cosas.

—Claro... ¿Cómo era Carlos antes de todo esto?

—Eso no lo sé. Sabemos que perdió a su familia cuando tuvo el accidente.

—¿Fallecieron?... Lo lamento.

—No... lo dejaron solo luego de traerlo al hospital, como si... aprovecharan la oportunidad de deshacerse de él.

—...

El camarógrafo se levanta, despidiéndose de Meth, el doctor. Con su permiso, comenzó a grabar tomas sobre el hospital y de Carlos. La idea era crear un documental, el primero que habla de las enfermedades desgarradoras y mortales, o al menos una de todas.

**Dos días después**

—Hola, Carlos.

—(Respira) (Golpea).

—Tu cumpleaños. Jamás te lo pregunté, ¿cómo lo pasaste con todos nosotros?

Carlos se levanta para enseñarle las partes metálicas ya fuera de su interior.

—¡Mierda! ¡Carlos! Estás...

—(Respira).

—Dolor... claro.

—(Golpea dos veces) (Observa el único libro de su habitación).

—Bien, me alegra saber que en tu cumpleaños te la pasaste bien.

—(Golpea cinco veces).

—¿Qué? Te dije que no hagas eso.

—(Golpea cinco veces).

—No digas idioteces. Tal vez no puedas salvarte, pero... realmente eso no lo sé. Todo lo que sabemos solo... nos dan menos esperanzas, pero no vas a morir. Te doy mi palabra.

—(Golpea cinco veces).

—...Bien... si eso quieres... dejaremos las investigaciones y... nos enfocaremos en tu bien. Que pases tu mejor momento de tu vida en este estado.

—(Respira) (Parpadea).

—De nada... No vas a morir, Carlos... no vas a morir.

**31 de diciembre de 2011**

—En este último tiempo nos hemos enfocado en una mejor experiencia para Carlos, aun con todo esto.

—Y... ¿cómo lo han ayudado?

—Siempre ha estado en este hospital, como su cárcel. Por eso ha podido viajar.

—¿Quién paga todo eso?

—Yo... no lo voy a abandonar, no como su puta familia. Haré que sus últimos días sean los mejores.

—Bien... ¿y qué más me cuentas?

—...Puedo saber que se divierte, lo noto por sus expresiones, y... se lo ve feliz, pero cada vez que regresa vuelve a tener una mirada de... que no hay salvación.

—Anteriormente me comentaste que él quiere ver a su familia, y que ese fue su regalo de cumpleaños, que nunca recibió, al parecer.

—No logré contactarme con ellos.

—Y... ¿qué harás en esta fiesta de Año Nuevo?

—Estaré con Carlos y mi equipo. Será lo mejor para él. Creo que debe ser escuchado, aunque no pueda hablar.

**2012**

—Todo empeoró. Lo que me imaginaba que iba a pasar es peor, mucho peor.

Carlos ya no quiere dormir, mucho menos salir. Apenas puede caminar cómodamente. Uno de sus brazos fue reemplazado por partes metálicas. Una parte de su rostro es... preocupante. Solo imagina un cyborg, pero de la forma más cruda, realista y... grotesca posible.

Carlos no solo estaba quedando irreconocible, también se volvía cada vez más agresivo. Pensaba en su familia y quería verlos.

Poco tiempo después, el rostro y aspecto de Carlos era imposible de no notar. Esas partes metálicas habían reemplazado su cara y gran parte de su cuerpo. Si antes no podía hablar, ahora no puede respirar. No se sabe si puede ver o sentir dolor, sentimientos o emociones. Solo se mueve. Su corazón aún late, pero quién sabe si es capaz de amar.

—Hola, Carlos.

—...

—Espero que puedas escucharme. ¿Me oyes?

—...

—Es incómodo hablarte viéndote así... Tu familia viene a verte. Todo este tiempo yo tuve su número de teléfono, que siempre pensé que era un número inexistente, pero no. Ellos jamás contestaban, por eso... los rastreé y... ahora van a entrar.

Su exmujer Sesilia y sus cuatro hijos, Brian, Nico, Jaime y Veto, entraron a la sala, observando a su padre, o al menos lo que queda de él. Solo podían verlo, ya que ellos no querían hablarle. Tenían miedo.

El doctor los dejó solos. Su hijo menor no se acercaba, estaba horrorizado. Sesilia se acercó lentamente y se animó a hablarle:

—Perdón... perdón por todo... (Comienza a llorar). Mis padres jamás te aceptaron y...

—...

—Y... solo quería protegerte, a ti y a tus hijos. Tú sabes cómo son mis padres, ¡debes creerme!...

—...

—Perdón... no quería gritarte. ¡Chicos! ¡Saluden a papá!

Nadie lo saludó. Solo lo observaban como si no fuera un ser humano. La verdad es que ya no lo es...

Sesilia les decía a susurros que lo abrazaran, como si todo fuera forzado. Me atrevería a decir que sí lo es.

Al final, todos se marcharon. El doctor los observó de lejos mientras solamente se alejaban de él.

**∶Cámara Encendida∶**

—Lo único que puedo decirte para acabar con esto es... la Metalosis Maligna lo logró...

The End
</script>
<script>
(function(){
  var TITLE = 'Metalosis Maligna';
  var INTRO = 'Parallax presenta...';
  var FADE = 450, INTRO_MS = 3000;
  var KEY = 'parallax-progreso:' + TITLE;
  function save(n){ try{ localStorage.setItem(KEY, String(n)); }catch(e){} }
  function clear(){ try{ localStorage.removeItem(KEY); }catch(e){} }
  function load(){ try{ var v = parseInt(localStorage.getItem(KEY),10); return isNaN(v)?-1:v; }catch(e){ return -1; } }
  var stage = document.getElementById('stage'), box = document.getElementById('box');
  
  var MAXLEN = 600;
  function splitLong(s){
    if(s.length <= MAXLEN) return [s];
    var mid = s.length/2, best = -1, bestD = 1e9, re = /[.!?”"»)]\s+/g, m;
    while((m = re.exec(s))){
      var cut = m.index + m[0].length;
      var d = Math.abs(cut - mid);
      if(cut > 80 && s.length - cut > 80 && d < bestD){ bestD = d; best = cut; }
    }
    if(best < 0){
      var sp = s.indexOf(' ', Math.floor(mid));
      best = sp < 0 ? s.lastIndexOf(' ', Math.floor(mid)) + 1 : sp + 1;
    }
    if(best <= 0 || best >= s.length) return [s];
    return splitLong(s.slice(0,best).trim()).concat(splitLong(s.slice(best).trim()));
  }
  
  var items = [];
  document.getElementById('story').textContent.split('\n').forEach(function(raw){
    var l = raw.trim(); if(!l) return;
    var m;
    if(/^The End\.?$/i.test(l)) items.push({t:'end',s:l});
    else if((m = l.match(/^\*\*(.+)\*\*$/))) items.push({t:'tag',s:m[1]});
    else if((m = l.match(/^—(.+)$/)) || (m = l.match(/^(.+):\s*(.+)$/))){
      var txt = m[1] || l;
      splitLong(txt).forEach(function(part){ items.push({t:'p',s:'— ' + part}); });
    }
    else splitLong(l).forEach(function(part){ items.push({t:'p',s:part}); });
  });
  
  function el(cls,txt,tag){var e=document.createElement(tag||'div');e.className=cls;e.textContent=txt;return e}
  function render(it){
    box.innerHTML='';
    if(it.t==='end') box.appendChild(el('big title',it.s));
    else if(it.t==='tag') box.appendChild(el('tag',it.s));
    else box.appendChild(el('p',it.s));
  }
  
  var i=-1, busy=true, stage_=0, finished=false;
  function show(fn){
    busy=true; stage.classList.remove('on');
    setTimeout(function(){ fn(); stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },FADE);
  }
  function prev(){
    if(busy||stage_!==2||i<=0) return;
    finished=false; i--; save(i);
    show(function(){render(items[i])});
  }
  function next(e){
    if(e && e.type==='click' && e.clientX < window.innerWidth/2){ prev(); return; }
    if(busy||finished) return;
    if(stage_===1){ stage_=2; save(0); show(function(){i=0;render(items[0]);}); return; }
    if(stage_===2){
      if(i+1>=items.length) return;
      i++;
      var it=items[i];
      if(it.t==='end'){ finished=true; clear(); } else save(i);
      show(function(){render(it)});
    }
  }
  
  var btnReset = document.getElementById('btnReset');
  function showUI(){ btnReset.classList.add('show'); }
  var armTimer = null;
  btnReset.addEventListener('click', function(e){
    e.stopPropagation();
    if(!btnReset.classList.contains('armed')){
      btnReset.classList.add('armed');
      armTimer = setTimeout(function(){ btnReset.classList.remove('armed'); }, 2500);
      return;
    }
    clearTimeout(armTimer); clear(); location.reload();
  });
  
  var saved = load();
  if(saved >= 0 && saved < items.length && items[saved].t !== 'end'){
    showUI();
    i = saved; stage_ = 2;
    render(items[i]);
    setTimeout(function(){ stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },200);
    document.addEventListener('click',next);
    document.addEventListener('keydown',function(e){
      if(e.key==='ArrowLeft')prev();
      if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight') next();
    });
    return;
  }
  
  setTimeout(function(){
    box.appendChild(el('intro',INTRO));
    stage.classList.add('on');
    setTimeout(function(){
      stage.classList.remove('on');
      setTimeout(function(){
        box.innerHTML=''; box.appendChild(el('big title',TITLE));
        stage.classList.add('on');
        setTimeout(function(){busy=false;stage_=1;showUI();},FADE);
      },FADE);
    },INTRO_MS);
  },200);
  document.addEventListener('click',next);
  document.addEventListener('keydown',function(e){
    if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight') next();
  });
})();
</script>
</body>
</html>
