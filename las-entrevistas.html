-:- ¡1965! Los anuncios cambiaron para siempre. Con la llegada del creador de promociones "Carl Fricaz", los anuncios son dinámicos, complejos y venden cualquier producto sin necesidad de hablar de calidad -:-

La puerta se abrió, un cuarto solo para hablar, cuya única fuente de luz era un foco que titilaba varias veces. Jason se acomodó en el asiento, un sofá, mientras que el entrevistado, Carl Fricaz, se sentaba en una silla incómoda.

Jason: bien, aquí dice que usted inventó los anuncios dinámicos, ¿es verdad?
Carl: ... yo no inventé nada, solamente soy... muy bueno para vender
Jason: claro, por eso traje algo para usted
Carl: ...
Jason: aquí tienes
Carl: ¿un muñeco?
Jason: supongo que sabrías cómo usarlo, ¿no?
Carl: ... ¿quieres que lo venda?
Jason: eres bueno en eso, ¿no?
Carl: ... necesito una sola cosa para eso
Jason: ...
Carl: una audiencia
Jason: la tendrás
Carl: ...

-:- Millones de niños enloquecidos por el nuevo muñeco "¡Bla! ¡Bla!". Está ganando billones y siguen creciendo las ventas para la empresa Touchplay con el nuevo juguete. Pero también es un problema -:-

-:- Muchachos locos arrasaron algunas tiendas cerca de sus hogares apropiándose ilegalmente de los ¡Bla! ¡Bla! -:-

## Capítulo 1: La Locura Más Humana

-:- A finales del año 1960, la ciudad sufrió una inundación caótica. Destruyó casas, el edificio Montecarlo, dos iglesias cristianas y acabó con 134 millones de muertos -:-

-:- Cuando la inundación desapareció, su impacto aún se sentía entre todos, sobre todo para el edificio Montecarlo, conocido por transmitir las noticias del día a día. Montecarlo fue derrumbado y generó escasez de trabajo. Nació, entonces, en 1974, un equipo de entrevistadores, EDEN (Equipo de Documentación y Entrevistas Nacional) -:-

Jason saludó al oficial de guardia, quien lo dejó pasar sin problemas. Se dirigió al bloque de entrevista y se sentó en el sofá hasta que trajeran a su nuevo entrevistado.

Jason: ¿cómo estás, Ludd?
Ludd: ... en vez de hacerme estas entrevistas cada puta mañana, ¿por qué no me liberas?
Jason: lo siento, pero yo no me encargo de eso
Ludd: ¿vas a seguir grabando nuestras sesiones?
Jason: si quieres que quite la cámara, dímelo
Ludd: ... no, déjala así
Jason: bien, dime, ¿cómo vas?
Ludd: ¿qué mierda crees que haga en este lugar? No puedo hacer nada
Jason: ¿seguro? Algunos de ustedes ya comenzaron cursos, Barionix ahora inició un curso para hablar francés
Ludd: no me importa, nada de lo que digas... terminemos con esto, por favor
Jason: antes debo mostrarte estas fotos, ¿las reconoces?
Ludd: ... son de la inundación
Jason: eso creíamos, pero realmente fueron víctimas de asesinato
Ludd: ¿crees que tengo la culpa?
Jason: no te estoy culpando
Ludd: entonces, ¿por qué venir aquí?
Jason: eso hago, tú lo dijiste, todas las mañanas me presento, hablamos... discutimos, pensé que eso te gusta, tener compañía
Ludd: sí, pero no la tuya
Jason: claro, y dime, Ludd... ¿ellos eran tu familia? ¿Amigos? ¿Alguien cercano?
Ludd: ¡no los maté, no soy un asesino!
Jason: ¿ah, no? Y entonces dime... ¿por qué estás aquí adentro?
Ludd: ...
Jason: habla, ¿fueron amigos?
Ludd: no los maté
Jason: ¡sí los mataste!

Jason golpeó la mesa con fuerza

Jason: confiesa, ¿qué caso tiene decir mentiras? No podrás salir de aquí jamás
Ludd: ... ellos eran compañeros de trabajo
Jason: ¿y?
Ludd: ... ese día era mi cumpleaños, nadie me saludó, entonces quise hacerme un regalo, un pequeño recuerdo... los maté y... aproveché la inundación de la fábrica para... para decir que murieron de esa forma
Jason: ¿matar a tres personas por qué no recordaron tu cumpleaños?
Ludd: ... no sabes cómo me sentía ese día
Jason: y dime, ¿qué pasó luego?
Ludd: luego vine aquí
Jason: ¿y por qué llegaste aquí?
Ludd: por asfixiar a mi madre por error
Jason: no... no fue un error, fue un asesinato, aprovechaste su estado en el hospital y la asfixiaste
Ludd: ¡basta!
Jason: ¡yo soy quien dice basta!

Jason se puso de pie, volviendo a gritarle la frase, escupiendo en su cara

Jason: gracias por compartir esto conmigo
Ludd: ...
Jason: puedes quedarte con las fotos... considéralas como un... un pequeño recuerdo.

Jason se marchó con su maletín.

-:- La inundación de 1960 fue un golpe devastador para todos, pero también fue una gran oportunidad para quienes sufren de la locura más asfixiante -:-

## Capítulo 2: Touchplay

-:- La empresa más grande de juguetes estaba a punto de declararse en bancarrota. Había estado pasando por problemas económicos luego de la reciente salida de la Popy's, una muñeca que fracasó rotundamente. Un proyecto que habría superado millones de dólares gracias a su mecanismo complejo -:-

-:- La Popy's es el claro ejemplo de un juguete que, por más novedoso que fuera, dejó a sus creadores en la ruina -:-

Entró, allí estaba sentado. Lo habían visto segundos antes en la esquina del cuarto. Jason se presentó formalmente.

Jason: otra vez...
Carl: ... al parecer, harás lo mismo conmigo
Jason: ¿hacer qué?
Carl: lo mismo que con Ludd, entrevistarme varias veces. He visto todas tus entrevistas... eres famoso, ¿te gusta eso?
Jason: ¿por qué no querías hacer el comercial para la Popy's?
Carl: pensé que era muy obvio
Jason: ...
Carl: muchos dirán muchas cosas de mí, pero no soy una persona mala, soy... ingenioso, vendo las cosas de la mejor forma, mis comerciales son la prueba de eso
Jason: ¿a qué quieres llegar?
Carl: ... nadie, absolutamente nadie con mi mismo ingenio sería capaz de hacerle un anuncio a esa muñeca... el mecanismo que tenía era pésimo
Jason: costó millones
Carl: ¿y eso qué? El presupuesto no significa nada, yo logré mi primer comercial sin dinero, solo con pasión
Jason: ...
Carl: y esa muñeca no valía la pena, si yo hubiera participado, habrían hablado mal de mí, tal y como pasó con Touchplay
Jason: ...
Carl: ¿y a qué viene esta entrevista a mí?
Jason: bueno, Touchplay claramente nunca se hace cargo de sus errores, pero... investigando a fondo, quizás no fue un error, y que el mecanismo fue alterado
Carl: ... ¿y eso qué?
Jason: una empresa japonesa se encargaba de un lenguaje de códigos totalmente nuevo y exclusivo para esa muñeca, del código nacía su mecanismo
Carl: ... (mira hacia abajo)
Jason: un mínimo fallo en la programación significaba... bueno, lo que pasó
Carl: ... ¿y qué pasó?
Jason: millones de niñas sufrieron lesiones graves gracias a la Popy's, la muñeca devoraba su cabello, y a veces también sus dedos
Carl: (tose fuerte)
Jason: y si mal no recuerdo, en aquel año te quejabas de que tu pago era mediocre
Carl: ya sé para dónde vas, y te equivocas... yo no alteré nada del código, ¡no entiendo nada de programación!
Jason: esa es la peor excusa que puedas decirme. Dije que un mínimo error en el código alteraba todo... cualquiera puede cometer errores, siempre que estos sean intencionados
Carl: (se levanta furioso) ¡no! ¡Yo no hice eso! ¡No lastimé a nadie!
Jason: tú lo provocaste, ese error le costó incluso la vida de una niña
Carl: ... no, estás mintiendo, ¡no!

Carl se abalanzó hacia Jason y lo golpeó. La puerta se abrió y los guardias detuvieron la situación, llevando a Carl a su celda.

-:- Tal y como lo prometimos, estamos con Jason en casa de Mariana, madre de la niña de once años que murió cuando una de sus muñecas Popy's explotó -:-

Jason: algo totalmente espantoso, cosa de la que Touchplay jamás se hará cargo... dime, Mariana, ¿cómo te sientes al levantarte todos los días y... procesar lo que pasó, que tu hija ya no está contigo?
Mariana: es... es fuerte, aún no puedo creerlo, despierto y... quiero que sea un sueño, pero mientras más pienso en ella, no logro despertar, derramo lágrimas, llamo a mi hermana todo el tiempo, su voz... es igual que la de mi hija... (se quiebra en llanto)
Jason: sin duda es algo muy duro, algo que solo una persona debe pagar
Mariana: (toma el micrófono repentinamente) ¡escuchen bien! Si esa empresa no se hace cargo, ¡yo misma voy a incendiar las fábricas! ¡Yo misma lo haré!

## Capítulo 3: Mi Voz

Jason: tendrás que hacerlo tú, necesito un descanso
Jess: ¿descanso? Esa historia ya me la conozco
Jason: ¿qué? ¿No puedo tener un descanso?
Jess: la última vez que lo dijiste, viajaste hasta Ford, a ver a nuestra madre
Jason: ...
Jess: trabajaste todo un mes para pagar sus medicamentos
Jason: es mi forma de descansar, hacer algo por la gente que quiero
Jess: eso es bueno, Michale no pensaría lo mismo
Jason: ¿no quieres venir?
Jess: ... ¿otra vez la vas a visitar?
Jason: es nuestra madre, nos necesita
Jess: ... no, haré tu trabajo... ¿a quién debo entrevistar?
Jason: ... ¿seguro?
Jess: sí
Jason: ... se llama Buendiga
Jess: deja todos los archivos en mi escritorio, primero estudiar y luego entrevistar
Jason: bien, pero no te obsesiones mucho con eso
Jess: es la primera que entrevisto, ¿cómo alguien se obsesiona así?
Jason: no hablo de las entrevistas, hablo de tu libro, también deberías descansar
Jess: (suspira) quizás sí, pero falta poco
Jason: ...

-:- Buendiga Narsele, la mujer que pasó veintitrés años en el conjunto Barsovel, la cárcel más cruda de la historia de la humanidad, ahora volverá a aquel lugar para dejar a un lado su trauma, sus recuerdos de dolor y llantos de aquellos años -:-

Jess: así que... querías ser entrevistada
Buendiga: ... ¿sabes cuál es la diferencia entre un loco y un enfermero?
Jess: ...
Buendiga: que ambos creen en cosas, y tienen miedo de las mismas cosas, miedo de él
Jess: ¿de quién?
Buendiga: (rechina sus dientes)
Jess: ... (un escalofrío recorre su cuerpo) para, deja de hacer eso... ¡detente!
Buendiga: ... ¿te molesta? Es música para mis oídos
Jess: no para mí, por tu culpa tengo mareos ahora, ese ruido es lo peor
Buendiga: lo siento, yo me acostumbré a esa música
Jess: eso no es música
Buendiga: ...
Jess: volvamos a la pregunta inicial, antes de tu viaje a ese lugar, querías que te entrevistara en este hospital
Buendiga: esto no es un hospital, aquí hay muchos locos, en un hospital hay enfermos, aquí está lleno de...
Jess: ¿de qué?
Buendiga: ... dolor, aquí nadie te sanará
Jess: ¿puedes responder a la maldita pregunta?
Buendiga: sí
Jess: te escucho
Buendiga: ... aún tengo miedo, quiero que la gente escuche mi voz, porque allí voy a... voy a volver a nacer
Jess: (estaba confundido) ... ¿a qué te refieres con eso?
Buendiga: nacer es muy bonito, yo quiero nacer de nuevo... pero no quiero dejar este cuerpo con traumas, por eso volveré a ese lugar... ¿crees que mi gente me escuche? Cuando vuelva a nacer, también quiero escucharme
Jess: pues... no estoy grabando nuestra conversación
Buendiga: ¿puedes grabarla? Por favor, te lo suplico
Jess: ... quizás sí.

Ariana trajo consigo un fonógrafo.

Jess: gracias
Ariana: a tus órdenes, Jess (sonríe)
Jess: jaja
Ariana: ¿qué harás luego?
Jess: ... estaré libre
Ariana: podríamos ir a tomar algo
Jess: me encantaría
Ariana: bien (sonríe), sigan

Ariana se va, Jess seguía mirando de reojo.

Buendiga: deja de perder tiempo
Jess: ... bien, dime, ¿qué crees que pueda llegar a pasar una vez que estés en la cárcel?
Buendiga: ¡no! No esas preguntas, quiero preguntas lindas
Jess: lo siento, pero no puedo
Buendiga: ¡¡sí lo harás!!

Ariana escuchó el grito, quiso volver, pero decidió no entrometerse al ver a varios enfermeros que la veían fijamente, con una cara nada amigable.

Jess: ... ¿cómo fue tu infancia?
Buendiga: increíble, llena de fantasías... perseguía las mariposas, al atrapar una, la más hermosa, la encerraba en un frasco, frascos de esa mermelada que mi madre... mi madre...
Jess: ¿tu madre qué?
Buendiga: ... fue ella, ella me entregó
Jess: ...
Buendiga: yo no tenía la culpa, yo no quise hacer eso, no quise quemar a mi hermanita, no... ¡yo no!
Jess: ¿de qué hablas?
Buendiga: sus bracitos, pies pequeños... era, era...
Jess: ¿bebé? ¿Era una bebé?
Buendiga: yo no quise quemarla, yo... entendí mal, confundí las cosas, no fue mi intención poner a mi hermanita allí
Jess: ¿allí dónde?
Buendiga: ... en el horno... no quise, fue un error, todos cometemos errores, ¿verdad? ¡Sí! Un error, solamente fue un error, un error lo comete cualquiera... pero mi madre, ella no lo entendió, ella nunca comprende los errores, ¡jamás! Y me envió con ellos, a ese... a ese lugar
Jess: ... ¿tu madre? Dijiste que fue tu abuela
Buendiga: mi abuelo murió, jamás la conocí
Jess: ...
Buendiga: mi abuela sí hubiera entendido, ella sí, hubiera comprendido mi pequeño error
Jess: ¿mentiste en tu testimonio? ¿Dijiste que fue tu abuela y todo este tiempo estaba muerta?
Buendiga: ... dime una cosa, lo que hice... ¿fue un error?
Jess: ... pues... sí
Buendiga: (sonríe) ¿sí?
Jess: sí.

Buendiga se levanta y lo abraza con mucho cariño.

-:- Los hechos del caso de Buendiga Narsele fueron modificados luego de su encuentro con el entrevistador Jess del equipo EDEN. Al parecer, fue su madre quien la llevó a la cárcel cuando Buendiga, padeciendo trastornos mentales, puso a su hermana de cuatro meses en el horno -:-

-:- En otras noticias, Buendiga se suicidó luego de haber recorrido toda la cárcel de Barsovel, se encerró en una de las habitaciones de uno de los presos, aquel preso le dio su cuchillo y ella comenzó a cortarse las venas. Según lo que comenta Jess, ella lo hizo para volver a nacer -:-

## Capítulo 4: Un Exquisito Café

Ariana: ¿cuándo vuelve tu hermano?
Jess: apenas comience el nuevo mes
Ariana: ... ¿siempre visita a su madre?
Jess: casi siempre, solamente cuando ella lo necesita
Ariana: ¿y qué harás?
Jess: lo que siempre hice cuando él se iba... tomar su lugar, aunque por primera vez me siento extraño
Ariana: ¿y a cuántas personas conociste?
Jess: muy pocas, todas eran algo normales, o sea, eran raras, pero nada del otro mundo
Ariana: ¿Buendiga es la primera entrevista con la que tú te sientes así?
Jess: en realidad ya me sentía extraño desde antes, luego con Buendiga me siento peor
Ariana: pero, ¿por qué ahora? Has entrevistado a muchos y recién ahora te sientes así
Jess: ... escribo un libro, se llama "Entrevista Con El Mundo", relato las diferentes entrevistas que mi hermano ha hecho, observé sus informes, papeles, cartas y cada grabación... por eso ahora me siento... no sé, ya no puedo explicarlo
Ariana: ... ¿y si vienes conmigo?
Jess: ... ¿eh?
Ariana: si quieres, puedes renunciar a EDEN, nadie te obliga a quedarte
Jess: no, pero... sería una traición a mi hermano, además, ¿quién se encargaría de las entrevistas?
Ariana: ¿eso quiere decir que sí quieres venir conmigo?
Jess: ... (toma el café)
Ariana: (sonríe) (le toma la mano) vámonos, juntos
Jess: ... ¿y quién se encarga de reemplazarme?
Ariana: Michale, ¿él no puede?
Jess: claro que no, es un... una mierda
Ariana: ¿quieres irte conmigo, sí o no?
Jess: ... (suspira) bien.

Ariana termina su café. Jess decide dejarlo.

-:- En 1967, Jordán Meet, carnicero de la zona Vanguardia de la ciudad, cometió un atroz crimen. Secuestró a los asesinos de su hijo y los torturó durante días. Los hizo trabajar a escondidas en la carnicería, y cuando ya no les servían, comenzó a matar a cada uno y a vender su carne como cualquier carne de vaca común -:-

Michale entró a la cárcel, saludó al guardia.

Michale: ¡¿cómo vas, Estrellita?!
—¿Estrellita? ¿Un nuevo apodo?
Michale: te ascendieron, traes una estrella en tu uniforme... es perfecto para ti
—camina, Michale, camina
Michale: aún no me creo que en la policía acepten a gente enana como tú
—... (lo ignora)
Michale: ¡nos vemos, Estrellita! ¡Jaja!

Se acomoda su corbata y entra al cuarto. Como siempre, una sola luz, y en frente estaba sentado Jordán.

Michale: ... según estos papeles, muchos papeles, me dicen que mataste a los asesinos de tu hijo, fue un acto de venganza, pero ahora me pregunto... ¿por qué vender su carne?
Jordán: esa es una respuesta fácil... mataron a mi hijo como si nada, lo asesinaron porque ellos pensaban que él no valía nada. Esos chicos eran los que no valían nada, así que... por qué no vender su carne así, solo así, pueden valer algo en esta vida, aunque... haya sido en su muerte
Michale: claro, en realidad yo me refería a que, en vez de vender su carne, ¿por qué no dársela de comer a perros? ¡No! Aún mejor, a los putos cerdos
Jordán: cuando una persona muere, solo tiene que saber algo, morir con valor, eso me lo enseñó mi padre... eso le enseñé a mi hijo, y eso hice con esos asesinos... dárselo de comer a los animales sería desaprovechar lo que yo aprendí
Michale: tengo otra pregunta... ¿sabes quiénes compraron su carne?
Jordán: sí, gente del mismo barrio, conocidos, vecinos... todos ellos
Michale: ¿y sabes qué pasó luego?
Jordán: no, no los veo desde 1976
Michale: pues yo sí, los veo todo el tiempo... y los sigo viendo en este gran año 1978
Jordán: ... no entiendo
Michale: por eso traje esta televisión y un VHS... ¿lo miramos?
Jordán: ...

Michale dejó la televisión en la mesa, gritó: "Estrellita". El guardia llegó y lo ayudó, conectaron los cables y colocaron el VHS.

Michale: mira con atención, Jordán, escucha y mira.

Carla se colocó en medio de los demás, Máximo intentó hablar, pero lo interrumpió Esheil.

Esheil: ¡este mensaje es para ti, carnicero de mierda!
Máximo: ¡nos envenenan todos los putos días esos políticos corruptos y ahora vienes tú! ¡Estamos hartos de todos! ¡Y de ratas como tú!
Carla: por eso nos juntamos todos los vecinos, toda esta gente aquí se reunió por una cosa... darte de la misma mierda que tú vendiste
Esheil: ¡mierda eres tú! ¡Mierdas como ustedes caerán!

Carla tomó una bandeja y la acercó a la cámara.

## Capítulo 5: Hiroshima

-:- La bomba atómica lanzada sobre Hiroshima el 6 de agosto de 1945 dejó una estela de destrucción y muerte, y en los días siguientes la ciudad se convirtió en un infierno en la tierra, con miles de personas muriendo por radiación y heridas. Sin embargo, una pequeña comunidad sobrevivió de puro milagro, pero no de la forma en que ellos quisieran vivir -:-

-:- El centro de ayuda "Aetheria Relief" logró por años cuidar y atender todas las necesidades de esta pequeña comunidad. Pero fue en 1962 que comenzaron a tomar el centro de ayuda para sí mismos, como si fuese un hotel o mansión exclusiva para personas de su comunidad -:-

-:- Gracias al apoyo de donantes y gobiernos, lograron tener alimentos y una estabilidad más o menos estable, a pesar de haberse apropiado de una institución que valía millones -:-

      box.appendChild(el('big chnum',it.n));
      box.appendChild(el('big chname',it.s));
    }else if(it.t==='end'){
      box.appendChild(el('big title',it.s));
    }else if(it.t==='news'){
      var w=el('news',''); var nl=el('newslab',''); nl.appendChild(document.createElement('i')); nl.appendChild(document.createTextNode('NOTICIA'));
      w.appendChild(nl); w.appendChild(el('newstxt',it.s)); box.appendChild(w);
    }else if(it.t==='sys'){
      var sy=el('sys',''); if(/video/i.test(it.s) && !/finaliz/i.test(it.s)){ var rd=document.createElement('i'); rd.className='rec'; sy.appendChild(rd); }
      sy.appendChild(document.createTextNode(it.s)); box.appendChild(sy);
    }else if(it.t==='tag'){
      box.appendChild(el('tag',it.s));
    }else if(it.t==='dlg'){
      var d=el('p','');
      d.appendChild(el('who',it.n+': ','span'));
      d.appendChild(document.createTextNode(it.s));
      box.appendChild(d);
    }else box.appendChild(el('p',it.s));
  }

  // ---- control ----
  var i=-1, busy=true, stage_=0, finished=false;

  function show(fn){
    busy=true; stage.classList.remove('on');
    setTimeout(function(){ fn(); stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },FADE);
  }

  function prev(){
    if(busy||panelOpen||stage_!==2||i<=0) return;
    finished=false; i--; save(i);
    var it=items[i];
    show(function(){render(it)});
  }

  function next(e){
    if(e && e.type==='click' && e.clientX < window.innerWidth/2){ prev(); return; }
    if(busy||finished||panelOpen) return;
    if(stage_===1){ stage_=2; save(0); show(function(){i=0;render(items[0]);}); return; }
    if(stage_===2){
      if(i+1>=items.length) return;
      i++;
      var it=items[i];
      if(it.t==='end'){ finished=true; clear(); } else save(i);
      show(function(){render(it)});
    }
  }

  // ---- botones: capítulos y reinicio ----
  var panelOpen = false;
  var btnCh = document.getElementById('btnCh'),
      btnReset = document.getElementById('btnReset'),
      panel = document.getElementById('panel'),
      list = document.getElementById('list');

  function showUI(){ btnCh.classList.add('show'); btnReset.classList.add('show'); }
  function setPanel(o){ panelOpen = o; panel.classList.toggle('open', o); }

  items.forEach(function(it, idx){
    if(it.t !== 'ch') return;
    var b = document.createElement('button');
    b.className = 'chi';
    var t = document.createElement('b'); t.textContent = it.s;
    var s = document.createElement('span'); s.textContent = it.n;
    b.appendChild(s); b.appendChild(t);
    b.addEventListener('click', function(e){
      e.stopPropagation();
      setPanel(false);
      if(busy) return;
      i = idx; stage_ = 2; finished = false; save(idx);
      show(function(){ render(items[idx]); });
    });
    list.appendChild(b);
  });

  btnCh.addEventListener('click', function(e){ e.stopPropagation(); if(!busy) setPanel(true); });
  panel.addEventListener('click', function(e){ e.stopPropagation(); setPanel(false); });

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  });

  var armTimer = null;
  btnReset.addEventListener('click', function(e){
    e.stopPropagation();
    if(!btnReset.classList.contains('armed')){
      btnReset.classList.add('armed');
      armTimer = setTimeout(function(){ btnReset.classList.remove('armed'); }, 2500);
      return;
    }
    clearTimeout(armTimer); clear(); location.reload();
  });

  // ---- retomar o intro ----
  var saved = load();
  if(saved >= 0 && saved < items.length && items[saved].t !== 'end'){
    showUI();
    i = saved; stage_ = 2;
    render(items[i]);
    setTimeout(function(){ stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },200);
    document.addEventListener('click',next);
    document.addEventListener('keydown',function(e){
      if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();next();}
    });
    return;
  }

  // ---- intro ----
  setTimeout(function(){
    box.appendChild(el('intro',INTRO));
    stage.classList.add('on');
    setTimeout(function(){
      stage.classList.remove('on');
      setTimeout(function(){
        box.innerHTML=''; box.appendChild(el('big title',TITLE));
        stage.classList.add('on');
        setTimeout(function(){busy=false;stage_=1;showUI();},FADE);
      },FADE);
    },INTRO_MS);
  },200);

  document.addEventListener('click',next);
  document.addEventListener('keydown',function(e){
    if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();next();}
  });
})();
</script>
</body>
</html>
