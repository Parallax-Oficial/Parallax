<!-- ============ HISTORIA (Eternamente Vivo 2) ============ -->
<script type="text/plain" id="story">
Diciembre, 2034.

La música de apertura suena. Es reconocible, animada, de esas que te hacen aplaudir casi sin pensarlo. No dura mucho. El telón se abre y el estudio aparece en orden, como siempre, listo para arrancar otro programa.

Murray Franklin entra caminando tranquilo, sonríe, saluda con la mano y espera a que la música termine. Se acomoda el saco, mira a cámara y se presenta con su tono habitual, el de alguien que hace esto todos los días y lo disfruta. Hace un comentario corto sobre la noche, algo liviano, algo que no promete nada raro.

Se sienta detrás del escritorio. Apoya las manos, mira al público y juega un poco con ellos, con comentarios rápidos y gestos cómplices.

Murray: ¡bueno, bueno, bueno! ¿Qué programa el de hoy, eh?
Reiralda: hey, Murray, ¿dónde está mi cojín? Le he dicho varias veces a esta producción que lo pongan cada vez que deba sentarme
Murray: perdóname, por favor, ¡un cojín!
Reiralda: gracias, querido, esto me sirve, ¿no tienes el de colores?
Reiralda: no importa, gracias
Murray: ¿ahora sí, abuela?
Reiralda: sí, sigue, sigue
Murray: muy bien... hoy tenemos un programón, los invitados de hoy, mejor dicho, el invitado de hoy, un escritor, cantante, con su propia editorial, actor, ahora comediante y... ya no sé qué más va a ser, pero necesitamos más gente como él, ¿no?

El público gritó afirmando, contentos y emocionados.

Murray: el invitado estrella de hoy, y para su sorpresa, no van a tener que esperar a conocer a los demás

Nuevamente, el público estalló aclamando: "¡síii!". Parecían infantes.

Murray: tenemos muchas, muchas cosas de qué hablar, y puede que nos encontremos con el programa más extenso de la televisión... ¿futurista? La cuestión es que la gente está expectante, y si pueden durar más de horas, pues... tendremos que dejar a los demás invitados para otro momento. En fin, creo que llegó la hora de presentar a un escritor valiente, que atravesó mucho en su vida... su pseudónimo, Mlive, era la forma que quería llamararle, pero... él no aceptó.

Murray se levanta del escritorio con energía, da un par de pasos hacia el centro del escenario y alza la voz: "¡Démosle la bienvenida a Martino Lipschitz!".

El telón del costado se abre. Martino sale caminando sin apuro. Mira al público apenas, levanta una mano, llega hasta Murray y le da un apretón de manos firme y corto. Se sienta en uno de los sofás destinados a los invitados. Reiralda, la abuela de Murray, está sentada a un costado, como siempre. Martino pasa y se sienta, ignorándola por completo.

Murray: ¿cómo estás, Martino?
Martino: me lo imaginaba más grande
Murray: ¿te gustan las cosas grandes?
Martino: seguimos hablando del set, ¿verdad?
Murray: (sonrió, con una carcajada que aguantó, al igual que lo hacía con todos los invitados)

El público no logró aguantarse las risas. Rieron como niños jugando al ajedrez, usando al caballo para luchar con el rey.

Murray: bueno, antes de nada, ¿hay algún rencor con mi abuela?
Martino: ... ¿qué? ¿Por qué eso?
Murray: no la saludaste, ¿odias a las abuelas o algo así?
Martino: ...

Martino gira un poco el cuerpo, apoya un brazo en el respaldo del sofá y recién ahí vuelve a mirar a Reiralda. Sonríe apenas, dice su nombre en voz baja y vuelve a acomodarse en su lugar. Reiralda extendió su brazo; Martino, mirando como si lo estuviese pensando, terminó por saludarla formalmente.

Murray: bien, supongo que no te diste cuenta, ¿no?
Martino: ... sí, estaba bastante perdido, y... es mi primera vez en un programa como este, por cierto, ¿por qué esas líneas?
Murray: se llama decoración, es el estilo del set
Martino: sí, lo sé, pero... ¿no crees que, bueno, todo se ve muy... ochentero?
Murray: sí, jajaja, es parte de la personalidad del programa, un programa que recuerda cómo eran esos años, años inolvidables... años que no es fácil olvidar
Martino: claro, creo que no muchos pensarán igual
Murray: sí, gente mediocre, gente que vive el hoy, los que no miran el pasado, y cuando lo miran, se pierden, incluso si es imposible perderse
Martino: ...
Murray: ...perdón, yo... ya sabes, me comprometo mucho con esto, no quería incomodar
Martino: no pasa nada
Murray: ...

## Capítulo 1: Respira Profundo

Toshiba corre por la calle sin mirar a otra parte que no sea al frente. Corre como si llegara tarde a algo importante. La gente lo mira pasar, algunos se corren, otros se quedan quietos. Tropieza con el borde de la vereda, cae de frente, se queda un segundo en el piso y se levanta sin pensarlo.

Sigue corriendo. Cruza un semáforo en verde sin frenar; esto ocasiona que un auto clave los frenos, otro se desvíe y termine chocando contra una tienda. El ruido queda atrás y Toshiba se detiene unos segundos, respira hondo y mira la escena sin acercarse.

Toshiba: ¡Hijo de puta! ¡Ahora vienes y me lo pagas, loco de mierda!
Toshiba: ... (respira sin calma)

Vuelve a correr, mejor dicho, vuelve al caos. Empuja sin querer a dos chicas que estaban paradas hablando. No pide disculpas pues ya está lejos. Llega al estudio de televisión y entra por la parte trasera, cruza pasillos conocidos y se mete directo en su camerino.

Cierra la puerta, se saca la ropa rápido, junta todo en el suelo y abre una bolsa. Saca un traje elegante, se lo pone sin perder tiempo. Ajusta la camisa, el saco, los zapatos y respira otra vez. Sale del camerino, pero vuelve a entrar. Se para frente al espejo, acomoda el cabello con las manos, inclina un poco la cabeza, se observa un segundo más. Asiente para sí mismo y sale de nuevo.

Camina hasta el lugar del telón. Se toca la cara, saca un pañuelo y se seca el sudor del cuello y la frente. Guarda el pañuelo en el bolsillo interno del saco. Da un paso al frente. Pero le apoyan una mano en el pecho y lo detienen.

Toshiba: ¿qué haces? Es mi turno
—Estás equivocado, amigo, hay otro invitado
Toshiba: ... ¿qué dices? Este es mi horario, bueno, llegué tarde, lo sé, pero Murray sabe cómo manejar eso
—No me hagas repetirlo
Toshiba: ... ¿quién está ahora?
—... ¿conoces a Martino Lipschitz?
Toshiba: no...
—Búscalo en internet, te sorprenderás
Toshiba: ...

Toshiba vuelve a su camerino sin decir nada. Cierra la puerta de un golpe suave. Se queda frente al espejo y aprieta la mandíbula. Mira su propio reflejo y lo suelta casi sin pensarlo: "¿quién putas es Martino?".

Se deja caer en la silla. Saca el celular y empieza a buscar. El nombre aparece en todos lados. Comienza a leer rápido: treinta y cuatro millones de seguidores. Actor, comediante, escritor, creador de ideas, cantante. Todo junto, uno atrás del otro, como si no tuviera freno. Al seguir bajando, encuentra una entrevista. La primera de todas, bueno, es la única y todas a la vez. Le da play. No la escucha entera, pero ve fragmentos, titulares, recortes. Ahí habla de su vida, de su infancia, de cosas que no parecen pensadas para decirse en voz alta. La nota marca billones de visitas. Desde ese momento, el apoyo creció. Después vinieron los premios. Reconocimientos como escritor. Fotos con trajes caros. Un Óscar a mejor actor por Tragedia De Amor. Toshiba apoya el celular sobre la mesa. Mira el piso unos segundos. No mueve las piernas ni las manos. Vuelve a agarrar el teléfono. Lee una nota corta, perdida entre otras:

&laquo;mi padre era problemático, a veces dudaba si realmente me quería&raquo;.

Se queda ahí. Apaga el celular, levanta la vista y se mira otra vez en el espejo. La expresión ya no es la misma. Respira lento y empieza a recordar.

2019.

Toshiba corre otra vez, pero ahora es un chico de nueve años. Entra apurado a la escuela, cruza el pasillo y llega a su salón. Toca la puerta con los nudillos. La profesora abre la puerta apresurada.

—¡Miren quién llegó! Llega cuando puedas
Toshiba: perdón, yo... bueno, casi me duermo
—Te dormiste, por the eso llegaste tarde
Toshiba: ...
—Ya, pasa.

Entra y mira a todos ya sentados. La profesora señala un lugar adelante, no es el de siempre. Por llegar tarde, le toca sentarse al frente de todos, al lado de un compañero que no conoce. No está solo, y eso ya lo incomoda. Se sienta. Mira de reojo al chico de al lado. No se dicen nada al principio. Después, sin mirarlo, Isadox habla en voz baja.

Isadox: ¿cómo estás?
Toshiba: bien, ¿qué cuentas?
Isadox: nada interesante, bueno, ¿sabías que el Big Bang no ocurrió en un solo lugar del espacio? Más bien... ocurrió en todas partes al mismo tiempo
Toshiba: ¿te gusta el espacio?
Isadox: no, lo dijo la profesora recién
Toshiba: ... claro
Isadox: ... ¿cómo te llamas?
Toshiba: ¿acaso no nos presentamos todos a principio de año? ¿No recuerdas?
Isadox: ¿eh?
Toshiba: ya sabes lo de... ¡hey, tú!
Isadox: ... ¡¿qué?!
Toshiba: (suspira) nada, me llamo Toshiba
Isadox: yo soy Isadox
Toshiba: ... ¿Isadox?
Isadox: ¡hey! No vengas a decir que mi nombre es raro, el tuyo también
Toshiba: ... no! Es que... no recuerdo a nadie que se llame... ¿Isadox?

Diciembre, 2034.

Volvemos. Toshiba estaba parado en su camerino. Frunce el ceño. Algo no encaja. Recuerda ese momento, pero hay un detalle que le molesta. Ese compañero no se llamaba Isadox. Está seguro de eso.

Mira el celular un segundo, como si buscara confirmarlo, y ahí lo entiende. Sus recuerdos se mezclaron. Lo que acaba de ver, lo que leyó en esa entrevista, se metió donde no debía. El amigo de Martino se llamaba Isadox, no el suyo. Guarda el teléfono. No le da más vueltas. Suspira corto y deja pasar el error. Vuelve a cerrar los ojos. Regresa al recuerdo.

2019.

Isadox: ¿y? ¿Pasa algo?
Toshiba: ... no, no, no... vuelvo a la pregunta de antes, ¿qué cuentas?
Isadox: pues, ahora creo que sí puedo responderte, pronto tendremos el viaje
Toshiba: sí, lo sé, aunque esa respuesta no tiene nada que ver con la pregunta
Isadox: ... ¡da igual! ¿Algo que te guste?
Toshiba: no sé, me gusta dibujar, aunque, ¡no! Ni siquiera eso
Isadox: ¿y entonces?
Toshiba: no sé, es que... creo que no me gusta nada
Isadox: entonces dime algo que hagas con frecuencia
Toshiba: ... a veces hago muñecos
Isadox: ¿muñecos? ¿Haces muñecos?
Toshiba: no, bueno, o sea... no son como crees, son dibujos de algún personaje, lo recorto y lo pego a un cartón, y ahí tengo una figura de acción, digamos
Isadox: ... eso es muy, diría, ingenioso para hacerte sentir bien, pero es bastante estúpido
Toshiba: sí, eso mismo piensa él
Isadox: ¿quién?
Toshiba: ... no importa, la cuestión es que (suspira) lo hago y ya, me gusta, me entretiene, ¿quísmo más debo pedir?
Isadox: bueno, cada quien tiene sus gustos
Toshiba: sí...
Isadox: hablando de gustos, ¿quién te gusta?
Toshiba: una pregunta muy apresurada, ¿no crees? Recién nos conocemos
Isadox: entonces imagínate que nos conocemos desde que éramos bebés
Toshiba: no me gusta nadie
Isadox: sí, claro
Toshiba: es verdad, no siento que ellas, u otras, sean...
Isadox: ¿tu tipo?
Toshiba: ...
Isadox: pues... a veces solo hay que hacer que las cosas marchen, por ejemplo, hablar, y ya, las cosas se moverán solas
Toshiba: ...
Isadox: habla con ella
Toshiba: ¿eh?
Isadox: no te hagas el tonto, ve y háblale
Toshiba: ¿por qué lo haría?
Isadox: porque lo pido yo, háblale
Toshiba: no lo voy a hacer, aparte, todavía estamos en clases.

En ese precioso momento, el famoso timbre sonó.

Isadox: ya no estamos en clase
Toshiba: ...

Toshiba se levanta de su asiento. Camina despacio entre las filas y se acerca a una de sus compañeras. Zoé está sentada sola, mirando su cuaderno. Toshiba se queda a su lado unos segundos, sin decir nada.

Zoé: ¿sí?
Toshiba: ... ¿hola?
Zoé: ... ¿hola?
Toshiba: yo... bueno, ¿todo bien?
Zoé: sí, ya me iba
Toshiba: ¡ah! Bueno, nos vemos entonces.

Isadox levanta la vista. Se acerca a ellos, colocando su brazo por encima del hombro de Toshiba.

Isadox: ¡hey! Zoé, ¿cómo vas?
Zoé: todo bien, Isa, ¿qué tal el examen?
Toshiba: ¿examen? ¿Examen de qué?
Isadox: no te asustes, ambos vamos a catequesis, el examen era de eso
Toshiba: ...
Isadox: sí, bastante bien, es un examen de catequesis, es súper fácil
Zoé: sí, es verdad, yo las hice todas y apruebo fácilmente
Isadox: la primera prueba que vas a aprobar en tu vida, ¿no?
Zoé: sí, básicamente sí.

Toshiba sonrió, como si el hecho de que no fuera perfecta le llamara más la atención. Esta vez preguntó sin miedo.

Toshiba: ¿te da igual aprobar o no?
Zoé: si viviera sola, sí, pero, como todos... tengo padres y son, ya sabes, padres
Toshiba: sí, padres
Isadox: oigan, hay un recreo que no hay que perderse, ¿vamos los tres?

En ese momento, Martina, la amiga de Zoé, se acerca desde el fondo del aula. Se para al lado del banco, mira a Toshiba y después a Zoé.

Martina: ¡hola, Zoé!
Zoé: ¡amiga!
Martina: ¡Isa!
Isadox: ¿todo bien, Mar?
Martina: estoy súper bien, ¡hoy me van a dar mi primer celular!
Toshiba: hola
Martina: ... ¿hola? Como decía, ¡mi primer celular!
Toshiba: si yo fuera tú, contestaría mejor a un saludo
Martina: ...
Zoé: ...
Isadox: Toshiba, ¿te sientes bien?
Toshiba: sí, perdón, yo...
Martina: ¡sí! Tienes razón, igualmente, ¿cómo estás? Amigo de Isadox, ¿verdad?
Toshiba: sí, y estoy bien, gracias
Martina: bueno, me van a comprar mi primer celular
Zoé: tienes mucha suerte, lo que daría por un celular
Isadox: sigue soñando, porque ningún chico de nuestra edad tendría celular
Toshiba: ...
Isadox: ¿y qué tal si salimos al recreo de una vez los cuatro?
Martina: ¿perdón? Ella es mi amiga, mi mejor amiga, no sale con cualquier... tipo grande que se encuentre
Isadox: sí, sí... este tipo grande se va, porque al menos todos me respetan y no me hacen burla diciéndome que soy Pitufina
Toshiba: ¡sí! Pero cuando llueve sos el primero que se moja
Isadox: ... (miró a Toshiba con cara algo mal parada) eso fue bastante estúpido, ni da risa.

Eso pensaba Isadox. Pero tanto Martina como Zoé se dedicaron a reírse a carcajadas, soltando esa risa natural, esa risa que parecía un cerdo en un matadero. Esa risa que a Toshiba le gustaba escuchar.

Martina: ¡ya me cae bien!
Zoé: bueno, creo que a ninguno de los cuatro nos gustaría perder el recreo, así que...
Isadox: bueno, tú con ella, yo con él.

Diciembre, 2034.

Alguien toca la puerta del camerino. Toshiba se sobresalta un poco, camina hasta la puerta y la abre apenas.

Toshiba: ¿es mi turno?
—Lamento decirle que no, Murray dijo que no habrá tiempo para los demás invitados, con todo respeto debo decirle que será mejor que se vaya
Toshiba: ... claro, gracias

El chico se va por el pasillo. Toshiba cierra la puerta y queda quieto un segundo. Después se sienta de golpe en la silla, grita sin medir el volumen y le pega a la silla con el puño. Se levanta de nuevo y la patea, empujándola contra la pared. Aún con la respiración agitada, abre la puerta y sale del estudio sin avisar. Camina por la calle con las manos en los bolsillos, la espalda algo encorvada, la mirada baja. No parece apurado, pero tampoco relajado. Sigue caminando.

Se sienta en una parada de autobuses. Apoya los codos en las piernas. Un anciano, parado a unos metros, lo mira de reojo varias veces.

—Perdone, usted vino del estudio de Murray, ¿verdad?
Toshiba: sí, ¿pasa algo?
—¿Es cierto que está Martino?
Toshiba: ... sí, y por cierto, ¿no le suena conocido un tal... Toshiba Feez?
—... no, nada
Toshiba: claro...
—¿Y? ¿Qué escuchó? Yo no puedo enterarme de nada, no tengo televisión, hoy en día con todo lo nuevo ya es imposible, no alcanza, nada
Toshiba: pues, no, siendo sincero, no escuché nada de nada
—... mi Guillermina tenía ganas de escucharlo, le recuerda a nuestro nieto (sonríe mirando a otro niño)
Toshiba: ...
—Siempre me decía... &laquo;a veces lo entiendo y otras no&raquo;, la gente de hoy está perdida, estaba enojada por haber escuchado toda esa entrevista que tuvo, me hacía reír, se enfurecía mucho con él, pero al final volvía a llorar cuando escuchaba su historia
Toshiba: (sonríe apenas)
—... y... esta pregunta es por ella, ¿no sabes nada de lo que pasó con Garilda? Era una amiga de Martino, nunca nadie supo más de ella, Martino nunca más la nombró de nuevo
Toshiba: ... ¿Garilda? ¿Apellido?
—A ver si me acuerdo... no, nada, tú no puedes buscarlo ahí por... ¿eso? El... ¡puta! No me acuerdo, ¿el internet!?
Toshiba: sí...

Toshiba saca el celular. Escribe rápido: &laquo;Martino Lipschitz y Garilda&raquo;. Aparecen notas, fotos y recortes viejos. Lee una en particular, la misma, se detiene ahí:

&laquo;fue amor y odio, mi forma de verla siempre cambiaba, a veces la quería y en otras no podía esperar para irme del colegio y no volver a verla&raquo;.

Toshiba busca más al respecto y descubre el apellido: Garilda Calcagnoli. Baja el teléfono lentamente. Se queda mirando la pantalla apagada.

—¿Y? ¿Lo averiguaste?
Toshiba: ... tengo que irme.

## Capítulo 2: Un Paso Aquí, Cha, Cha, Cha

La música arranca fuerte: una batería rápida y una guitarra eléctrica sin pausa. Brec y Brian, dos hermanos gemelos, tocan como si no hubiera nada más alrededor. No hablan, solo siguen el ritmo. Se escuchan pasos en la escalera. Toshiba aparece apurado. Mira alrededor, junta algunas cosas que estaban tiradas, las guarda sin orden.

Brec: hey, Tosh, ¿qué pasa?
Toshiba: no tengo tiempo, les digo luego
Brian: ¿otra vez corriendo? ¿No te cansas?
Brec: Brian
Brian: ¿qué?
Brec: mejor cállate
Brian: ...
Toshiba: les hablo luego, ¿bien?
Brec: ...
Toshiba: nos vemos al rato
Brec: ¡hey!
Toshiba: (se voltea)
Brec: vamos a grabar la última canción del álbum, lo sabes, ¿not?
Toshiba: ... sí
Brec: bueno, no llegues tarde, no queremos hacer otra canción sin ti
Toshiba: ... bien, no te preocupes, llegaré temprano, ¡te lo aseguro!

Toshiba abre la puerta y se va, cerrando la puerta con fuerza. La música sigue unos segundos más y después baja.

Brian: ¿le crees? Pospusimos las fechas de salida del álbum por su culpa, no le importa
Brec: tenemos cinco canciones con él
Brian: ¿y todas las demás?!

Suena música. Canciones que todos conocen. Risas, voces mezcladas, gente bailando sin preocuparse demasiado por nada. Es una fiesta de cumpleaños. Nada elegante, nada formal. Solo gente junta pasando la noche. Garilda está sentada con sus amigas. Hablan, miran alrededor, comentan cosas sueltas. Garilda escucha más de lo que habla. En un momento gira la cabeza y ve una mano extendida frente a ella. Es la de Isadox.

La canción baja un poco la intensidad. Garilda se acerca más. Se mueve con menos apuro. Isadox acompaña. No dicen nada. Cuando la música termina, Garilda suelta las manos, sonríe, se acomoda el pelo y se aleja caminando, todavía con esa sonrisa puesta, vuelve a su asiento. Isadox vuelve a acercarse.

Garilda: ... sí, bueno, no, o sea, es complicado
Isadox: ...

Isadox se acerca a ella. Casi rozando sus labios con los de Garilda. Por esto, Garilda se suelta y se va sin mirar atrás. Entra al baño. Cierra la puerta. Saca el celular y abre la cámara frontal para mirarse. Se mueve un poco, inclina la cabeza y cambia la expresión. Da un paso más y se percata del espejo que estaba justo enfrente. Se da un pequeño golpe en la cabeza y se ríe sola, llamándose: &laquo;Tonta&raquo;.

Diciembre, 2034.

La visión era casi borrosa. Tenía mareos y náuseas, se sentía como si estuviera en un barco. Félix seguía acelerando, no veía claro desde la tercera cuadra. La cerveza ya hizo lo suyo. El auto avanza irregular, no demasiado rápido, pero sin control fino. Félix aprieta el volante más de lo necesario. Mira al frente, pero no enfoca del todo. Un segundo de distracción. Una curva mal tomada. El ruido llega antes que el golpe. El auto se va de eje, roza algo, gira. Todo pasa rápido. Un impacto seco. El cuerpo se le va hacia adelante. El cinturón lo frena. El mundo se sacude y se apaga. Todo se vuelve oscuro.

Félix está en su casa. Tiene una pala en las manos. Su padre está de espaldas. Félix levanta la pala, tiembla. Se queda así un momento. Respira fuerte. La baja. La deja caer al piso.

Febrero, 2022.

Félix en la cocina. Su padre sirve vino. Félix pone alfileres dentro de la copa, uno por uno, con cuidado. Mira la copa. Se queda quieto. Después, su padre vuelve. Félix lo ve tomándose todo el vino.

Estaba en el pasillo de la escuela. Un compañero se le acerca, le dice algo al oído: &laquo;eres un puto gay&raquo;. Félix no responde; sin embargo, el otro insiste. Félix lo empuja, logrando que su cabeza impacte contra el suelo, luego sigue caminando.

Félix abre los ojos. La vista le cuesta. Ve luces, sombras, gente alrededor. Escucha voces, pasos, alguien diciendo su nombre. Intenta moverse, no puede. Respira hondo. Una figura se acerca. Se inclina sobre él.

—¿Estás bien? Logramos llamar a una ambulancia, resiste
Félix: ... Ga... (lo dice largando sangre por la boca)
—¿Ga? ¿Qué es Ga?

## Capítulo 3: ¡Puta Madre, Abuela!

Septiembre, 2033.

Los gritos del público se repiten sin parar. &laquo;Murray, Murray, Murray&raquo;. Desde atrás del telón, Murray escucha todo mientras fuma. No apura nada. Mira al frente, como si ya supiera exactamente cuándo salir. Reiralda se le acerca despacio, apoyándose apenas en su bastón.

Reiralda: deberías cuidarte, el cigarro daña mucho, ¿no aprendiste nada de los ochenta? Gente moría, la gente sufría, hubo pérdidas de familiares
Murray: ...
Reiralda: tú más que nadie debería entenderlo
Murray: ...
Reiralda: ... ¿qué harás cuando yo muera? No tienes madre, no tienes padre, solo una abuela te amaría
Murray: ...

Murray no responde. Ni la mira. Da una última pitada y deja el cigarrillo en el cenicero. El sonido del público sigue igual, constante, casi automático. El telón se abre. Murray sale primero, sonríe, levanta la mano. Reiralda lo sigue, un poco más atrás. Ambos se presentan al público, cada uno a su manera. Reiralda no espera indicaciones: va directo al sofá del set y se sienta con cuidado, acomodándose como si estuviera en su casa.

Murray: el programa de hoy nos tiene reservadas varias sorpresas, sin embargo, y haré hincapié en esto, es que... ¡el clima! Sí, sí, sí... parecen estúpidos los gritos, pero... estos últimos tiempos hubo muchas tormentas, la verdad, las inundaciones son... ya saben, complicadas
Reiralda: ¡no te olvides de hablar de las experiencias de las familias!
Murray: ... (suspira)

Murray camina hasta su escritorio y se sienta. Ordena unos papeles que no va a usar. Mira a cámara y, casi sin cambiar el tono, dice esa frase suelta, como si fuera un comentario más del programa:

&laquo;Esperemos que estén contentos en casa, y por sobre todo, contentos con su familia, porque hay gente que no tiene mucha suerte con eso&raquo;.

Reiralda lo escucha con atención. No aplaude. No sonríe. Solo lo mira.

Reiralda: ¿qué acabas de decir?
Murray: ... ¿qué? ¿Qué sucede?
Reiralda: ¿cómo vas a decir eso?
Murray: ... mira, abuela, sabes... no siento que...
Reiralda: ¡no! Claro que no sientes, jamás has sentido nada
Murray: saben... iremos a un corte publicitario y... ¡ya volvemos con... &laquo;Un Show De Todos Para Todos&raquo;!

El público aplaude igual. Las luces bajan apenas y entra el corte publicitario. Murray se levanta del escritorio y se va hacia el pasillo que lleva a su camerino. Reiralda se levanta también y lo sigue, sin apurarse pero sin dudar. Antes de que él llegue a la puerta, ella se le pone enfrente y lo obliga a frenar.

Reiralda: ¿qué te pasa, Franklin? ¡¿Eh?!
Murray: no tengo tiempo para esto, abuela
Reiralda: ¡Murray Alexander Franklin! Puedes hablar conmigo, puedes, ¿por qué no me tienes confianza?
Murray: ... abuela, eres un estorbo en mi vida, siempre lo has sido
Reiralda: ¿sí? ¿Y toda esa gente que te apoya, seguro que no?, ¿verdad?
Murray: toda esa gente está ahí porque...
Reiralda: ... ¡porque eres famoso! Nada más, no buscan otra cosa de ti, yo cambié tus pañales, yo te leí esos cuentos de mierda, yo estuve ahí cuando llorabas en el baño, siempre estuve, ¿pero ellos qué? Solo están cuando tuviste mil seguidores en una de esas redes que no sirven para nada
Murray: ... basta, abuela, por favor, basta (siguió adelante)
Reiralda: ... (se volteó) ¡encontré el maniquí!
Murray: ... (se detuvo) ¿qué?
Reiralda: estaba en el sótano, tapado con cinta, ese maniquí era de mi negocio, ¿verdad?
Murray: no sé de qué hablas, yo no toqué ningún maniquí
Reiralda: no te sirve mentir, somos dos en casa
Murray: ...
Reiralda: ¿por qué estaba pintado? ¿Qué le hiciste? ¿Y por qué?
Murray: ...

Diciembre, 2034.

Murray está en su habitación. Está sentado frente al espejo, con la espalda recta y las manos apoyadas en las piernas. Mira su reflejo sin apuro. Después baja la vista y revisa el celular. Busca un contacto y llama.

Martino: ¿hola? ¿Quién habla?
Murray: ¿Martino? ¿Martino Lipschitz?
Martino: ... ¿sí?
Murray: ...
Martino: ¿hola?
Murray: ... ¡ah! Sí, cierto, no, solo... mi nombre es Murray, Murray Franklin
Martino: ¿Murray Franklin?... ¿el del programa?
Murray: ese mismo, mira, te llamaba solo para, realmente de esto se encarga mi secretaria, pero... quería llamarte personalmente para preguntarte si, no sé, ¿quisieras pasarte por mi programa?
Martino: ... pues... voy a pensarlo
Murray: claro... y cuando lo pienses y te decidas, ¿podrías venir con tu atuendo?
Martino: mi... ¿atuendo?
Murray: el que usas, con el maquillaje y todo eso, los labios negros, el delineado. ¡Y otra cosa! ¿Quieres que te llame por tu verdadero nombre? ¿Cómo Mlive?
Martino: ... ese no es mi &laquo;verdadero nombre&raquo;
Murray: pues creo que te queda mejor
Martino: ... voy a pensarlo, y... también lo del atuendo
Murray: okey, piénsalo, nos vemos.

La llamada se corta. Murray baja el teléfono y gira la cabeza. Mira el maniquí que está apoyado contra la pared. Está pintado de una forma rara. La cara es pálida, los labios oscuros. Los ojos están delineados con un negro demasiado marcado. Lleva un traje puesto y el cabello está desordenado, como si alguien lo hubiera acomodado sin ganas. Los dientes son blancos, demasiado prolijos. Las uñas están pintadas de negro. El cuerpo es masculino, pero todo lo demás lo hace parecer otra cosa. Murray se levanta despacio. Empieza a bailar. Los movimientos son lentos, torcidos, incómodos. Da pasos cortos, mueve los brazos sin ritmo claro. Se acerca al maniquí y lo toma con cuidado. Bailan juntos. Murray gira, arrastra los pies, se inclina hacia adelante y vuelve atrás.

En una de las vueltas, lo suelta con fuerza. El maniquí cae al piso. Murray vuelve y empieza a pisotearlo. No grita. Solo pisa, una y otra vez, hasta cansarse. Sale de la habitación y entra al cuarto de su abuela. Abre cajones, toma maquillaje. Se pinta frente al espejo. Se marca los ojos, oscurece los labios, empalidece la cara. Se pinta las uñas. Se deja el cabello desordenado. Se queda mirándose un momento más.

Tres Días Después.

El telón se abre. El estudio aparece iluminado. Murray sale caminando, sonríe y saluda al público. Los aplausos lo reciben fuerte. Hace una charla breve, se acomoda y se sienta en su escritorio. Levanta la mirada y presenta al invitado. Martino Lipschitz entra, saluda y se sienta.

Murray: ¿cómo estás, Martino?

Murray: (sonrió, con una carcajada que aguantó, al igual que lo hacía con todos los invitados)

Murray: una pregunta no muy frecuente, sabes
Martino: solo quiero saber
Murray: mira, no sé si soy un admirador, pero todo lo que haces, tu trabajo, hay algo que me llama la atención... y... no sé, me hace conectar contigo de alguna forma
Martino: claro... ¿te sientes cercano a mí?
Murray: ¡eso! ¡Eso mismo! Sabes, por un momento podría jurar que... somos la misma persona, pero con ese algo que nos diferencia
Martino: ¿okey?
Murray: no quiero incomodar, pero... mis preguntas van a ser directas, por ende, quiero preguntarte ahora mismo... ¿qué fue lo que pasó luego de abandonar esa ciudad? De irte a Tostado, como tú lo llamas... &laquo;nuevo aire&raquo;
Martino: ... pasaron bastantes cosas... aunque... solo existe una para destacar
Murray: ¿podrías contarla?
Martino: claro que sí.

Mientras tanto, detrás del telón, se encontraba Toshiba. Está preparado para entrar, pero lo detienen.

Toshiba: ¿qué haces? Es mi turno
—Estás equivocado, amigo, hay otro invitado
Toshiba: ... ¿qué dices? Este es mi horario, bueno, llegué tarde, lo sé, pero Murray sabe cómo manejar eso
—No me hagas repetirlo
Toshiba: ... ¿quién está ahora?
—... ¿conoces a Martino Lipschitz?

Toshiba camina lento, y se asoma cuidadosamente por el telón. Observándolo fijamente.

## Capítulo 4: Las Cosas Por Limpiar

## Capítulo 7: Continuemos, Aunque Nos Duela

Salió de la habitación y caminó por el pasillo del hospital cojeando, con pasos irregulares y lentos. No miró a nadie. Al cruzar la puerta de salida, el aire frío lo hizo frenar un segundo, pero siguió. Llegó hasta su auto, se sentó, cerró la puerta y encendió el motor. Condujo sin apuro, con la vista al frente y la mente en silencio.

Estaban transmitiendo el programa de Murray Franklin. Martino hablaba frente a cámara. Félix lo observó con la mandíbula apretada y una expresión de rechazo clara. No apartó la vista. En ese momento, los recuerdos empezaron a aparecer.

Toshiba estaba sentado frente a la computadora portátil, con varias pestañas abiertas. Miraba una y otra vez posibles ideas de negocio: servicios digitales, inversión rápida, propuestas que prometían resultados inmediatos. Ninguna le cerraba. Algunas le parecían poco realistas, otras directamente inútiles. Cerró varias ventanas sin leer demasiado y apoyó la espalda en el sofá.

Se levantó y fue hasta la cocina. Abrió la heladera y buscó un energizante. Lo destapó, tomó un trago largo y volvió al living. Se sentó otra vez, acomodó la computadora sobre sus piernas y siguió buscando, ya sin mucho entusiasmo. Entre los resultados apareció una noticia destacada: 20 años del desastre de Scroge.

El título le llamó la atención. Hizo clic. La nota hablaba de Scroge, un empresario que había sido referente en el sector tecnológico a comienzos de la década anterior. Scroge era el CEO de TotalCopy, una empresa dedicada a la gestión y protección de datos digitales, especializada en sistemas de respaldo masivo para corporaciones y gobiernos. Durante años, TotalCopy fue considerada una de las compañías más seguras y rentables del mercado.

Todo cambió con una decisión tomada por el propio Scroge. Según la versión oficial, autorizó una actualización del sistema central sin pruebas suficientes. La falla provocó la pérdida irreversible de millones de archivos críticos pertenecientes a clientes internacionales. Demandas, juicios y una caída inmediata del valor de la empresa terminaron por destruirla. Sin embargo, la nota incluía testimonios de personas cercanas a Scroge. Exsocios, empleados y un familiar coincidían en algo inquietante: el error no había sido un descuido. Scroge sabía exactamente lo que iba a pasar. Había forzado la actualización, ignorado advertencias internas y firmado las autorizaciones necesarias. Algunos sostenían que buscaba provocar el colapso para cobrar seguros, otros creían que se trató de una forma de cerrar una etapa de su vida que ya no soportaba.

El resultado fue el mismo. TotalCopy desapareció. Scroge quedó aislado, perdió su prestigio y, pocos meses después, fue encontrado muerto en su departamento. La causa nunca fue del todo clara.

Toshiba cerró la noticia. Se quedó mirando la pantalla apagada unos segundos. Pensó en todo eso con calma. Una leve sonrisa se le dibujó en la cara, breve, casi automática, como si algo acabara de encajarle. Volvió a navegar entre noticias hasta que otro titular lo detuvo: Garilda: en el núcleo de la atención.

Era imposible no abrirla. La nota hacía referencia a la reciente entrevista de Martino Lipschitz. En ella, Martino había hablado de aspectos íntimos de su vida, de errores personales y decisiones que nunca antes había hecho públicas. La repercusión fue inmediata. La entrevista marcó un antes y un después en su exposición mediática y lo posicionó aún más como una figura central. Pero no todos salieron ilesos.

Según el artículo, una de las personas más afectadas fue Garilda Calcagnoli, quien había sido amiga cercana de Martino durante su adolescencia. En redes sociales, seguidores y fanáticos comenzaron a señalarla directamente, acusándola de haber sido violenta con él en el pasado.

La nota recopilaba testimonios anónimos. Relataban escenas en pasillos de la escuela, donde Garilda le gritaba delante de otros compañeros, lo trataba de inútil y lo ridiculizaba por su forma de hablar. Otros describían momentos en los que lo insultaba en reuniones grupales, levantando la voz, marcándole errores mínimos, empujándolo a callarse cuando intentaba responder. También se mencionaban discusiones en espacios públicos, donde ella lo enfrentaba con tono agresivo, sin importar quién estuviera mirando.

Sin embargo, el mismo artículo aclaraba que ninguna de esas acusaciones había sido comprobada. No existían denuncias formales ni registros que confirmaran esos hechos. Además, Martino no había mencionado nada de eso en su entrevista. Por el contrario, se había responsabilizado a sí mismo por muchas situaciones de su pasado y evitó señalar directamente a terceros.

Garilda se acercó para ayudarlo con la corbata. Ajustó el nudo con calma, con una cercanía que no decía nada pero lo decía todo. Toshiba levantó la cabeza, quedándose quieto mientras ella terminaba.

Martino estaba frente al espejo, probándose ropa. Se quitaba un traje, se ponía otro, los miraba desde distintos ángulos, pero ninguno lo convencía. No era un problema de talla ni de estilo, simplemente sentía que nada encajaba con lo que estaba por pasar. Al final se quedó quieto, mirando su reflejo sin decidirse del todo.

Entonces, los aplausos empezaron a escucharse. Primero lejanos, después más fuertes. El grito del público llenó el lugar. El telón se abrió y Murray apareció ante todos. La gente estaba eufórica. Murray bailó apenas, sin exagerar, siguiendo el ritmo de la música con movimientos mínimos. El bullicio se fue apagando de a poco.

Murray: ¡qué puto programa tenemos el día de hoy! Creo que batiremos récords, un... ¡jonrón! Tres invitados, dos desconocidos, aunque una de ellas no lo es tanto, gracias a Martino, si no, no sería nadie si no fuese por él.

Murray se sentó y dio la bienvenida a sus primeros invitados: Toshiba y Garilda. El telón se abrió otra vez. Las luces los enfocaron de lleno. Garilda se mostró incómoda, Toshiba claramente molesto. Se sentaron en el sofá.

Murray: ¿cómo están, chicos? ¿Qué te pasó en la mejilla, Toshiba?
Toshiba: ...
Murray: parece grave, ¿alguien te golpeó?
Toshiba: ... solo algo sin importancia
Murray: claro, bien, hola, Garilda, ¿cómo te sientes ante la fama y no tener la vida... aburrida que tienes?
Garilda: ¿de qué hablas?
Murray: esta chica de aquí soportó abusos por una avalancha de fans que defendían a Martino, ¡y no solo eso! También sufrió por la pérdida de Félix, su novio
Garilda: ¿por qué lo dices como si estuviera muerto? Nos separamos porque... porque ya no daba para más la relación
Murray: ... ¿no te enteraste? Mi querida abuela Reiralda me dijo que él había fallecido, mejor dicho... se suicidó
Garilda: ... ¿qué?
Murray: mi abuela tiene muchos contactos, si no mal recuerdo, me dijo que se enteró por un tal viejo de la estación de autobuses
Garilda: ...
Toshiba: ...

Murray anunció a su invitado final. El telón volvió a abrirse y apareció Martino. Se sentó en uno de los sofás, a veces mirando de reojo a Garilda. Ambos se miraban serios, aunque intentaban disimularlo. Nadie decía nada todavía.

Murray: ¡Martino! ¿Cómo estás? Otro programa más, ¿eh?
Martino: sabes, ya empezaba a extrañarte
Murray: (sonrió) ¿sí, verdad? ¿Quién no extrañaría este set... este... show?
Martino: sí, lo extrañaba, al final del día... Mlive extraña todo lo que tenga que ver con el espectáculo, ¿no?
Murray: ¿Mlive?
Martino: sí... tú lo dijiste, me queda mejor
Murray: ¡jajaja! Tienes toda la razón
Martino: sabes... tengo una sorpresa para ti
Murray: ¿ah, sí?
Martino: un chiste
Murray: bien, te escucho
Martino: toc, toc
Murray: ¿quién es?
Martino: ¡soy yo, Murray! Mlive, vengo a decirte que mi vida se acabó
Murray: ... no entiendo
Martino: ¿no quieres revisar tu celular?
Murray: ...

De pronto, todos empezaron a revisar sus celulares. La audiencia también. La noticia estaba en todos lados: Martino cerraba su página web Living y confirmaba su retiro definitivo de la fama. El silencio fue total. Nadie hablaba, pero todos estaban sorprendidos. Murray parecía olvidar cómo seguir con el programa. El rating subía, pero él se sentía cada vez peor. Quería gritar, pero se contenía. Martino miraba al frente con una sonrisa tranquila. Toshiba también sonreía.

Toshiba: fue una muy buena decisión, ¡jajaja!
Martino: Toshiba, mejor cállate, puto idiota
Toshiba: ...

Garilda estaba decepcionada, pero al mismo tiempo entendía a Martino. No lo aprobaba del todo, pero sabía que había algo más detrás de esa decisión. Murray se levantó. Caminó hacia el centro del set con pasos lentos, algo inestables. Se detuvo en el medio.

Murray: creo que... ¡vamos a un corte comercial! ¿Bien?
Martino: ¡vamos, Murray! Un corte comercial suena excelente

Luego se dio vuelta y miró a Martino. Se quedaron observándose. Uno con rabia acumulada, el otro con una calma que resultaba provocadora.

Murray: ¿cómo putas pudiste hacer esto? Eres un...
Martino: ¡un maldito genio! Estoy harto de esto, Murray, ¿tú no?
Murray: ... ¿sabes qué? No importa, otras personas tomarán tu lugar, ¡yo! Yo lo voy a tomar, sí, me apropiaré de ti, de tu marca, ¡todo!
Martino: mira, aunque te cambies el nombre de tu documento a Mlive o Martino, no importa, no eres yo, ¿sabes por qué? ¡Porque yo soy diferente!
Murray: ... ¡vete a la puta madre!
Martino: sí... eso mismo hice, ¡jajaja!

Martino empezó a reírse. Al principio sonó como una risa nerviosa, fuera de lugar, pero en segundos se volvió algo imposible de controlar. Se inclinaba hacia adelante, se agarraba el estómago, le faltaba el aire, como si su propio cuerpo no supiera cómo frenar. No era una risa alegre, era desesperada, rota, completamente desbordada. Las luces del estudio comenzaron a parpadear. Primero fue un fallo leve, casi técnico, pero enseguida se volvió constante. El sonido empezó a distorsionarse, los micrófonos chillaban, la música de fondo se mezclaba con ruidos metálicos que ardían en los oídos de todos. Nadie entendía qué estaba pasando. Algunos del público se tapaban las orejas, otros se levantaban de sus asientos sin saber a dónde ir.

Las luces explotaron una por una. No fue todo de golpe, fue progresivo, como si el estudio se estuviera apagando a la fuerza. Cada estallido iluminaba el set por un segundo antes de dejarlo más oscuro. Chispas, humo, gritos. El fuego comenzó a extenderse por las cortinas, por el piso, por los decorados. El set entero se encendía, devorado sin apuro. Y en medio de todo eso, Martino seguía riéndose. No miraba a nadie, no intentaba escapar. Su risa atravesaba el caos, más fuerte que el fuego, más constante que las alarmas. Mientras las llamas consumían el estudio, él permanecía ahí, riéndose como si, por fin, todo tuviera sentido.

## Capítulo 10: Todo Final, Es Extraño

Martino caminaba por el pasillo del Hogar San Gabriel, un lugar de cuidado de ancianos que olía a limpieza reciente y a tiempo detenido. Avanzaba despacio, mirando las puertas cerradas, escuchando ruidos bajos que no terminaban de ser conversaciones. Al fondo, una habitación dejaba escapar una luz clara desde una ventana. Entró.

Ahí estaba su padre, Rubenio, sentado en una silla de ruedas. Al notar su presencia, se puso de pie con esfuerzo y quedó mirando hacia la ventana, sin darse vuelta, como si supiera que Martino estaba ahí pero no necesitara confirmarlo.

Martino: hola, papá, pasaron muchos años, ¿no? Ni un solo mensaje de mi parte. No vine a disculparme (lo mira)
Rubenio: ... (no puede hablar, solo balbucea, aunque eso le duela)
Martino: sí, como pensaba... te dejé sin palabras. (Suspira) me siento como este cuarto, gris, oscuro, una puta mierda... ¿sabías que me invitaron dos veces al programa de Murray? Seguro ni lo conoces. Escribí un final sobre eso, no tiene trama, ni nada más, solo es un final, en el relato como Murray invita a Garilda y Toshiba, sí, investigué sobre él, no lo conoces, ¿verdad? No importa. La cuestión es que también me invita a mí, vamos al programa todos y justamente todo se va a la mierda, yo reía como estúpido y el set se enciende en llamas. La cuestión es... quizás así funciona mi cabeza, cuando todo va normal, se descontrola, incluso lo que aparenta ser normal es más raro, mucho más raro
Rubenio: ... (balbucea más fuerte)
Martino: ... no sé, cambié, o no, creo que no ameritó un arco final para mi propio personaje. En fin, alguna vez deseé tener la vida de Garilda. Sabes, siento que Toshiba, no sé, como si fuera mi doble, pero más estúpido, bueno, mejor dicho... fracasado. Y Murray, bueno, a veces me sentí identificado con él. No te quito más tiempo.

Martino lo observó unos segundos más. Luego giró, caminó hacia la puerta y la abrió. Antes de irse, sin mirarlo, dijo:

&laquo;¿Recuerdas, papá, cuando me dijiste que no sería un escritor? Bueno, tenías razón, no soy nadie, nadie para nadie. Gracias, papá, por mostrarme la realidad de las cosas&raquo;.

Salió y cerró la puerta lentamente. Rubenio quedó inmóvil. Una lágrima se le escapó sin hacer ruido y cayó al suelo. El gris del piso se transformó en un punto muy pequeño de azul. El polvo se limpió apenas con esa lágrima.

La escena se rompió en el tiempo.

2025.

Martino estaba en un salón de clases, sentado con Garilda, Moreno, Álvarez y Santillán. El ambiente era el de siempre, mesas desordenadas, mochilas en el piso, miradas cansadas.

Martino: ¡tengo otro chiste!
Álvarez: ¡no! ¿Otra vez? (decía mientras miraba al suelo casi riendo)
Moreno: mejor no sigas, el silencio es un buen chiste
Santillán: ¡a ver! Lanza el chiste, ¿qué más da?
Garilda: ¿podemos volver al juego? Estábamos bien con las cartas
Martino: bueno, está bien, ya no más chistes, pero... sí decirles que... yo... los quiero
Moreno: ¿a quién putas le importa?
Santillán: yo te odio
Álvarez: ... me caes bien
Garilda: qué malos que son
Martino: ¡jajaja! No me esperaba otra cosa de ustedes.

El timbre sonó fuerte y todos salieron sin ningún orden. En la salida se cruzó con Isadox. Se saludaron de manera simple, sin frenar demasiado. A lo lejos vio a Regina: ¡Hey, Regina!. Regina respondió: ¡Martino! ¡Hola!. Siguió caminando junto a Isadox.

Isadox: ¿y? ¿Cómo vas con esa página web?
Martino: ... pues... siento que debo estar más activo en eso, pronto lo voy a estar, se vienen cositas
Isadox: ... ¿y... te vas a ir a vivir a Tostado? Perdón, ¿a Nuevo Aire?
Martino: sí, bueno, eso creo
Isadox: ¿se lo has dicho?
Martino: ¿a quiénes?
Isadox: ¿a Santillán? ¿Garilda... Leftraru... Brahin? ¡A todos, pues!
Martino: no, solo a ti... por ahora.

The End
</script>

<script>
(function(){
  var TITLE = 'Eternamente Vivo 2';          // título de la obra
  var INTRO = 'Parallax presenta...';
  var FADE = 450, INTRO_MS = 3000;
  var KEY = 'parallax-progreso:' + TITLE;
  function save(n){ try{ localStorage.setItem(KEY, String(n)); }catch(e){} }
  function clear(){ try{ localStorage.removeItem(KEY); }catch(e){} }
  function load(){ try{ var v = parseInt(localStorage.getItem(KEY),10); return isNaN(v)?-1:v; }catch(e){ return -1; } }

  var stage = document.getElementById('stage'),
      box = document.getElementById('box');

  // ---- dividir párrafos muy largos en partes ----
  var MAXLEN = 600;
  function splitLong(s){
    if(s.length <= MAXLEN) return [s];
    var mid = s.length/2, best = -1, bestD = 1e9, re = /[.!?…”"»)]\s+/g, m;
    while((m = re.exec(s))){
      var cut = m.index + m[0].length;
      var d = Math.abs(cut - mid);
      if(cut > 80 && s.length - cut > 80 && d < bestD){ bestD = d; best = cut; }
    }
    if(best < 0){
      var sp = s.indexOf(' ', Math.floor(mid));
      best = sp < 0 ? s.lastIndexOf(' ', Math.floor(mid)) + 1 : sp + 1;
    }
    if(best <= 0 || best >= s.length) return [s];
    return splitLong(s.slice(0,best).trim()).concat(splitLong(s.slice(best).trim()));
  }

  // ---- parseo ----
  var items = [];
  document.getElementById('story').textContent.split('\n').forEach(function(raw){
    var l = raw.trim(); if(!l) return;
    var m;
    if((m = l.match(/^##\s*(Cap[ií]tulo\s*\d+)\s*:\s*(.+)$/i))) items.push({t:'ch',n:m[1],s:m[2]});
    else if(/^The End\.?$/i.test(l)) items.push({t:'end',s:l});
    else if((m = l.match(/^\*\*(.+)\*\*$/))) items.push({t:'tag',s:m[1]});
    else if((m = l.match(/^([A-ZÁÉÍÓÚÑ][^\s:]{0,24}):\s+(.*)$/))){ var dp = splitLong(m[2]); items.push({t:'dlg',n:m[1],s:dp[0]}); for(var k=1;k<dp.length;k++) items.push({t:'p',s:dp[k]}); }
    else splitLong(l).forEach(function(part){ items.push({t:'p',s:part}); });
  });

  function el(cls,txt,tag){var e=document.createElement(tag||'div');e.className=cls;e.textContent=txt;return e}

  function render(it){
    box.innerHTML='';
    if(it.t==='ch'){
      box.appendChild(el('big chnum',it.n));
      box.appendChild(el('big chname',it.s));
    }else if(it.t==='end'){
      box.appendChild(el('big title',it.s));
    }else if(it.t==='tag'){
      box.appendChild(el('tag',it.s));
    }else if(it.t==='dlg'){
      var d=el('p','');
      d.appendChild(el('who',it.n+': ','span'));
      d.appendChild(document.createTextNode(it.s));
      box.appendChild(d);
    }else box.appendChild(el('p',it.s));
  }

  // ---- control ----
  var i=-1, busy=true, stage_=0, finished=false;

  function show(fn){
    busy=true; stage.classList.remove('on');
    setTimeout(function(){ fn(); stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },FADE);
  }

  function prev(){
    if(busy||panelOpen||stage_!==2||i<=0) return;
    finished=false; i--; save(i);
    var it=items[i];
    show(function(){render(it)});
  }

  function next(e){
    if(e && e.type==='click' && e.clientX < window.innerWidth/2){ prev(); return; }
    if(busy||finished||panelOpen) return;
    if(stage_===1){ stage_=2; save(0); show(function(){i=0;render(items[0]);}); return; }
    if(stage_===2){
      if(i+1>=items.length) return;
      i++;
      var it=items[i];
      if(it.t==='end'){ finished=true; clear(); } else save(i);
      show(function(){render(it)});
    }
  }

  // ---- botones: capítulos y reinicio ----
  var panelOpen = false;
  var btnCh = document.getElementById('btnCh'),
      btnReset = document.getElementById('btnReset'),
      panel = document.getElementById('panel'),
      list = document.getElementById('list');

  function showUI(){ btnCh.classList.add('show'); btnReset.classList.add('show'); }
  function setPanel(o){ panelOpen = o; panel.classList.toggle('open', o); }

  items.forEach(function(it, idx){
    if(it.t !== 'ch') return;
    var b = document.createElement('button');
    b.className = 'chi';
    var t = document.createElement('b'); t.textContent = it.s;
    var s = document.createElement('span'); s.textContent = it.n;
    b.appendChild(s); b.appendChild(t);
    b.addEventListener('click', function(e){
      e.stopPropagation();
      setPanel(false);
      if(busy) return;
      i = idx; stage_ = 2; finished = false; save(idx);
      show(function(){ render(items[idx]); });
    });
    list.appendChild(b);
  });

  btnCh.addEventListener('click', function(e){ e.stopPropagation(); if(!busy) setPanel(true); });
  panel.addEventListener('click', function(e){ e.stopPropagation(); setPanel(false); });

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  });

  var armTimer = null;
  btnReset.addEventListener('click', function(e){
    e.stopPropagation();
    if(!btnReset.classList.contains('armed')){
      btnReset.classList.add('armed');
      armTimer = setTimeout(function(){ btnReset.classList.remove('armed'); }, 2500);
      return;
    }
    clearTimeout(armTimer); clear(); location.reload();
  });

  // ---- retomar o intro ----
  var saved = load();
  if(saved >= 0 && saved < items.length && items[saved].t !== 'end'){
    showUI();
    i = saved; stage_ = 2;
    render(items[i]);
    setTimeout(function(){ stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },200);
    document.addEventListener('click',next);
    document.addEventListener('keydown',function(e){
      if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();next();}
    });
    return;
  }

  // ---- intro ----
  setTimeout(function(){
    box.appendChild(el('intro',INTRO));
    stage.classList.add('on');
    setTimeout(function(){
      stage.classList.remove('on');
      setTimeout(function(){
        box.innerHTML=''; box.appendChild(el('big title',TITLE));
        stage.classList.add('on');
        setTimeout(function(){busy=false;stage_=1;showUI();},FADE);
      },FADE);
    },INTRO_MS);
  },200);

  document.addEventListener('click',next);
  document.addEventListener('keydown',function(e){
    if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();next();}
  });
})();
</script>
</body>
</html>
