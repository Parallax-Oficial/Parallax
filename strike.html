<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strike — Parallax</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--fade:450ms}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none}
body{font-family:'Inter',system-ui,sans-serif;cursor:pointer}
#stage{position:fixed;inset:0;display:flex;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  padding:calc(env(safe-area-inset-top,0px) + 32px) 28px calc(env(safe-area-inset-bottom,0px) + 32px);
  text-align:center;opacity:0;transition:opacity var(--fade) ease}
#stage.on{opacity:1}
#box{max-width:34rem;width:100%;margin:auto}
#stage::-webkit-scrollbar{display:none}
.intro{font-size:1.1rem;letter-spacing:.08em;font-weight:400}
.big{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:1.05;letter-spacing:.02em}
.title{font-size:clamp(3rem,16vw,6rem)}
.p{font-size:1.15rem;line-height:1.7;text-align:left;font-weight:400}
.tag{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:1.5rem;text-align:center;line-height:1.3;margin:1.4rem 0 .6rem}
.who{font-weight:600}
.ui{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:10px;z-index:5;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;background:none;border:0;color:#fff;
  opacity:0;pointer-events:none;transition:opacity var(--fade) ease}
.ui.show{opacity:.35;pointer-events:auto}
.ui.show:active,.ui.armed{opacity:1}
</style>
</head>
<body>
<div id="stage"><div id="box"></div></div>
<button class="ui" id="btnReset" aria-label="Reiniciar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
<!-- ============ HISTORIA ============ -->
<script type="text/plain" id="story">
**2019, 5 de marzo.**

Vayey observaba desde una de las ventanas de la Casa Blanca. No hacía falta acercarse demasiado para entender lo que pasaba abajo.

La multitud ocupaba todo el frente, apretada contra las rejas, empujando con el cuerpo y sacudiendo el metal como si fuera frágil. Las máscaras no seguían un patrón. Había payasos con sonrisas exageradas, rostros de zombis mal pintados, caras de famosos deformadas por el plástico, máscaras de películas de terror y algunas más simples, negras, asociadas a grupos armados.

Los policías de fuerzas especiales intentaban mantener la línea, pero cada golpe recibido los obligaba a retroceder un poco más. Vayey chasqueó los dedos sin apartar la vista del caos. Donovich apareció detrás de él casi de inmediato.

**Donovich**
¿Me necesita?

**Vayey**
Trae la caja.

Donovich caminó directo hacia la caja fuerte empotrada en la pared. Introdujo la contraseña con precisión mecánica, abrió la puerta y sacó una caja de VHS. La sostuvo unos segundos, como si evaluara su peso, y luego eligió una cinta. Se acercó al reproductor que estaba adherido a la cabeza de Vayey, no apoyado ni sujetado, sino fusionado de forma definitiva. Insertó el VHS. Vayey cerró los ojos.

Estaban en la cima de un edificio. El viento era constante, no fuerte, pero suficiente para incomodar. Richard estaba al borde, con los pies apenas separados del vacío. Su postura no era dramática, parecía más cansada que desesperada. A unos pasos, Beni lo observaba, sin acercarse demasiado, midiendo cada movimiento.

**Beni**
¡No lo hagas, idiota! ¡Tienes familia! Una esposa, ¡dos hijos!

**Richard**
…Vete… no pienso escucharte. ¡Vete! ¡Traicionero!

**Beni**
Escucha… no me volverás a ver, ¿bien? Pero… por favor, no lo hagas.

**Richard**
…

Antes de que cualquiera de los dos pudiera hacer algo más, una voz irrumpió en el espacio.

**Vayey**
¡No!

**Richard**
¡Jódanse todos! (Se acerca más).

El viento era cada vez más fuerte.

**Vayey**
¡Escucha! Cierra los ojos.

**Richard**
¡Vete a la mierda!

**Vayey**
¡Cierra tus putos ojos!

**Richard**
(Los cerró). ¿Ahora qué?

**Vayey**
Tienes acrofobia.

**Richard**
…¿Qué?

**Vayey**
Miedo a las alturas. Le tienes miedo a las alturas. Una vez… (piensa rápido) de pequeño, viajaste a un lugar muy alto con toda tu familia. Te acercaste tanto que, cuando viste la altura a la que estabas, sentiste un escalofrío incómodo, un escalofrío que hizo erizar incluso ¡los pelos de tus pelotas!

**Richard**
(Abrió los ojos y miró hacia abajo).

Richard dio un paso atrás, lento, como si el cuerpo no le respondiera del todo. Beni no esperó más. Corrió hacia él y lo rodeó con los brazos, apretándolo con fuerza, como si el tiempo dependiera de ese gesto.

Vayey abrió los ojos. Se levantó de inmediato y caminó rápido hacia la ventana. Buscó con la mirada el punto exacto donde antes había visto a un enmascarado de payaso golpeando las rejas con insistencia. Ese lugar ahora estaba vacío. No había rastro de él. Vayey sonrió apenas, lo justo para notarse. Volvió al escritorio y se sentó.

**Vayey**
Otra vez.

**Donovich**
Como diga, señor presidente.

Donovich colocó otro VHS. Vayey cerró los ojos.

Bennett estaba solo en la oficina de seguridad. Frente a él, varios televisores pequeños mostraban distintas zonas del edificio. No parecía aburrido, solo atento. En una de las cámaras apareció un hombre encapuchado, con una máscara de terrorista. En la mano llevaba algo que Bennett no logró identificar, pero bastó para forzar la cerradura y entrar.

Bennett se levantó de golpe y fue hacia su mochila. Metió la mano buscando el arma, revolvió una vez más, con más fuerza, hasta entender que no estaba. Cuando levantó la cabeza, el encapuchado ya avanzaba por el pasillo, cada vez más cerca de la oficina.

Antes de que pudiera reaccionar, alguien se abalanzó (era Vayey… ¡¿OKAY?! ¡¿YA ENTENDISTE?!) sobre el intruso desde un costado. Vayey, con un bate en las manos, descargó el primer golpe directo a la cabeza. No se detuvo. Golpeó una vez más y otra, hasta que el cuerpo cayó sin resistencia.

Vayey abrió los ojos. Donovich retiró el VHS. Vayey se levantó bruscamente, fue hacia la caja y tomó otra cinta con apuro. En el movimiento, la caja cayó al suelo y varias cintas se desparramaron. No las miró. Volvió a sentarse y se colocó el VHS por su cuenta.

Ahora estaba en una cueva. La luz era mínima, irregular. Apenas alcanzaba para ver las paredes húmedas y las siluetas alrededor. Antes de entender dónde estaba, un hombre con una máscara de calavera le dio un golpe seco. Vayey cayó al suelo. Otros hombres se le encimaron, lo sujetaron de brazos y piernas, y comenzaron a atarlo.

Alguien sacó un machete. Otros encendieron velas, una por una, rodeándolo. El ambiente se volvió más cerrado, más pesado.

**Vayey**
¡¿Qué mierda hacen?! ¡Vine a salvarlos!

—Nosotros ya estamos salvados. Y sí, nos salvaste, a todos nosotros.

**Vayey**
…

—Gracias a tu cuerpo, ahora podremos comer otro día más.

**Vayey**
…¿Qué?

—Llevamos 33 días… ¡semanas!

**2019, 5 de marzo.**

Donovich caminaba por los pasillos de la Casa Blanca con calma. Llegó hasta el cuarto del presidente. Se detuvo frente a la puerta un segundo y entró.

**Donovich**
¿Me necesitaba, presidente?

**Ronald**
Sí, ¿qué opinas de todo esto? Quiero saber tu opinión.

**Donovich**
…Pues todo está en orden. Ni una sola marcha ni una huelga. Es un trabajo de admirar, señor presidente.

**Ronald**
Sí, lo sé.

Ronald estaba de espaldas, mirando por la ventana. Hasta que se dio vuelta.

**Ronald**
¿Te acuerdas de mi frase en la campaña?

**Donovich**
…“No los voy a defraudar”.

**Ronald**
Sí, lo sé.

The End
</script>
<script>
(function(){
  var TITLE = 'Strike';
  var INTRO = 'Parallax presenta...';
  var FADE = 450, INTRO_MS = 3000;
  var KEY = 'parallax-progreso:' + TITLE;
  function save(n){ try{ localStorage.setItem(KEY, String(n)); }catch(e){} }
  function clear(){ try{ localStorage.removeItem(KEY); }catch(e){} }
  function load(){ try{ var v = parseInt(localStorage.getItem(KEY),10); return isNaN(v)?-1:v; }catch(e){ return -1; } }
  var stage = document.getElementById('stage'), box = document.getElementById('box');
  
  var MAXLEN = 600;
  function splitLong(s){
    if(s.length <= MAXLEN) return [s];
    var mid = s.length/2, best = -1, bestD = 1e9, re = /[.!?”"»)]\s+/g, m;
    while((m = re.exec(s))){
      var cut = m.index + m[0].length;
      var d = Math.abs(cut - mid);
      if(cut > 80 && s.length - cut > 80 && d < bestD){ bestD = d; best = cut; }
    }
    if(best < 0){
      var sp = s.indexOf(' ', Math.floor(mid));
      best = sp < 0 ? s.lastIndexOf(' ', Math.floor(mid)) + 1 : sp + 1;
    }
    if(best <= 0 || best >= s.length) return [s];
    return splitLong(s.slice(0,best).trim()).concat(splitLong(s.slice(best).trim()));
  }
  
  var items = [];
  document.getElementById('story').textContent.split('\n').forEach(function(raw){
    var l = raw.trim(); if(!l) return;
    var m;
    if(/^The End\.?$/i.test(l)) items.push({t:'end',s:l});
    else if((m = l.match(/^\*\*(.+)\*\*$/))) items.push({t:'tag',s:m[1]});
    else if((m = l.match(/^([A-ZÁÉÍÓÚÑ][^\s:]{0,24}):\s+(.*)$/))){ 
      var dp = splitLong(m[2]); 
      items.push({t:'dlg',n:m[1],s:dp[0]}); 
      for(var k=1;k<dp.length;k++) items.push({t:'p',s:dp[k]}); 
    }
    else splitLong(l).forEach(function(part){ items.push({t:'p',s:part}); });
  });
  
  function el(cls,txt,tag){var e=document.createElement(tag||'div');e.className=cls;e.textContent=txt;return e}
  function render(it){
    box.innerHTML='';
    if(it.t==='end') box.appendChild(el('big title',it.s));
    else if(it.t==='tag') box.appendChild(el('tag',it.s));
    else if(it.t==='dlg'){
      var d=el('p','');
      d.appendChild(el('who',it.n+': ','span'));
      d.appendChild(document.createTextNode(it.s));
      box.appendChild(d);
    }
    else box.appendChild(el('p',it.s));
  }
  
  var i=-1, busy=true, stage_=0, finished=false;
  function show(fn){
    busy=true; stage.classList.remove('on');
    setTimeout(function(){ fn(); stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },FADE);
  }
  function prev(){
    if(busy||stage_!==2||i<=0) return;
    finished=false; i--; save(i);
    show(function(){render(items[i])});
  }
  function next(e){
    if(e && e.type==='click' && e.clientX < window.innerWidth/2){ prev(); return; }
    if(busy||finished) return;
    if(stage_===1){ stage_=2; save(0); show(function(){i=0;render(items[0]);}); return; }
    if(stage_===2){
      if(i+1>=items.length) return;
      i++;
      var it=items[i];
      if(it.t==='end'){ finished=true; clear(); } else save(i);
      show(function(){render(it)});
    }
  }
  
  var btnReset = document.getElementById('btnReset');
  function showUI(){ btnReset.classList.add('show'); }
  var armTimer = null;
  btnReset.addEventListener('click', function(e){
    e.stopPropagation();
    if(!btnReset.classList.contains('armed')){
      btnReset.classList.add('armed');
      armTimer = setTimeout(function(){ btnReset.classList.remove('armed'); }, 2500);
      return;
    }
    clearTimeout(armTimer); clear(); location.reload();
  });
  
  var saved = load();
  if(saved >= 0 && saved < items.length && items[saved].t !== 'end'){
    showUI();
    i = saved; stage_ = 2;
    render(items[i]);
    setTimeout(function(){ stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },200);
    document.addEventListener('click',next);
    document.addEventListener('keydown',function(e){
      if(e.key==='ArrowLeft')prev();
      if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight') next();
    });
    return;
  }
  
  setTimeout(function(){
    box.appendChild(el('intro',INTRO));
    stage.classList.add('on');
    setTimeout(function(){
      stage.classList.remove('on');
      setTimeout(function(){
        box.innerHTML=''; box.appendChild(el('big title',TITLE));
        stage.classList.add('on');
        setTimeout(function(){busy=false;stage_=1;showUI();},FADE);
      },FADE);
    },INTRO_MS);
  },200);
  document.addEventListener('click',next);
  document.addEventListener('keydown',function(e){
    if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight') next();
  });
})();
</script>
</body>
</html>
