<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>obedece — Parallax</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--fade:450ms}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none}
body{font-family:'Inter',system-ui,sans-serif;cursor:pointer}
#stage{position:fixed;inset:0;display:flex;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  padding:calc(env(safe-area-inset-top,0px) + 32px) 28px calc(env(safe-area-inset-bottom,0px) + 32px);
  text-align:center;opacity:0;transition:opacity var(--fade) ease}
#stage.on{opacity:1}
#box{max-width:34rem;width:100%;margin:auto}
#stage::-webkit-scrollbar{display:none}
.intro{font-size:1.1rem;letter-spacing:.08em;font-weight:400}
.big{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:1.05;letter-spacing:.02em}
.title{font-size:clamp(3rem,16vw,6rem)}
.p{font-size:1.15rem;line-height:1.7;text-align:left;font-weight:400}
.tag{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:1.5rem;text-align:center;line-height:1.3;margin:1.2rem 0}
.who{font-weight:600}
.ui{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:5;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;background:none;border:0;color:#fff;
  opacity:0;pointer-events:none;transition:opacity var(--fade) ease}
.ui.show{opacity:.35;pointer-events:auto}
.ui.show:active,.ui.armed{opacity:1}
#btnReset{right:10px}
</style>
</head>
<body>
<div id="stage"><div id="box"></div></div>
<button class="ui" id="btnReset" aria-label="Reiniciar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
<!-- ============ HISTORIA ============ -->
<script type="text/plain" id="story">
**Turet — Analista del Sur**
Podría decirse que Arturo Heck no solamente fue el mejor en su mandato, sino quien elevó sin ninguna duda los puestos de trabajo. Toda su política era eso: trabajos. Millones de pobres salieron de la pobreza.

Caratas escuchó con la cara de quien ya tiene la respuesta lista antes de que terminen la pregunta.

**Caratas — Analista del Norte**
Jacobo Driech implementó las reformas laborales. Fue él, él comenzó este movimiento. Empezó en 1979 y siguen intactas sus reformas. Son leyes. ¡Son normas del universo!

**-:- Iniciando VHS... -:-**

Patrick entró al escenario con el paso de alguien que sabe que la cámara ya lo está grabando. El público llenaba las butacas con ese silencio de gente que vino a que le digan lo que ya piensa.

**Patrick — Conductor del programa**
¿Alguien más está cansado de ver tanta propaganda en las calles?

El público levantó las manos casi al mismo tiempo, con esa energía fácil de quien se siente autorizado a quejarse. Patrick los miró, asintió despacio y siguió.

**Patrick — Conductor del programa**
Sí... yo igual. Y aun así no veo cambios radicales en esta gran nación forjada por pueblos originarios. Pueblos fuertes que, lamentablemente, fueron desplazados de forma injusta. Ahora... otra pregunta: ¿sur o norte? ¿Qué dice el sur?

La mitad del público levantó la mano. La otra mitad esperó su turno.

**Patrick — Conductor del programa**
Okey, ¿y el norte?

La mitad restante respondió igual. Patrick los observó a todos sin cambiar la expresión.

**Patrick — Conductor del programa**
Entiendo. Se cansan de la publicidad del partido ajeno. ¿Todo es rivalidad, no es así? Yo siempre lo dije: no tengo posturas políticas, vivo, existo, y hago todo para solamente existir. Es algo de nuestras raíces, de nuestros pueblos originarios. ¿Acaso se olvidaron de eso? Veo que sí. En fin. ¡Otro episodio! Y abrir con este debate no es por curiosidad, justamente es el tema que vamos a tratar. Espero que ustedes ahí en casa escuchen, comprendan y estén atentos con lo que se va a decir. Su trabajo será ver las fallas, no la lógica.

**-:- Debate 001 -:-**

Teor se sentó frente a los dos analistas con una libreta que no abrió en ningún momento.

**Teor — Preguntador**
¿Qué es la moral?

**Toret — Analista del Sur**
Es un arma de doble filo. Si caemos profundamente en eso, es como caer en un estanque lleno de anguilas.

**Caratas — Analista del Norte**
Es la prueba cabal de que existe la bondad. Los que se oponen deben estar tras las rejas o ser castigados severamente. Así funciona el mundo, está construido a base de la moral.

**Toret — Analista del Sur**
¿Y acaso funciona en el mundo? Porque veo muchas fallas.

**Caratas — Analista del Norte**
También hay fallas en la política de Heck. ¿O me dirás que no?

**Toret — Analista del Sur**
No existen fallas. Falló el gobierno anterior, curiosamente del partido del Norte.

Teor los dejó terminar antes de cambiar el rumbo por completo.

**Teor — Preguntador**
¿Qué necesita la gente para vivir?

Los dos analistas lo miraron fijo, con esa pausa que no es silencio, sino cálculo.

**Toret — Analista del Sur**
¿Una pregunta muy repentina, no cree?

**Caratas — Analista del Norte**
Sí, coincido por primera vez con el Sur.

Teor sonrió sin apuro, como si ya supiera que eso iba a pasar.

**Teor — Preguntador**
¿Tienen miedo de responder?

Ninguno de los dos dijo nada. Toret miró la mesa. Caratas miró a Toret. El silencio duró exactamente lo suficiente para que todo el público en el estudio lo notara.

**Teor — Preguntador**
Finalizamos con las preguntas. Gracias por ver este magnífico prog...

**-:- Corte de señal -:-**

**Otro Relato**

**Tou — Padre de Familia**
Vi los carteles en la calle, esa horrible propaganda. ¿Piensan que somos productos o qué? No lo somos, yo trabajo desde que tenía 18 años y sigo adelante. (Suspira.) La gente es estúpida, vota sin saber. Es mejor Jacobo, él es el inicio de lo mejor de esta nación. Sí... lamentablemente, somos la minoría.

**Jack — Analista Político**
Las familias siempre van a estar en bandos un poco... menos sutiles, digámoslo así. La verdad es que celebran cualquier cosa que les convenga. Cualquiera.

Tou se encontraba en la cena familiar de cada día.

**Tou — Padre de Familia**
...no me miren así, no hay dinero, es un lujo tener esto. ¡Vamos! ¡Coman!

**Chester — Hijo Adolescente**
¿Qué es esto?

**Tou — Padre de Familia**
Pescado, ¿qué otra cosa va a ser?

**Chester — Hijo Adolescente**
Odio el pescado.

**Margara — Madre de Familia**
Es lo que hay. O comes, o te mueres de hambre solo en tu cuarto.

Chester no respondió. Bajó la vista al plato y empujó un pedazo con el tenedor.

Tou extendía la mano sobre la mesa y tomaba las de Margara sin decir nada.

**Margara — Madre de Familia**
(Sonríe.) Coman. Las cosas pronto van a mejorar.

**Otro Relato**

El aula tenía ese olor a encierro de siempre. Julio caminaba entre los pupitres con el tono de quien cree que lo que dice importa más de lo que realmente importa.

**Julio — Profesor de Cultura**
Retomemos. Votar significa dar nuestro granito de arena. Es la democracia en su mejor presencia. Recuerden estas palabras. Las mismas que decía Heck: "Quien tiene miedo de la democracia, que no nazca en una nación libre." Sabias palabras. Muy sabias...

Un alumno levantó la mano desde el fondo.

**Josh — Estudiante**
Esa frase es de Jacobo, no de Heck.

Julio se quedó parado con la boca a medio abrir justo cuando el famoso timbre sonó y le resolvió el problema solo. Los alumnos se levantaron todos al mismo tiempo con esa energía de jaula abierta, agarraron sus cosas y salieron.

**Julio — Profesor de Cultura**
¡Josh! Ven... (Se sentó en el escritorio.)

**Josh — Estudiante**
¿Sí? (Estaba parado frente a él, sin moverse.)

**Julio — Profesor de Cultura**
¿Qué fue eso? ¿Quieres reprobar?

**Josh — Estudiante**
Simplemente señalé un error. ¿Eso es la democracia, no es así?

Julio lo miró unos segundos sin decir nada y después se rio con genuina sorpresa.

**Julio — Profesor de Cultura**
¡Jajaja! Vete, disfruta del recreo. Quizás te haga bien.

Josh se dio vuelta y salió sin apuro. Julio lo vio irse. La puerta se cerró.

**Julio — Profesor de Cultura**
Heck... (Sonríe.) Esta juventud está perdida.

The End
</script>
<script>
(function(){
  var TITLE = 'obedece';
  var INTRO = 'Parallax presenta...';
  var FADE = 450, INTRO_MS = 3000;
  var KEY = 'parallax-progreso:' + TITLE;
  function save(n){ try{ localStorage.setItem(KEY, String(n)); }catch(e){} }
  function clear(){ try{ localStorage.removeItem(KEY); }catch(e){} }
  function load(){ try{ var v = parseInt(localStorage.getItem(KEY),10); return isNaN(v)?-1:v; }catch(e){ return -1; } }
  var stage = document.getElementById('stage'), box = document.getElementById('box');
  
  var MAXLEN = 600;
  function splitLong(s){
    if(s.length <= MAXLEN) return [s];
    var mid = s.length/2, best = -1, bestD = 1e9, re = /[.!?…”"»)]\s+/g, m;
    while((m = re.exec(s))){
      var cut = m.index + m[0].length;
      var d = Math.abs(cut - mid);
      if(cut > 80 && s.length - cut > 80 && d < bestD){ bestD = d; best = cut; }
    }
    if(best < 0){
      var sp = s.indexOf(' ', Math.floor(mid));
      best = sp < 0 ? s.lastIndexOf(' ', Math.floor(mid)) + 1 : sp + 1;
    }
    if(best <= 0 || best >= s.length) return [s];
    return splitLong(s.slice(0,best).trim()).concat(splitLong(s.slice(best).trim()));
  }
  
  var items = [];
  document.getElementById('story').textContent.split('\n').forEach(function(raw){
    var l = raw.trim(); if(!l) return;
    var m;
    if(/^The End\.?$/i.test(l)) items.push({t:'end',s:l});
    else if((m = l.match(/^\*\*(.+)\*\*$/))) items.push({t:'tag',s:m[1]});
    else if((m = l.match(/^([A-ZÁÉÍÓÚÑ][^\s:]{0,24}):\s+(.*)$/))){ 
      var dp = splitLong(m[2]); 
      items.push({t:'dlg',n:m[1],s:dp[0]}); 
      for(var k=1;k<dp.length;k++) items.push({t:'p',s:dp[k]}); 
    }
    else splitLong(l).forEach(function(part){ items.push({t:'p',s:part}); });
  });
  
  function el(cls,txt,tag){var e=document.createElement(tag||'div');e.className=cls;e.textContent=txt;return e}
  function render(it){
    box.innerHTML='';
    if(it.t==='end') box.appendChild(el('big title',it.s));
    else if(it.t==='tag') box.appendChild(el('tag',it.s));
    else if(it.t==='dlg'){
      var d=el('p','');
      d.appendChild(el('who',it.n+': ','span'));
      d.appendChild(document.createTextNode(it.s));
      box.appendChild(d);
    }
    else box.appendChild(el('p',it.s));
  }
  
  var i=-1, busy=true, stage_=0, finished=false;
  function show(fn){
    busy=true; stage.classList.remove('on');
    setTimeout(function(){ fn(); stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },FADE);
  }
  function prev(){
    if(busy||stage_!==2||i<=0) return;
    finished=false; i--; save(i);
    show(function(){render(items[i])});
  }
  function next(e){
    if(e && e.type==='click' && e.clientX < window.innerWidth/2){ prev(); return; }
    if(busy||finished) return;
    if(stage_===1){ stage_=2; save(0); show(function(){i=0;render(items[0]);}); return; }
    if(stage_===2){
      if(i+1>=items.length) return;
      i++;
      var it=items[i];
      if(it.t==='end'){ finished=true; clear(); } else save(i);
      show(function(){render(it)});
    }
  }
  
  var btnReset = document.getElementById('btnReset');
  function showUI(){ btnReset.classList.add('show'); }
  var armTimer = null;
  btnReset.addEventListener('click', function(e){
    e.stopPropagation();
    if(!btnReset.classList.contains('armed')){
      btnReset.classList.add('armed');
      armTimer = setTimeout(function(){ btnReset.classList.remove('armed'); }, 2500);
      return;
    }
    clearTimeout(armTimer); clear(); location.reload();
  });
  
  var saved = load();
  if(saved >= 0 && saved < items.length && items[saved].t !== 'end'){
    showUI();
    i = saved; stage_ = 2;
    render(items[i]);
    setTimeout(function(){ stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },200);
    document.addEventListener('click',next);
    document.addEventListener('keydown',function(e){
      if(e.key==='ArrowLeft')prev();
      if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight') next();
    });
    return;
  }
  
  setTimeout(function(){
    box.appendChild(el('intro',INTRO));
    stage.classList.add('on');
    setTimeout(function(){
      stage.classList.remove('on');
      setTimeout(function(){
        box.innerHTML=''; box.appendChild(el('big title',TITLE));
        stage.classList.add('on');
        setTimeout(function(){busy=false;stage_=1;showUI();},FADE);
      },FADE);
    },INTRO_MS);
  },200);
  document.addEventListener('click',next);
  document.addEventListener('keydown',function(e){
    if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight') next();
  });
})();
</script>
</body>
</html>
