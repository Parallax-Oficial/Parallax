<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nada — Parallax</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--fade:450ms}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none}
body{font-family:'Inter',system-ui,sans-serif;cursor:pointer}
#stage{position:fixed;inset:0;display:flex;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  padding:calc(env(safe-area-inset-top,0px) + 32px) 28px calc(env(safe-area-inset-bottom,0px) + 32px);
  text-align:center;opacity:0;transition:opacity var(--fade) ease}
#stage.on{opacity:1}
#box{max-width:34rem;width:100%;margin:auto}
#stage::-webkit-scrollbar{display:none}
.intro{font-size:1.1rem;letter-spacing:.08em;font-weight:400}
.big{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:1.05;letter-spacing:.02em}
.title{font-size:clamp(3rem,16vw,6rem)}
.p{font-size:1.15rem;line-height:1.7;text-align:left;font-weight:400}
.tag{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:1.5rem;text-align:center;line-height:1.3;margin:1.4rem 0 .6rem}
.ui{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:10px;z-index:5;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;background:none;border:0;color:#fff;
  opacity:0;pointer-events:none;transition:opacity var(--fade) ease}
.ui.show{opacity:.35;pointer-events:auto}
.ui.show:active,.ui.armed{opacity:1}
</style>
</head>
<body>
<div id="stage"><div id="box"></div></div>
<button class="ui" id="btnReset" aria-label="Reiniciar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
<!-- ============ HISTORIA ============ -->
<script type="text/plain" id="story">
El lugar es simple. Una silla colocada en medio de una habitación sin intención de ser nada especial. Las paredes no dicen mucho, no hay cuadros intentando impresionar a nadie ni una ventana dramática que deje entrar una luz bonita.

Es solo un espacio común, de esos que uno podría olvidar en cinco minutos si no fuera por el detalle evidente que está en el centro. En la silla hay un anciano completamente desnudo, con sus pelos en el pecho y otras partes que no puedo mencionar.

Está sentado con tranquilidad como si llevara allí más tiempo del que sería razonable admitir. No sostiene nada en las manos, no parece estar esperando nada, tampoco parece cansado. Solo está ahí, mirando. Y cuando digo mirando, es exactamente eso: mira directo hacia ti.

Sin moverse. Sin gesto. Sin aviso. Directo al lector. A ti. Pequeña criatura que encuentra significados en las palabras.

No habla. No carraspea (si no sabes qué significa, tranquilo, yo tampoco). No hace ningún gesto teatral que sugiera que algo va a pasar. Simplemente mantiene los ojos abiertos y clavados en la misma dirección, con una paciencia que sería inquietante si uno se detuviera demasiado a pensarlo.

De hecho, parece que lo está haciendo ahora mismo. Quizás lleva varios segundos observando. Tal vez minutos. Es difícil medir el tiempo cuando alguien te mira así, sin hacer absolutamente nada más. No es una mirada agresiva ni amable. Es peor que eso.

Es una mirada que no explica nada. Como si estuviera revisando algo en ti, como si estuviera esperando que hagas algo interesante. (No te emociones, probablemente no pase).

El anciano cambia apenas la postura en la silla, un ajuste mínimo de hombros que podría haber ocurrido por comodidad o simplemente porque el cuerpo humano a veces recuerda que existe.

La silla cruje un poco, ese sonido seco que hacen los muebles cuando ya aceptaron su destino en el mundo. (Estoy escribiendo esto a las dos de la mañana y no sé si muchas frases tienen sentido).

El hombre sigue mirando. No parpadea con frecuencia. No tiene prisa. Da la impresión de que podría quedarse así el resto del día sin que eso le cause ningún tipo de problema. A estas alturas uno podría preguntarse qué está pensando. La respuesta más honesta sería: nadie lo sabe. Ni siquiera él parece interesado en aclararlo.

Una mosca aparece en escena. Nadie la invitó, pero las moscas tienen esa costumbre desagradable de participar en momentos donde nadie las quiere. Da un par de vueltas cortas en el aire, como si estuviera evaluando el ambiente con una profesionalidad dudosa.

Luego aterriza, con una precisión que resulta casi ofensiva, justo en la nariz del anciano.

El hombre reacciona apenas. No rompe la mirada que mantiene contigo, lo cual ya empieza a sentirse como un pequeño experimento incómodo. Solo mueve la nariz, intentando que el insecto se vaya por sí solo, como quien espera que un problema menor se resuelva por educación.

La mosca no coopera. (¿No les parece raro la palabra "coopera"?) Se queda ahí, caminando con esa arrogancia microscópica que tienen las moscas. El anciano vuelve a mover la nariz, esta vez con un gesto un poco más evidente. Nada. La mosca parece encantada con su nuevo territorio.

Finalmente levanta la mano y la espanta con un movimiento lento. No exagerado, no dramático. Solo lo suficiente para sacarla de su cara. La mosca vuela unos centímetros, se queda suspendida en el aire y luego vuelve a aterrizar, esta vez cerca de la punta de la nariz, como si estuviera participando en algún tipo de desafío personal. (Las moscas son así. No tienen nada mejor que hacer).

El anciano suspira muy suavemente por la nariz. No aparta la mirada del lector. Eso ya empieza a parecer una decisión consciente. Levanta otra vez la mano, la pasa por delante de la cara y esta vez la mosca finalmente se va.

No muy lejos. Solo lo suficiente como para que el momento termine. El hombre vuelve a apoyar la mano sobre su pierna y continúa mirando exactamente igual que antes.

No hay enojo en su cara. Tampoco alivio. La interrupción no cambió demasiado la situación general. Sigue observando. Con una calma que empieza a sentirse sospechosa.

Tal vez el anciano te reconoce. No en el sentido normal de la palabra, claro. No es que sepa tu nombre ni nada por el estilo. Pero parece que entiende algo sobre ti. Algo pequeño, simple.

Que estás aquí leyendo. Que decidiste seguir con el texto en lugar de cerrar la narrativa hace rato. Que tu cerebro está intentando averiguar por qué un viejo imaginario te mira desde una silla en una habitación que tampoco existe realmente.

(La respuesta corta es porque sigues leyendo. La respuesta larga… bueno, tampoco es tan larga).

El hombre inclina apenas la cabeza, un gesto mínimo que podría haber sido un ajuste de cuello o simplemente una forma de comprobar si sigues ahí. No sonríe. No cambia su expresión. Solo observa. Con esa misma paciencia que parece tener almacenada en cantidades ridículas.

El silencio alrededor del anciano no es solemne ni profundo. Es un silencio común, cotidiano, el tipo de silencio que aparece cuando nadie tiene nada urgente que decir. La silla sigue sosteniéndolo, el piso sigue estando debajo de la silla, y el hombre sigue mirando al lector como si esa fuera la tarea más normal del mundo.

No hay música de fondo. No hay narrador dramático anunciando que algo grande está por ocurrir.

Porque no ocurre.
Ese es el detalle.
Nada ocurre.
Y aun así el anciano sigue mirando.
Tú sigues mirando.

Existen mejores narrativas en la plataforma.
Pero sigues leyendo esto.

Tal vez espera que te incomodes primero. Tal vez está comprobando cuánto tiempo una persona puede tolerar una situación absurda antes de decidir que ya fue suficiente. O tal vez simplemente está sentado porque le gusta sentarse. (No subestimes esa posibilidad. Mucha gente vive así).

Pasa otro momento. Difícil decir cuánto exactamente. El anciano parpadea una vez, despacio, y luego vuelve a abrir los ojos con la misma calma de siempre. Sigue ahí. Igual que al principio.

Mirando.
Directamente a ti.

The End
</script>
<script>
(function(){
  var TITLE = 'Nada';
  var INTRO = 'Parallax presenta...';
  var FADE = 450, INTRO_MS = 3000;
  var KEY = 'parallax-progreso:' + TITLE;
  function save(n){ try{ localStorage.setItem(KEY, String(n)); }catch(e){} }
  function clear(){ try{ localStorage.removeItem(KEY); }catch(e){} }
  function load(){ try{ var v = parseInt(localStorage.getItem(KEY),10); return isNaN(v)?-1:v; }catch(e){ return -1; } }
  var stage = document.getElementById('stage'), box = document.getElementById('box');
  
  var MAXLEN = 600;
  function splitLong(s){
    if(s.length <= MAXLEN) return [s];
    var mid = s.length/2, best = -1, bestD = 1e9, re = /[.!?”"»)]\s+/g, m;
    while((m = re.exec(s))){
      var cut = m.index + m[0].length;
      var d = Math.abs(cut - mid);
      if(cut > 80 && s.length - cut > 80 && d < bestD){ bestD = d; best = cut; }
    }
    if(best < 0){
      var sp = s.indexOf(' ', Math.floor(mid));
      best = sp < 0 ? s.lastIndexOf(' ', Math.floor(mid)) + 1 : sp + 1;
    }
    if(best <= 0 || best >= s.length) return [s];
    return splitLong(s.slice(0,best).trim()).concat(splitLong(s.slice(best).trim()));
  }
  
  var items = [];
  document.getElementById('story').textContent.split('\n').forEach(function(raw){
    var l = raw.trim(); if(!l) return;
    var m;
    if(/^The End\.?$/i.test(l)) items.push({t:'end',s:l});
    else splitLong(l).forEach(function(part){ items.push({t:'p',s:part}); });
  });
  
  function el(cls,txt,tag){var e=document.createElement(tag||'div');e.className=cls;e.textContent=txt;return e}
  function render(it){
    box.innerHTML='';
    if(it.t==='end') box.appendChild(el('big title',it.s));
    else box.appendChild(el('p',it.s));
  }
  
  var i=-1, busy=true, stage_=0, finished=false;
  function show(fn){
    busy=true; stage.classList.remove('on');
    setTimeout(function(){ fn(); stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },FADE);
  }
  function prev(){
    if(busy||stage_!==2||i<=0) return;
    finished=false; i--; save(i);
    show(function(){render(items[i])});
  }
  function next(e){
    if(e && e.type==='click' && e.clientX < window.innerWidth/2){ prev(); return; }
    if(busy||finished) return;
    if(stage_===1){ stage_=2; save(0); show(function(){i=0;render(items[0]);}); return; }
    if(stage_===2){
      if(i+1>=items.length) return;
      i++;
      var it=items[i];
      if(it.t==='end'){ finished=true; clear(); } else save(i);
      show(function(){render(it)});
    }
  }
  
  var btnReset = document.getElementById('btnReset');
  function showUI(){ btnReset.classList.add('show'); }
  var armTimer = null;
  btnReset.addEventListener('click', function(e){
    e.stopPropagation();
    if(!btnReset.classList.contains('armed')){
      btnReset.classList.add('armed');
      armTimer = setTimeout(function(){ btnReset.classList.remove('armed'); }, 2500);
      return;
    }
    clearTimeout(armTimer); clear(); location.reload();
  });
  
  var saved = load();
  if(saved >= 0 && saved < items.length && items[saved].t !== 'end'){
    showUI();
    i = saved; stage_ = 2;
    render(items[i]);
    setTimeout(function(){ stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },200);
    document.addEventListener('click',next);
    document.addEventListener('keydown',function(e){
      if(e.key==='ArrowLeft')prev();
      if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight') next();
    });
    return;
  }
  
  setTimeout(function(){
    box.appendChild(el('intro',INTRO));
    stage.classList.add('on');
    setTimeout(function(){
      stage.classList.remove('on');
      setTimeout(function(){
        box.innerHTML=''; box.appendChild(el('big title',TITLE));
        stage.classList.add('on');
        setTimeout(function(){busy=false;stage_=1;showUI();},FADE);
      },FADE);
    },INTRO_MS);
  },200);
  document.addEventListener('click',next);
  document.addEventListener('keydown',function(e){
    if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight') next();
  });
})();
</script>
</body>
</html>
