Ella se levantó y se fue sin decir más. Él no se movió.

Martino parpadeó rápido, se levantó del césped, giró hacia la criatura y la miró con la cara fría, sin rastro de nada adentro.

## Capítulo 4: A Campo Abierto
La criatura y Martino se quedaron mirándose directo a los ojos, ninguno de los dos parpadeaba ni se movía, como si estuvieran midiendo algo.

Martino: ¡Sacas lo peor de mí! ¡hijo de puta!

La criatura solamente rugía con tonos extraños.

Los dos arrancaron a correr al mismo tiempo, uno hacia el otro, la criatura con sus extremidades largas comiendo terreno rápido y Martino con la daga en la mano apuntando directo.

Cuando estuvieron lo suficientemente cerca la criatura saltó y se abalanzó contra él. El impacto fue seco, todo el peso huesudo de la criatura cayendo encima, el aire saliéndole a Martino de golpe cuando dio contra el suelo.

La daga salió volando y cayó no muy lejos. La criatura levantó una de sus manos con las garras afiladas lista para hacerle daño, pero se quedó quieta unos segundos y después salió huyendo. Martino se levantó, recogió la daga del suelo y fue detrás de ella.

Corrieron a campo abierto hasta que el monte los fue tragando de a poco, y adentro ya no había canto de pájaros ni luz que llegara bien, solo sombra y el ruido de sus propios pasos sobre la tierra.

Martino aminoró el paso, caminando despacio entre los árboles, escuchando ramas partiéndose en algún lado que no podía ver. Después escuchó el sonido de garras raspando madera, rasguños contra un tronco, y se dio vuelta rápido.

Martino: respira agitado: ¡SAL!

Antes de que pudiera reaccionar la criatura apareció por detrás y lo empujó con fuerza, Martino cayó hacia adelante y cuando se dio vuelta ya la vio alejarse más rápido que antes. Se levantó de inmediato y volvió a correr detrás de ella.

La criatura llegó a una torre de caza y empezó a trepar por la estructura con las manos largas agarrando cada travesaño y subiéndose con una velocidad que no tenía ningún esfuerzo visible.

Martino llegó abajo, levantó la vista y empezó a subir por las escaleras. Cuando la criatura llegó a la cima agarró una radio vieja y la lanzó hacia abajo.

Martino intentó apurarse pero pisó mal y se agarró peor, y desde la altura que llevaba el cuerpo se soltó solo.

La daga se fue de su mano mientras caía, pero la criatura saltó desde arriba y lo atrapó antes de que llegara al suelo, absorbiendo el golpe con su propio cuerpo.

Martino, todavía agitado, recogió la daga del suelo. La criatura estaba agotada, con la cabeza agachada, aceptando lo que viniera.

Martino: es hora de que todo termine... no siempre voy a querer ser un hijo de puta, no quiero morir siendo uno...

Martino levantó la mano con la daga en posición, listo, y llegaron los recuerdos.

Yolanda durmiéndose casi todo el día mientras la casa quedaba sin comida ni dinero, Maldonado apareciendo cada vez más seguido golpeando ventanas y paredes, cortando la luz, quitando la cocina, arrancando puertas, y Martino sin saber qué iba a encontrar diferente al día siguiente, durmiendo en una casa que se deshacía sola alrededor de él sin que nadie hiciera nada.

Isadox mirándolo con una calma que dolía más que cualquier grito.

## Capítulo 5: Ser O No Ser Yo

Martino se levantó y estaba en el patio de su casa de la infancia. Ahí estaba él, un Martino de ocho años corriendo solo por el patio, interpretando a un monstruo, después al protagonista, después al acompañante del protagonista, cambiando de voz y de postura cada vez sin que nadie se lo pidiera.

Martino lo miró un momento y el chico frenó, se puso serio y empezó a hablar sobre cómo no había podido salvar a su amigo, con las manos juntas formando un arma, apuntándosela en la cabeza y haciendo el ruido del disparo con la boca sin pestañear.

Después se sentó en la tierra mojada de lluvia con una rama en la mano y dibujó despacio una cara triste simple en el barro, la miró un segundo y empezó a agregarle dientes, un rostro enojado, una lengua y cuernos, hasta que la cara triste dejó de existir.

Hubi: nunca tenés nada claro.
Martino: dejémoslo en... "el que entendió, entendió".
Ryan: todo muy melancólico, pero queremos escuchar algo mejor.
Martino: solamente si me prometen que ustedes tendrán algo que contar.

Todos levantaron los pulgares.

Martino: bien.

Martino estaba en el colegio, apartado de todos, fumando en silencio contra la pared mientras el resto del patio hacía ruido a su alrededor sin que él formara parte de nada de eso.

Sonó el famoso timbre y todos empezaron a moverse hacia los salones. Martino se sentó solo, sin prestarle atención a nada, siguiendo con el cigarro y los pies en el pupitre.

Ryan: ¿no te decían nada por fumar?
Martino: era un problema, al cual... todos los profesores ya no se molestaban.

Martino caminaba por el pasillo cuando escuchó su nombre saliendo de la sala de profesores. Se apoyó despacio contra la puerta entornada y se quedó quieto, escuchando.

Voz: ¡Estoy harto de él! Verlo así, sin hacer nada, ¡fumando! Que es lo peor, es como... no sé, un insulto sin insultarme.
Voz: suspira: no podemos hacer nada, da igual, es un chico al que le da igual todo.

Martino se fue sin hacer ruido.

Hubi: ¿por qué fumabas tanto?
Martino: ... levantó la cabeza: el humo cubre la soledad.
Kloac: ¡uff! Qué poeta.
Ryan: Kloac también fumaba, lo superó, quizás podría ayudarte.
Kloac: sí, es verdad.
Martino: hablaremos de eso luego.
Ryan: tengo una duda... ¿tenías amigos?
Martino: ...

Estaba en su cumpleaños de quince años, en medio de todo pero sin ser parte de nada, sin preocuparse por hablar ni por hacer que el ambiente fuera mejor o peor. Simplemente estaba ahí. Garilda se acercó y le entregó su obsequio. Martino lo miró.

Martino: no lo quiero.
Garilda: ¿qué? ¿Por qué no? Es algo... bueno, en tu caso es algo que te gusta.
Martino: ¡oigan todos! Ya es tarde, es hora de que se vayan.

Todos se fueron. Tenían ganas de irse.

Ryan: una parte mía se soluciona gracias a mis amigos, ¿por qué te distanciabas?
Martino: ... no lo entenderías.
Hubi: lo mejor que podrías hacer es no evadirlos.
Martino: en mi situación, no es tan fácil.

Estaba fumando tranquilo en el recreo cuando Isadox se acercó.

Isadox: te quiero ver cuando llegues a los 50, no vas a tener fuerzas para seguir con tu marca de Living.
Martino: sonríe: sí... quizás tengas razón.

Martino: ríe poco.

Martino: ¡Isa!
Isadox: ¿sí?
Martino: tú, Santillán y Leiv son... digamos, ¿como Alvin y las Ardillas?

Hubi: ¿Alvin y las Ardillas?

Kloac: contigo nada se entiende.
Ryan: ¿fuiste a la fiesta?
Martino: ...

Martino estaba frente al espejo terminando de ponerse el traje, acomodándose la solapa, cuando su madre y su padre lo interceptaron antes de que pudiera salir.

Marisa: ¿a dónde vas?
Martino: no te importa.
Rubenio: ¡Hey! Si salís, dormís afuera.
Martino: entonces... pónganse la almohada antes de que llegue.

Martino tomó una taza y la dejó caer. El sonido del golpe contra el suelo llenó el silencio y asustó a Rubenio.

Se fue. Al llegar al salón de fiestas, se quedó parado un momento en la entrada, mirando las mesas llenas y las caras conocidas hasta que encontró a sus amigos todos juntos en una sola mesa, jugando a las cartas.

Pitó el cigarro una vez más y caminó hacia ellos. Se sentó sin decir una sola palabra, los miró y todos lo miraron, dejó el cigarro en el borde de la mesa y Santillán le pasó tres cartas sin decir nada.

Las tomó, las abrió en abanico, las miró, tomó una más de la pila y dijo: "paso".

Martino: ... miró hacia abajo: si tuvieran la posibilidad de tener una segunda oportunidad, ¿se verían capaces de mejorar sus vidas?
Hubi: sí.
Kloac: nunca.
Ryan: lo dudo.
Martino: bueno, yo decidí hacer algo distinto.
Hubi: ¿y qué tan distinto es de lo que ya viviste antes?
Martino: ... el alejamiento, era mejor alejarme de mis amigos y dejar de lastimarlos.
Ryan: ¿y qué hay de Rubenio? Esa historia me la conozco de memoria, nunca le reclamaste, nunca le levantaste la voz como sí lo hizo él contigo.
Martino: ... bueno, no quería ser como él, así que mi gesto fue... muy to-
Kloac: bueno, supongo que nadie lo va a decir, pero yo sí. Dejaste en claro una cosa muy obvia, Martino.
Martino: ¿qué?
Kloac: antes eras frío y narcisista, ahora... ¿qué eres?
Martino: ¿contesto yo o lo contestás tú?
Kloac: lo que demostraste ser ahora es...

Todo se congeló. Las caras paradas a mitad de expresión, nadie respiraba ni parpadeaba.

Martino se levantó despacio y se acercó a Hubi, mirándolo de cerca, pasándole la mano delante de los ojos, empujándole el hombro.

Pero nada, probó con otro, mismo resultado. Todos paralizados, como figuras de cera con ropa conocida.

Entonces sintió la punzada en el pecho, seca y profunda, cayó de rodillas en el suelo del salón mientras todo alrededor empezaba a oscurecerse de a poco, desde los bordes hacia el centro, lento pero sin pausa.

Los pasos de Valak se escucharon antes de que apareciera, uno después del otro, el único sonido que quedaba en ese lugar que se estaba apagando.

Martino: ¿qué me sucede?
Valak: ...
Martino: contesta... puta madre, ¡RESPONDE!
Valak: ...

Martino ya no tenía aire, la boca abierta sin que entrara nada, los pulmones apretados sin respuesta.

Valak lo miró con la cara fría, sin detenerse, y siguió caminando tranquilo hasta perderse en la oscuridad.

Martino cayó hacia adelante y quedó inmóvil en el suelo, con los ojos abiertos, mirando sin ver nada.

The End
</script>
<script>
(function(){
  var TITLE = 'Eternamente Vivo 5';
  var INTRO = 'Parallax presenta...';
  var FADE = 450, INTRO_MS = 3000;
  var KEY = 'parallax-progreso:' + TITLE;
  function save(n){ try{ localStorage.setItem(KEY, String(n)); }catch(e){} }
  function clear(){ try{ localStorage.removeItem(KEY); }catch(e){} }
  function load(){ try{ var v = parseInt(localStorage.getItem(KEY),10); return isNaN(v)?-1:v; }catch(e){ return -1; } }
  var stage = document.getElementById('stage'),
      box = document.getElementById('box');
  var MAXLEN = 600;
  function splitLong(s){
    if(s.length <= MAXLEN) return [s];
    var mid = s.length/2, best = -1, bestD = 1e9, re = /[.!?…”"»)]\s+/g, m;
    while((m = re.exec(s))){
      var cut = m.index + m[0].length;
      var d = Math.abs(cut - mid);
      if(cut > 80 && s.length - cut > 80 && d < bestD){ bestD = d; best = cut; }
    }
    if(best < 0){
      var sp = s.indexOf(' ', Math.floor(mid));
      best = sp < 0 ? s.lastIndexOf(' ', Math.floor(mid)) + 1 : sp + 1;
    }
    if(best <= 0 || best >= s.length) return [s];
    return splitLong(s.slice(0,best).trim()).concat(splitLong(s.slice(best).trim()));
  }
  var items = [];
  document.getElementById('story').textContent.split('\n').forEach(function(raw){
    var l = raw.trim(); if(!l) return;
    var m;
    if((m = l.match(/^##\s*(Cap[ií]tulo\s*\d+)\s*:\s*(.+)$/i))) items.push({t:'ch',n:m[1],s:m[2]});
    else if((m = l.match(/^\*\*(.+?)\*\*$/))) items.push({t:'sc',txt:m[1]});
    else if((m = l.match(/^([^:]+):\s*(.+)$/))) items.push({t:'dlr',who:m[1],txt:m[2]});
    else if(l === 'The End') items.push({t:'end'});
    else splitLong(l).forEach(function(p){ items.push({t:'p',txt:p}); });
  });

  var chapters = [], curr = -1;
  items.forEach(function(it,i){
    if(it.t === 'ch'){ chapters.push({i:i,n:it.n,s:it.s}); }
  });

  var view = 0, pending = null, typing = false;
  var btnCh = document.getElementById('btnCh'),
      btnReset = document.getElementById('btnReset'),
      panel = document.getElementById('panel'),
      list = document.getElementById('list');

  function htmlEsc(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderIntro(){
    box.innerHTML =
      '<p class="intro" style="opacity:.8; letter-spacing:.2em; margin-bottom:1.4em">'+INTRO+'</p>'+
      '<h1 class="big title">'+htmlEsc(TITLE)+'</h1>';
    stage.classList.add('on');
    pending = {i:0,t:'ch'};
  }

  function renderChapter(ch){
    box.innerHTML =
      '<p class="big chnum">'+htmlEsc(ch.n)+'</p>'+
      '<h2 class="big chname">'+htmlEsc(ch.s)+'</h2>';
    pending = items[ch.i+1] ? {i:ch.i+1} : null;
  }

  function renderScene(txt){
    box.innerHTML = '<p class="tag">'+htmlEsc(txt)+'</p>';
  }

  function renderPara(txt){
    box.innerHTML = '<p class="p">'+htmlEsc(txt)+'</p>';
  }

  function renderDialogue(who,txt){
    box.innerHTML =
      '<p class="p" style="margin-bottom:.25em"><span class="who">'+htmlEsc(who)+'</span>:</p>'+
      '<p class="p">'+htmlEsc(txt)+'</p>';
  }

  function renderEnd(){
    box.innerHTML =
      '<p class="tag" style="margin-top:4rem">The End</p>'+
      '<p class="p" style="text-align:center;opacity:.5;margin-top:1.5rem">Gracias por leer.</p>';
    pending = null;
    clear();
  }

  function showUI(){
    btnCh.classList.add('show');
    btnReset.classList.add('show');
  }

  function buildChapterList(){
    list.innerHTML = '';
    chapters.forEach(function(ch,idx){
      var btn = document.createElement('button');
      btn.className = 'chi';
      btn.innerHTML = '<b>'+htmlEsc(ch.n)+'</b><span>'+htmlEsc(ch.s)+'</span>';
      btn.onclick = function(){
        closePanel();
        curr = idx;
        view = ch.i;
        save(view);
        renderChapter(ch);
      };
      list.appendChild(btn);
    });
  }

  function openPanel(){
    buildChapterList();
    panel.classList.add('open');
  }

  function closePanel(){
    panel.classList.remove('open');
  }

  function advance(){
    if(pending){
      var p = pending; pending = null;
      if(p.t === 'ch'){
        curr = 0;
        view = chapters[0].i;
        save(view);
        renderChapter(chapters[0]);
        return;
      }
      view = p.i;
      save(view);
      curr = -1;
      for(var c=0;c<chapters.length;c++){
        if(chapters[c].i === view){ curr = c; break; }
      }
      showUI();
    } else {
      view++;
      save(view);
    }
    if(view >= items.length){ renderEnd(); return; }
    var it = items[view];
    switch(it.t){
      case 'ch':
        var chIdx = chapters.findIndex(function(x){return x.i === view;});
        if(chIdx >= 0){ curr = chIdx; renderChapter(chapters[chIdx]); }
        break;
      case 'sc': renderScene(it.txt); break;
      case 'p': renderPara(it.txt); break;
      case 'dlr': renderDialogue(it.who, it.txt); break;
      case 'end': renderEnd(); break;
    }
  }

  btnCh.onclick = function(e){ e.stopPropagation(); openPanel(); };
  panel.onclick = function(){ closePanel(); };
  btnReset.onclick = function(){
    if(confirm('¿Reiniciar la historia desde el principio?')){
      clear();
      location.reload();
    }
  };
  stage.onclick = function(){ if(!panel.classList.contains('open')) advance(); };

  var saved = load();
  if(saved >= 0 && saved < items.length){
    view = saved;
    pending = {i:saved};
  }

  renderIntro();
  setTimeout(function(){ stage.classList.add('on'); }, 50);
  setTimeout(function(){ if(pending) advance(); }, INTRO_MS);
})();
</script>
