<script type="text/plain" id="story">
**1989**

Norman: ¿qué dices? ¿Eh?
Laurieta: ... ¿lo podré ver?
Norman: quizás podría hacer algo
Laurieta: ...

**1991**

Norman: ¿cómo estás?
Salievo: ... las quiero de una puta vez
Norman: sí, pero... tienes un pequeño inconveniente
Salievo: ...
Norman: tendrás que estar aquí dentro
Salievo: ... ¿y... las tendré para toda mi vida?
Norman: sí, para siempre, hasta tu muerte
Salievo: ...

Norman lo llevó a la prisión. Las celdas estaban alineadas, una junto a otra, era una prisión panóptico. Sacó un manojo de llaves y lo encerró en la C-180.

Salievo: ¡hey!
Norman: ...
Salievo: tráelas
Norman: bien
Salievo: ¡y otra cosa!
Norman: ...
Salievo: quiero unos cigarrillos
Norman: ... bien.

Norman se marchó. Salievo se sentó y observó la celda: la cama, el baño, un lavadero y algunos libros. Golpeó la pared y escuchó golpes de vuelta. Sonrió ante la compañía silenciosa.

Norman: ¡aquí tienes!
Salievo: ya era hora
Norman: y tus cigarros.

Le entregó también una caja pesada. Salievo la abrió y encontró unos tacones rojos. Se los colocó y dejó escapar una risa áspera de satisfacción. Entonces se recostó en la sucia y repugnante cama, mirando el techo con telarañas. Bajó su mano hasta sus pantalones. Cerró los ojos e imaginaba bailando con aquellos tacones. Su cuerpo sentía mariposas y su energía se reflejaba en los movimientos rápidos de su mano, jalando su pene repetidas veces. Se detuvo, inhaló y mostró una sonrisa delicada. Al igual que la cama, su pantalón ahora se encontraba viscoso.

**1989**

Laurieta, acompañada por Norman, descendió por el pasillo húmedo que conducía a la celda C-180. El aire olía a hierro y humedad antigua. Frente a la puerta de metal, su voz se quebró.

Laurieta: ¡Salievo!
Salievo: ... ¿Lau?
Laurieta: ¡Salievo!
Salievo: ¡Lau!

Ambos lograron tocarse las manos a través de una estrecha abertura oxidada. Las yemas se rozaron como si bastara ese mínimo contacto para restaurar años de distancia.

Laurieta: ¡no sabes cuánto te extraño!
Salievo: dime, por favor, que ella... ella está bien
Laurieta: ... ¿quién?
Salievo: Elizabeth... ella... ¿cómo está?
Laurieta: bien, pero no importa ella. Lo que importa es que tú estés bien.
Salievo: ... ¿lo tienes?
Laurieta: sí, sí... aquí lo tengo... mierda.
Salievo: ¡¿qué sucede?!
Laurieta: por favor, no te enojes.
Salievo: ¡hija de puta! ¡Yo sabía que lo ibas a perder! ¡Inútil de mierda!

El grito de Salievo rebotó en los muros como un golpe seco. Su furia se desató con un temblor que parecía arrancarle el aire; golpeó la puerta, el suelo, su propio pecho. El metal respondió con un eco que dolía.

Laurieta retrocedió, trastabillando, como si el suelo mismo la empujara hacia atrás. El miedo la hizo temblar, pero más aún, el amor que todavía la ataba a él. Entonces se volvió hacia Norman, con el rostro encendido y la voz partida.

Laurieta: ¡por favor! ¡Enciérrame!
Norman: ... ¿qué?
Laurieta: ¡enciérrame!

Norman la miró con desconcierto, luego asintió. No pidió explicaciones. Solo cumplió el pedido, girando la llave que selló algo más que una puerta. Laurieta fue encarcelada en la C-120.

## Capítulo 1: Rosa

Un año había pasado. En la vieja casa de los Rani, la abuela Glassy seguía ocupándose de su nieta Elizabeth, aguardando todavía la visita de su hija Laurieta. Los días, cada vez más iguales, se volvían una espera sin calendario.

Cuando Glassy llamó a la policía para denunciar la desaparición de Laurieta, recibió una noticia que desfiguró el aire del comedor: su hija había sido trasladada automáticamente a la prisión Rosales Borja. La mujer, incrédula, lo repitió frente a su nieta con una serenidad que parecía prestada, como si contara algo ajeno. Elizabeth no lloró, solo comenzó a escribir. Cada semana enviaba una carta al penal; nunca recibió respuesta.

El pueblo, mientras tanto, no olvidaba.

En las calles, los murmullos llevaban el nombre de Salievo con una mezcla de rabia y repulsión. Nadie necesitaba repetir lo que había hecho: el secuestro, el encierro, las noches interminables en que dos muchachas del pueblo —Cordija Montes y Bárbara Carrioj— dejaron de parecer humanas. Bastaba pronunciar su apellido para que el aire se volviera espeso.

Encendió la cámara, sonrió y repitió la frase: "esto es increíble, me... me excita" unas seis veces. Salievo, entonces, mostró unas botas, un par de botas para el frío, y otras que eran tacones muy malos, tacones pobres. Acercó esos tacones a su nariz y los olió, inhalando profundamente, volviendo a repetir la frase. Se apartó de la cámara y por fin encuadró a ambas chicas amarradas en sillas desgastadas. Se quitó los pantalones y se agachó, lamiendo los pies desnudos de ambas mujeres.

Elizabeth cargaba ese peso sobre los hombros. Sus maestros le hablaban con frialdad, sus compañeros la miraban como si temieran contagiarse de algo invisible. Las burlas eran pocas, pero los silencios eran muchos más. Hasta que un día, las manos que la empujaban en el recreo ya no buscaban juego ni crueldad: buscaban castigo. Y así, sin haber hecho nada, la niña aprendió que el pecado también puede heredarse.

Glassy se quedó un momento más frente a la pared del comedor. Allí estaban las fotos de sus padres. Una imagen de su madre en el jardín de la casa vieja, sosteniendo un canasto con ropa recién lavada. Una foto de su padre sentado en un sillón, con la pierna cruzada y un periódico abierto frente al pecho, la mirada fija en algo que ya no estaba. Otra, más pequeña, mostraba a los dos juntos en la plaza del pueblo, la sonrisa apenas insinuada. Glassy las repasó con los dedos cruzados sobre el vientre. No pensaba en nada; solo las veía.

Caminó hacia la puerta del sótano. La madera crujió como siempre. Bajó los escalones con cuidado. La luz era mínima. Al llegar al final, apartó cajas y viejos muebles hasta que encontró un archivador de metal. Lo abrió y sacó un montón de cartas. Eran de Laurieta, todas dirigidas a Salievo:

"No entiendo por qué me haces esperar, pero me gusta que lo hagas, puedo imaginarte de formas que no creo que quieras que te imagine. Siento algo raro cuando pienso en que puedo molestarte y al mismo tiempo complacerte. Es confuso y me hace sentir viva."

"Tus órdenes no me asustan. Al contrario, espero cada castigo como si fuera un regalo, quiero tus gritos, tus insultos, perderme en tu entrepierna. Me encanta eso, tomar mi cabello con fuerza y luego todo lo demás. Estoy atrapada en esto y no quiero salir, siempre estarás para mí."

Glassy dejó caer las cartas. Se apoyó en la pared del sótano, sin moverse. Nunca imaginó que la relación de su hija fuera así, tan torcida y silenciosa, tan lejos de cualquier amor que ella pudiera reconocer.

Mientras revisaba otra caja, sintió un movimiento detrás de ella. Giró lentamente. Allí estaba un hombre, viejo, delgado, la piel marcada por arrugas profundas y la ropa raída. Sus ojos tenían un brillo extraño, que no era ni amable ni cruel. Solo estaba.

Glassy: ... Marcone... mira esto, nuestra hija, ¿tú la recordabas así?
Marcone: no... fue tu culpa y lo sabes
Glassy: ...
Marcone: imagina que estas cartas llegaran al pueblo, no puedo tocarte pero te juro que voy a matarte
Glassy: ... quiero que estés conmigo
Marcone: lo estoy
Glassy: no de esta forma...

Glassy bajó la mirada, viendo cucarachas ir de un lado a otro. Al levantar la vista, Marcone ya no estaba. Glassy, sin revisar más, solo se marchó. Subió la escalera del sótano sin mirar atrás. El aire de la casa olía a lo de siempre: a cocina, a algo viejo. Entró en la cocina y la vio.

Elizabeth estaba de pie junto a la mesa, con un cuchillo en la mano. No estaba cocinando; lo sostenía como si lo necesitara para algo.

Glassy: ¿Elizabeth?

Ella soltó el cuchillo de golpe y lo dejó caer sobre la madera de la mesa. Se volteó y dejó ver una cara que mostraba sorpresa. Glassy se acercó despacio. Miró el cuchillo, la mano de Elizabeth vacía y la mirada de la nieta que no quería hablar.

Glassy: ¿qué hacías con eso?

Elizabeth negó con la cabeza. Hizo un gesto para apartar la pregunta, como si quisiera ordenar algo invisible sobre la mesa.

Elizabeth: nada

Elizabeth corrió, subiendo las escaleras para encerrarse en su cuarto. Nuevamente, Marcone volvió a hacerse presente.

Marcone: ¿lo ves? ¿Ves en lo que la convirtieron?
Glassy: no tiene la culpa de nada
Marcone: de tal palo tal astilla, esa niña me preocupa, un día de estos va a apuñalarte
Glassy: ¡basta! ¡Vete!
Marcone: ... cuídate.

Marcone retrocedió sin despegar la mirada de Glassy. Desapareció entre las sombras de la cocina-comedor.

## Capítulo 2: La Cárcel Rosa

Los hombres terminaban de pintar las celdas. Era un rosa fuerte, intenso. Las brochas recorrían las paredes, de arriba abajo, con movimientos repetidos. Todo estaba recién pintado. Había olor a pintura en el aire.

Uno de los hombres que se encontraba en la C-180 se agachaba de forma erótica varias veces para alcanzar la parte baja de la pared. Cada vez que lo hacía, se inclinaba más para llamar la atención de Salievo. Él estaba sentado a un lado, lo miraba y sonreía sin decir nada, solo disfrutaba, mientras tocaba su pene suavemente.

—¿Crees que ya he terminado?
Salievo: ... te falta un poco por allá
—¿Sí?... es verdad
Salievo: ve y píntalo

En ese momento, Norman entró fumando un cigarro, compartiendo uno con Salievo.

Norman: ya es suficiente, tú, vete de una vez
Salievo: cómo te gusta dejarme insatisfecho
Norman: no jodas... eso es un asco
Salievo: para ti
Norman: en fin... Laurieta quiere verte, te necesita
Salievo: ... dile que estoy ocupado
Norman: pues... decirle que estás ocupado no ayuda, y en este lugar claramente eso no es una excusa
Salievo: ... bueno, solamente dile que no quiero, no pienso tener sexo con ella
Norman: claro... por cierto, tengo algo de que hablarte
Salievo: escúpelo
Norman: para mañana los presos dejarán de comer gratis, bueno, depende de si literalmente se están muriendo de hambre
Salievo: ¿qué? Y... ¿y cómo mierda es eso?
Norman: tendrás que pagar desde ahora y en adelante
Salievo: ¿y de dónde mierda crees que voy a sacar el dinero?
Norman: muchos presos ahora empezaron pequeños trabajos aquí, esos hombres que pintaban eran presos
Salievo: ¿presos?...
Norman: sí, si querés cooperar vas a ganar dinero, también puedes cobrar en otras cárceles ayudando, o... también en las calles del pueblo
Salievo: ... mierda...
Norman: aunque, ¿sabes qué otra cosa puedes hacer?
Salievo: ... ¿qué?
Norman: ... lo hablé con los demás administradores y dicen que no tienen problema en que algunos presos se prostituyan
Salievo: ¿y tú piensas que me voy a dejar coger?
Norman: no, al menos tú no... pero... hay otra persona que sí
Salievo: ...

Guzmán avanzó por el pasillo central, con las manos detrás de la espalda y una expresión que parecía medir el aire. Cada paso suyo sonaba hueco. Los presos lo seguían con la mirada, algunos con curiosidad, otros con odio tranquilo.

El nuevo administrador, apenas llegado hacía unas horas, se detenía en cada celda apenas unos segundos, como si le bastara un vistazo para entenderlo todo. Los hombres adentro se movían poco, apenas un gesto, una palabra cortada por la desconfianza.

El color rosa brillaba bajo las luces blancas. Guzmán pasó la mano por una pared recién pintada y la retiró enseguida, marchándose. La observó un momento.

Guzmán: rosa... ¿quién fue el idiota?

Norman, que lo acompañaba, evitó contestar. Guzmán siguió su recorrido. Se detuvo frente a un grupo de presos que hablaban bajo, y los miró con la lentitud de quien ya está cansado de todo.

Guzmán: mierdas, esa es la definición que les queda... les queda muy bien, son mucho peor de lo que yo podía imaginarme. No son lo que esperaba.
Norman: ¿y qué esperaba?
Guzmán: ... psicópatas de verdad.

Nadie se movió, excepto un preso, que no se contuvo ante lo que Guzmán dijo.

Florido: así que no somos mucho para ti
Guzmán: ... no intentes intimidarme, nadie logra intimidarme
Florido: ¿seguro? No serías tan hablador si estuvieras aquí dentro
Guzmán: ... Norman...
Norman: ¿sí?
Guzmán: abre la celda
Norman: ... ¿qué?
Guzmán: ya me oíste.

El cerrojo giró. Norman le cedió el paso y Guzmán entró como si nada, como si fuese su propio hogar. Sin mostrar expresión que delatara mucho de él, se acercó a Florido:

Guzmán: te pareces a mi hijo, él... tenía muchos problemas y... tengo que preguntarte, ¿conoces las correas con púas filosas para perros?
Florido: ... ¿de qué hablas?
Guzmán: bueno... hay otros collares, en los que las púas están por dentro del collar; tiras de la correa y al perro le duele. Si el perro hace un movimiento que no debería, es tan fácil como tirar de la correa para corregirlo.
Florido: ...
Guzmán: la cuestión es que muchos dicen que esas correas son crueles; yo pienso que las otras correas son crueles, porque generan perros desobedientes... verte a ti, igual a mi hijo, con sus putas manías, me hace desear tanto golpearte una y otra vez por haberme desobedecido
Florido: estás loco, hijo de puta...
Guzmán: ¿loco? ¿Yo? Pensé que... ustedes se conocen a sí mismos, así van a ver quiénes son los verdaderos locos
Florido: ...
Guzmán: en fin, desde ahora te llamaré hijo, y si no me respetas o me desobedeces... bueno, tiraré de la correa
Florido: ...

Florido dio un pequeño paso, retrocediendo. Guzmán le acarició la cabeza mirándolo a los ojos y luego volvió con Norman, quien volvió a cerrar la celda.

Guzmán: ...
Norman: ¿está bien?
Guzmán: ... sí, creo que ya vi lo suficiente
Norman: antes de que se vaya, quisiera que conociera al nuevo
Guzmán: bien, pero que sea rápido.

Norman lo guió hacia la C-180. Salievo permanecía recostado, fumando, mirando la suciedad de encima. Norman golpeó la puerta y Salievo, sin levantarse, gritó:

Salievo: ¡¿sí?!
Norman: ¿qué haces?
Salievo: ¡viviendo mi libertad! ¡Jajaja!
Guzmán: no me jodas, ¿voy a perder mi tiempo con un comediante asesino?
Salievo: ¿quién es ese que se escucha?
Norman: ¡escucha, Sali! Es el nuevo administrador del pabellón, y quería conocerte.

Norman, luego de pensarlo un momento, se levantó con pereza y se acercó a la puerta, pegando su oído a ella.

Salievo: ¿qué quiere ese?
Norman: solo quiere conocerte. Señor Guzmán, él es Salievo.
Guzmán: ¿Salievo? Es... ¿un nombre ruso?
Salievo: sí, viene de Saliev
Guzmán: muy interesante, gusto en conocerte, pero debo irme
Salievo: bien
Norman: antes quiero llegar a un acuerdo
Guzmán: ¿acuerdo?
Salievo: ...
Norman: mire, la esposa de Salievo está aquí y es la única mujer de Rosales
Guzmán: ¿y eso qué?
Norman: bueno, pues... ¿usted no tendría problema en que esa mujer sea vendida?
Guzmán: ... ¿prostituirla?
Norman: sí, justamente eso
Guzmán: ¿y cuál es el objetivo?
Norman: es solamente para que el señor Salievo gane dinero
Guzmán: ... ¡jajaja! Es el primer chiste que me hace gracia desde que vine a este pueblo, ¡jajaja!
Norman: ...

Salievo no evitó lanzar sus insultos, aunque los dijo en voz baja.

Guzmán: sencillamente es un chiste, ¿no?
Norman: ... no, los presos deben ganar dinero
Guzmán: exacto, y lo harán con un trabajo honesto, uno que logré cambiar en este pueblo de mierda y en esta cárcel
Norman: ...
Guzmán: en fin, mi tiempo se agotó, espero que tengas un buen día, Norman.

Luego de hablar, Guzmán llegó a la salida del pabellón. Sin mirar atrás, caminó por el terreno baldío que separaba la cárcel del pueblo. Sus pasos eran firmes, seguros, y el sonido se perdió entre el viento que cruzaba las paredes rosas. Nadie lo siguió. Nadie dijo nada. Solo quedó el murmullo de la cárcel y el olor a pintura recién puesta flotando en el aire.

## Capítulo 3: Demanda a Puesto Rosa

Florido permaneció sentado en su celda, mirando la pared frente a él. Pensaba en Guzmán, en la manera en que recorría las celdas y los juzgaba a todos sin pestañear. Tocó la pared una vez, después otra, con un ritmo seco y constante. Al principio fue casi automático, pero pronto notó que los golpes no quedaban en silencio.

Del otro lado, un preso escuchó el sonido y respondió con un toque propio. Así comenzó un intercambio sencillo, repetido, que conectaba celda con celda. Cada golpe viajaba de muro en muro, hasta llegar al último, la celda con el único teléfono fijo del pabellón.

El preso que tenía acceso al teléfono tomó el auricular y marcó el número de Norman. Informó, en pocas palabras, que Florido quería verlo. No era un mensaje largo ni adornado; solo la información necesaria.

Norman llegó al pabellón y se dirigió directo a la celda C-134. No hubo saludo ni demora. Entró y cerró la puerta tras de sí.

Norman: ¿qué necesitas?
Florido: ... primero quiero saber si me darás lo que quiero
Norman: ¿y qué es lo que quieres?
Florido: ... prométeme que vas a darme eso
Norman: ...
Florido: ¡prométemelo!
Norman: ¡bien, bien! ¡Sí! Lo prometo
Florido: quiero un puto cuchillo
Norman: ... ¿qué?
Florido: ¡no! No dudes, solo ve y tráeme un puto cuchillo
Norman: ... si no me dices para qué lo quieres, no pienses que te daré un cuchillo, tú que mataste a tus padres
Florido: ...
Norman: habla
Florido: ¿sabes por qué maté a mis padres?
Norman: ...
Florido: ellos iban a matarme, sigo escuchando sus voces, sus insultos, ¡gritos!... nadie me entendía, yo era la víctima... yo... defecaron en mi rostro, me obligaban a vestirme de mujer, se reían... no podía hacer nada, solo debía... obedecer
Norman: ... ya entendí, quieres matar a Guzmán
Florido: ...
Norman: perdóname, Flor, pero... eso va contra mis reglas
Florido: ¿reglas? ¿Me hablas de reglas ahora? ¡Ofreces tu ayuda a todos los presos! ¡Eres cómplice de todos! ¿Y me dices que esto va contra tus reglas? Hiciste cosas peores que todos nosotros... ¡que todos!
Norman: ...

Norman se retiró sin decir más, dejando a Florido sentado, tranquilo y con la mirada fija en el suelo. El movimiento de los internos seguía su curso: algunos trabajaban en tareas asignadas, otros se apoyaban contra las paredes o caminaban de un lado a otro. El silencio era interrumpido solo por órdenes de guardias o pasos que resonaban en los pasillos.

Más tarde, un hombre ingresó a la prisión. Caminó sin vacilar, con pasos medidos, y se dirigió directamente a la celda C-120. Allí se hospedaba Laurieta. No hubo registro innecesario, ni saludos formales, ni presentación. El hombre cruzó la puerta y cerró detrás de sí. Se presentó ante una celda con luces rojas, una cama diferente a las demás celdas; estaban limpias, te seducían con tan solo acostarte un minuto. La celda se había convertido en una habitación exclusivamente para intimar.

Laurieta: hola...
—mierda... esta cárcel sí que explota, ¡jajaja!

## Capítulo 4: Control Rosado

El aula quedó abierta. Minutos después, varios maestros llegaron. Revisaron los bancos, las mochilas, los cajones y cada parte del lugar. Nadie entendía nada. No había testigos, no había explicaciones, solo el cuerpo ausente y las marcas en el piso. Entre los pupitres, una mochila abierta destacaba entre las demás. Era la de Elizabeth. Dentro no había cuadernos, solo papeles desordenados y el hueco que dejaba el cuchillo faltante. Uno de los docentes miró a los demás y negó con la cabeza, sin decir palabra.

Afuera, Elizabeth seguía sentada junto al árbol. Miraba al suelo, con la ropa arrugada y las manos quietas sobre las rodillas. Una maestra salió y la vio. Caminó despacio hacia ella, con una expresión contenida. Se sentó a su lado sin decir nada. Permanecieron así un rato, respirando el aire pesado del final del día. La maestra miró de reojo las manos de Elizabeth. No estaban manchadas, pero temblaban apenas.

Marcone estaba allí, de pie, inmóvil, observando a Elizabeth. Su figura se distinguía con claridad, el gesto sereno, los ojos fijos en la niña. Glassy sintió que el aire se volvía más pesado. El director seguía hablando, sin notar nada. Glassy apenas respiraba. Marcone, sin moverse, le devolvió la mirada. No sonreía, ni mostraba enojo.

Le impuso un castigo, luego lo cambió por otro, y otro más. Dijo que no saldría, que no comería, que no hablaría con nadie. Después, cansada, se arrepintió de todo y murmuró que no la castigaría, pero que igual iba a pagar, de alguna forma, lo que había hecho. Elizabeth quiso escapar a su habitación. Subió los primeros escalones apurada, pero Glassy fue detrás. La alcanzó en la puerta y la sujetó del brazo. La volvió a insultar, ya sin fuerza, como si cada palabra la desgastara más. Y de pronto, le pegó. Una vez, y otra. Con furia, con llanto, sin pensar.

Elizabeth cayó al suelo sin decir nada. Glassy seguía gritando, sintiendo detrás de ella una mirada que la observaba en silencio. Giró apenas la cabeza. Marcone estaba en la sombra del pasillo, viéndola, sin expresión. Glassy se apartó, respirando con dificultad. Salió de la habitación y cerró la puerta de golpe. Dio unos pasos hacia la escalera, llevando una mano al pecho. El aire no le alcanzaba. Su cuerpo se tensó, el dolor subió hasta el cuello, y sin un grito, cayó por los escalones. El sonido seco del golpe fue lo último que se oyó en toda la casa.

Elizabeth salió de la habitación y la vio, a su abuela desplomada en el suelo. Bajó las escaleras despacio, sin dejar de mirar el cuerpo de su abuela. Glassy seguía ahí, tendida en el suelo, con los ojos abiertos y el rostro sin expresión. Parecía mirar algo que ya no estaba. Elizabeth se acercó, la tocó varias veces en el hombro, susurrando apenas una palabra.

Elizabeth: ¿abuela?...

No hubo respuesta. Repitió el llamado una y otra vez, con la misma voz baja, cada vez más débil. Luego se detuvo. La miró un largo rato y se levantó. No lloró. Solo respiró hondo y giró hacia el pasillo. El silencio de la casa era tan profundo que podía oír sus propios pasos. Fue directo al sótano. Al abrir la puerta, un olor fuerte le golpeó el rostro. Bajó igual, cubriéndose la nariz con la manga. Allí todo parecía más viejo que antes. Hurgó entre cajas, trapos y papeles hasta que notó algo extraño: una pequeña tabla suelta en el suelo. Se arrodilló y, con esfuerzo, la levantó.

Debajo había un hueco, y dentro, un pequeño baúl cubierto de polvo. Lo sacó y lo abrió. Dentro había fotografías. En ellas, dos chicas jóvenes: Cordija Montes y Bárbara Carrioj. Sonreían, posaban, se las veía radiantes, como si la vida aún no hubiera tenido tiempo de tocarles la piel. Elizabeth las miró una por una, reconociendo los nombres que el pueblo aún susurraba.

Debajo de las fotos encontró una cinta VHS. No tenía etiqueta. Subió con ella entre las manos, dejando la madera abierta. En la sala, el cuerpo de Glassy seguía en el mismo lugar. Elizabeth lo miró por un instante, sin acercarse, y siguió hacia el televisor. Insertó la cinta y presionó "play". La pantalla parpadeó. Primero se escuchó una respiración, luego una voz masculina. Su padre. La cámara lo mostraba conversando con las dos chicas, en distintos lugares: una cocina, una calle, un parque. Las trataba con cuidado, con una amabilidad forzada. A medida que el video avanzaba, las escenas se volvían más tensas, más oscuras. Las risas se apagaban. Las chicas ya no sonreían. El escenario final era un sótano, el mismo de la casa. Su padre les hablaba con una calma terrible, como si les estuviera explicando algo importante. Luego, la imagen se cortaba. Elizabeth se quedó mirando la pantalla vacía. La cinta seguía girando, pero ya no había sonido. Su reflejo se veía en el vidrio del televisor, quieto, iluminado apenas por la luz gris del aparato. No dijo nada. Solo se sentó en el suelo, con las fotos aún en las manos, mientras afuera la noche caía sin ruido. Volvió a ver a su abuela y notó un charco de sangre esparcirse.

## Capítulo 5: Ambiente Tenso, Ambiente Rosa

Florido: ...

Salió de la celda sin mirar atrás, dejando a Florido con una mezcla de duda y expectación. El pasillo estaba vacío. El eco de sus pasos era lo único que quedaba en ese tramo del penal. Mientras caminaba, Norman encendió un cigarrillo, dio dos caladas y lo apagó antes de llegar al siguiente bloque. Sabía que algo se movía dentro de esa estructura, algo que no tenía que ver con reglamentos ni con vigilancia.

En otra parte de la prisión, Laurieta estaba en otro encuentro íntimo con un cliente, moviéndose sensualmente para él; sin embargo, sus pensamientos no estaban en la situación. Pensó en su hija, Elizabeth. En su voz, en los pocos recuerdos que aún le quedaban sin torcer. Decidió acabar con el "servicio", cosa que enfureció a su cliente. Se fue hasta la reja. Llamó a los guardias con un tono contenido, sin gritar. Al principio no la escucharon, pero insistió. Dos de ellos se acercaron. Les dijo que quería hablar con Norman. No explicó por qué, y los guardias, acostumbrados a pedidos absurdos, igual hicieron el llamado. Minutos después, Norman apareció. Se paró frente a la celda, la observó sin decir nada. Laurieta le habló con un aire distinto, más humano, más dolido. Le pidió ver a Elizabeth. Norman pareció dudar, como si aquella solicitud lo incomodara. Le respondió sin prometer nada, pero tras un breve silencio cambió el gesto. Dijo que tal vez podía ayudarla a salir de ahí, que su caso era distinto, que no había cometido ningún crimen. Laurieta lo miró, incrédula pero esperanzada.

La conversación quedó interrumpida por un ruido seco de botas. Guzmán se acercó. El ambiente cambió de inmediato. Norman enderezó la espalda, Laurieta dio un paso atrás. Guzmán se detuvo frente a la celda y observó la escena con una expresión fría.

Guzmán: ¿qué sucede aquí?
Norman: quiero llevar a esta madre con su hija
Guzmán: ¿te estás burlando de mí? Está presa
Norman: sí, pero... ella no cometió ningún delito
Guzmán: ¿y entonces qué hace aquí?
Norman: ella decidió entrar a la prisión
Guzmán: claro... o sea que si un niño viene y te dice de broma que quiere entrar aquí, ¿ustedes dejarían que se quede? ¿Por más que estaría en un lugar lleno de putos psicópatas?
Norman: ...
Guzmán: libera a esta mujer y llévala a donde no pueda seguir viendo su rostro
Norman: ... claro.

Laurieta y Norman salieron de la prisión. Caminaron juntos por el pasillo. Los guardias fingieron no verlos. El trayecto fue silencioso. El aire del exterior parecía distinto, más denso. Cuando llegaron a la casa, Norman notó algo extraño. La puerta no tenía cerradura, apenas colgaba del marco. Entraron. El interior estaba completamente vacío. Las paredes blancas, sin muebles, sin cuadros, sin huellas de vida. Laurieta caminó por cada habitación, moviendo las manos como si esperara encontrar algo que ya no existía. Norman, en cambio, se detuvo frente a un pequeño mueble empolvado. Sobre él, un portarretrato olvidado. Lo tomó y observó la fotografía con detenimiento. Una familia entera posaba con una rigidez casi teatral. Reconoció a Laurieta, más joven, al hombre que debía ser su padre, y a una niña pequeña que apenas sonreía. Detrás, grabado en el marco de madera, un nombre: Lavievo Rani. El apellido lo golpeó. Lo conocía. Había escuchado las historias en el pueblo, los rumores sobre aquel asesino que marcó una época. Ahora entendía la reserva, el miedo, el silencio. La familia de Laurieta descendía de él. Laurieta seguía revisando la casa, sin notar que Norman ya sabía más de lo que debía. Él dejó el retrato en su sitio y salió unos pasos al patio. Encendió un cigarrillo y miró el cielo, con una expresión que oscilaba entre la pena y la duda.

Mientras tanto, en la prisión, Guzmán recorría el pabellón sin guardias. Llegó hasta la C-134 y abrió la puerta sin previo aviso. Florido estaba sentado, tallando algo con un trozo de metal. Guzmán entró despacio, sacó un arma y le apuntó directo al pecho. Florido levantó la mirada, sin miedo, solo con cansancio.

Florido: ...
Guzmán: ... lamento esto, hijo... pero es lo único que puedo hacer, no has sido un buen hijo
Florido: ¿de qué mierda hablas, loco de mierda?
Guzmán: cada vez que te veo no dejo de pensar en él... ¿eres él?
Florido: ... ¿tu hijo?
Guzmán: eres una puta desgracia... igual que él
Florido: ...
Guzmán: no voy a mentir... siempre soñé con esto, eres una desgracia para mí, para tu madre
Florido: eres igual de loco que todos nosotros, no soy tu hijo
Guzmán: ¡ya lo sé!... ¡es la única forma de liberarme!
Florido: ...

Lo siguiente fue rápido. Florido se abalanzó sobre él con el cuchillo escondido entre las manos. El arma se disparó, pero el sonido se perdió entre los ecos del concreto. Hubo un forcejeo breve, torpe, con movimientos secos y respiraciones agitadas. Guzmán intentó dominarlo, pero Florido no se rindió. Ambos cayeron al suelo, uno buscando sobrevivir, el otro aferrado a una rabia que venía de muy lejos. El ruido atrajo a los guardias. Cuando llegaron, se oyó un disparo. Guzmán se levantó totalmente ileso, viendo a los guardias, quienes le apuntaban; uno de ellos se acercó y le colocó las esposas, llevándolo lejos de la prisión.

Desde la C-180, Salievo vio toda la situación con claridad. Guzmán fue escoltado por los pasillos del penal sin decir una palabra. Llevaba las manos esposadas y el rostro hundido en un gesto de furia contenida. Los guardias lo empujaban con prisa, intentando evitar las miradas de los presos que se asomaban por las rejas. Al llegar al patio exterior, uno de ellos abrió la puerta trasera del auto. Guzmán se detuvo y, con voz firme, exigió su derecho a una llamada. Los hombres se miraron entre sí. Dudaron, pero finalmente lo llevaron a un teléfono fijo. Guzmán marcó un número que conocía de memoria. Norman respondió.

Guzmán: escúchame, tengo poco tiempo, pero puedo pagarte una cantidad muy grande, y no serás despedido
Norman: ¿qué pasó?
Guzmán: ven rápido a la prisión
Norman: pero... estoy con Laurieta, que no encuentra a su hija
Guzmán: ¡eso no importa! ... ven, rápido, libera a Salievo y juntos vayan a la casa de mi hijo, ya sabes la dirección, ¿verdad?
Norman: sí, ¿por qué?
Guzmán: ...

Devolvió el teléfono sin agradecer y subió al vehículo. A varios kilómetros de allí, Norman dejó a Elizabeth en su casa. Le dijo que no saliera, que esperara tranquila. Luego encendió su coche y partió de inmediato hacia la prisión. La noche lo envolvía todo. Al llegar, cruzó sin dificultad los portones. Abrió la celda de Salievo y le indicó que lo siguiera.

Salievo: ¿qué pasa?
Norman: es Guzmán, me llamó para que fuéramos a la casa de su hijo
Salievo: ¿quedaré libre?
Norman: sí, quiere que tortures a su hijo
Salievo: ¿y qué gano haciendo eso?
Norman: a su esposa... Guzmán dijo que tiene los pies más hermosos que ha visto en toda su vida
Salievo: ...

Salieron por la puerta principal, subieron a un auto gris y se marcharon sin mirar atrás. En la ruta, un silencio espeso los acompañó. A la distancia, otro vehículo se desplazaba en dirección contraria. Dentro de él, Guzmán iba junto a un oficial, esposado, mirando fijo por el parabrisas. Reconoció el coche que venía al frente. Norman estaba al volante. A su lado, Salievo, con la mirada perdida. Por unos segundos, ambos autos se alinearon. Guzmán y Norman cruzaron una mirada fugaz, seca, suficiente para entender que la historia no terminaba allí. Después los caminos se bifurcaron. Uno siguió hacia el norte, el otro hacia el sur.

**1985**

En una tarde silenciosa, Glassy tejía una bufanda en la sala de estar. Frente a ella, Elizabeth jugaba en el suelo, distraída, rodeada de juguetes. Laurieta estaba sentada a un costado, conversando con su madre con un tono sereno, como si nada hubiese pasado. La casa tenía un aire de rutina, una paz artificial.

Afuera se escuchó el ruido de una camioneta vieja acercándose por el camino de tierra. El motor se detuvo. La puerta se abrió y se cerró de golpe. Salievo entró sin decir una palabra, pasó junto a las tres sin mirarlas, con el rostro cansado y los zapatos sucios.

Laurieta: ¡hey!
Salievo: ... ¿qué quieres?
Laurieta: ¿qué haces todo el día en el sótano?
Salievo: es un trabajo, no te metas
Laurieta: ¿puedo ayudarte?
Salievo: no... no sigas jodiendo mi paciencia.

Caminó hasta la puerta del sótano, la abrió, y bajó lentamente los escalones. La luz del día se apagaba detrás de las ventanas. Glassy siguió tejiendo, sin levantar la vista. Elizabeth seguía jugando. Laurieta, inmóvil, observaba la puerta del sótano entreabierta. Nadie dijo nada.

The End
</script>

<script>
(function(){
  var TITLE = 'La Familia Rani';          // título de la obra
  var INTRO = 'Parallax presenta...';
  var FADE = 450, INTRO_MS = 3000;
  var KEY = 'parallax-progreso:' + TITLE;
  function save(n){ try{ localStorage.setItem(KEY, String(n)); }catch(e){} }
  function clear(){ try{ localStorage.removeItem(KEY); }catch(e){} }
  function load(){ try{ var v = parseInt(localStorage.getItem(KEY),10); return isNaN(v)?-1:v; }catch(e){ return -1; } }

  var stage = document.getElementById('stage'),
      box = document.getElementById('box');

  // ---- dividir párrafos muy largos en partes ----
  var MAXLEN = 600;
  function splitLong(s){
    if(s.length <= MAXLEN) return [s];
    var mid = s.length/2, best = -1, bestD = 1e9, re = /[.!?…”"»)]\s+/g, m;
    while((m = re.exec(s))){
      var cut = m.index + m[0].length;
      var d = Math.abs(cut - mid);
      if(cut > 80 && s.length - cut > 80 && d < bestD){ bestD = d; best = cut; }
    }
    if(best < 0){
      var sp = s.indexOf(' ', Math.floor(mid));
      best = sp < 0 ? s.lastIndexOf(' ', Math.floor(mid)) + 1 : sp + 1;
    }
    if(best <= 0 || best >= s.length) return [s];
    return splitLong(s.slice(0,best).trim()).concat(splitLong(s.slice(best).trim()));
  }

  // ---- parseo ----
  var items = [];
  document.getElementById('story').textContent.split('\n').forEach(function(raw){
    var l = raw.trim(); if(!l) return;
    var m;
    if((m = l.match(/^##\s*(Cap[ií]tulo\s*\d+)\s*:\s*(.+)$/i))) items.push({t:'ch',n:m[1],s:m[2]});
    else if(/^The End\.?$/i.test(l)) items.push({t:'end',s:l});
    else if((m = l.match(/^\*\*(.+)\*\*$/))) items.push({t:'tag',s:m[1]});
    else if((m = l.match(/^([A-ZÁÉÍÓÚÑ][^\s:]{0,24}):\s+(.*)$/))){ var dp = splitLong(m[2]); items.push({t:'dlg',n:m[1],s:dp[0]}); for(var k=1;k<dp.length;k++) items.push({t:'p',s:dp[k]}); }
    else splitLong(l).forEach(function(part){ items.push({t:'p',s:part}); });
  });

  function el(cls,txt,tag){var e=document.createElement(tag||'div');e.className=cls;e.textContent=txt;return e}

  function render(it){
    box.innerHTML='';
    if(it.t==='ch'){
      box.appendChild(el('big chnum',it.n));
      box.appendChild(el('big chname',it.s));
    }else if(it.t==='end'){
      box.appendChild(el('big title',it.s));
    }else if(it.t==='tag'){
      box.appendChild(el('tag',it.s));
    }else if(it.t==='dlg'){
      var d=el('p','');
      d.appendChild(el('who',it.n+': ','span'));
      d.appendChild(document.createTextNode(it.s));
      box.appendChild(d);
    }else box.appendChild(el('p',it.s));
  }

  // ---- control ----
  var i=-1, busy=true, stage_=0, finished=false;

  function show(fn){
    busy=true; stage.classList.remove('on');
    setTimeout(function(){ fn(); stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },FADE);
  }

  function prev(){
    if(busy||panelOpen||stage_!==2||i<=0) return;
    finished=false; i--; save(i);
    var it=items[i];
    show(function(){render(it)});
  }

  function next(e){
    if(e && e.type==='click' && e.clientX < window.innerWidth/2){ prev(); return; }
    if(busy||finished||panelOpen) return;
    if(stage_===1){ stage_=2; save(0); show(function(){i=0;render(items[0]);}); return; }
    if(stage_===2){
      if(i+1>=items.length) return;
      i++;
      var it=items[i];
      if(it.t==='end'){ finished=true; clear(); } else save(i);
      show(function(){render(it)});
    }
  }

  // ---- botones: capítulos y reinicio ----
  var panelOpen = false;
  var btnCh = document.getElementById('btnCh'),
      btnReset = document.getElementById('btnReset'),
      panel = document.getElementById('panel'),
      list = document.getElementById('list');

  function showUI(){ btnCh.classList.add('show'); btnReset.classList.add('show'); }
  function setPanel(o){ panelOpen = o; panel.classList.toggle('open', o); }

  items.forEach(function(it, idx){
    if(it.t !== 'ch') return;
    var b = document.createElement('button');
    b.className = 'chi';
    var t = document.createElement('b'); t.textContent = it.s;
    var s = document.createElement('span'); s.textContent = it.n;
    b.appendChild(s); b.appendChild(t);
    b.addEventListener('click', function(e){
      e.stopPropagation();
      setPanel(false);
      if(busy) return;
      i = idx; stage_ = 2; finished = false; save(idx);
      show(function(){ render(items[idx]); });
    });
    list.appendChild(b);
  });

  btnCh.addEventListener('click', function(e){ e.stopPropagation(); if(!busy) setPanel(true); });
  panel.addEventListener('click', function(e){ e.stopPropagation(); setPanel(false); });

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  });

  var armTimer = null;
  btnReset.addEventListener('click', function(e){
    e.stopPropagation();
    if(!btnReset.classList.contains('armed')){
      btnReset.classList.add('armed');
      armTimer = setTimeout(function(){ btnReset.classList.remove('armed'); }, 2500);
      return;
    }
    clearTimeout(armTimer); clear(); location.reload();
  });

  // ---- retomar o intro ----
  var saved = load();
  if(saved >= 0 && saved < items.length && items[saved].t !== 'end'){
    showUI();
    i = saved; stage_ = 2;
    render(items[i]);
    setTimeout(function(){ stage.classList.add('on'); setTimeout(function(){busy=false},FADE); },200);
    document.addEventListener('click',next);
    document.addEventListener('keydown',function(e){
      if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();next();}
    });
    return;
  }

  // ---- intro ----
  setTimeout(function(){
    box.appendChild(el('intro',INTRO));
    stage.classList.add('on');
    setTimeout(function(){
      stage.classList.remove('on');
      setTimeout(function(){
        box.innerHTML=''; box.appendChild(el('big title',TITLE));
        stage.classList.add('on');
        setTimeout(function(){busy=false;stage_=1;showUI();},FADE);
      },FADE);
    },INTRO_MS);
  },200);

  document.addEventListener('click',next);
  document.addEventListener('keydown',function(e){
    if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();next();}
  });
})();
</script>
</body>
</html>
